# Netlify konfiguráció – statikus oldal, nincs build.
# A gyökérből publikál (index.html a belépési pont).

[build]
  publish = "."
  command = ""
  # DEPLOY LEÁLLÍTVA: a Netlify minden push után kihagyja a buildet, az utolsó
  # élesített verzió marad kint. Visszakapcsolás: töröld ezt a sort.
  ignore = "exit 0"

# A service worker mindig friss legyen, hogy a frissítések eljussanak
# a klienshez (különben a régi sw.js ragadna a CDN cache-ben).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Technika-ábrák: tartalom-hash helyett stabil fájlnevek (a forrás-gyűjtemény
# azonosítói), és soha nem változnak – így hosszan cache-elhetők.
[[headers]]
  for = "/gif/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
