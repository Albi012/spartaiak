<!DOCTYPE html>
<html lang="hu">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edzésnapló</title>
<meta name="theme-color" content="#0F1317">
<meta name="description" content="Push/pull edzésnapló telefonra – egy kézzel, edzés közben.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Edzésnapló">
<script>try{var _t=localStorage.getItem('gymlog_theme');if(_t==='light'||_t==='dark')document.documentElement.dataset.theme=_t;}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---- Téma tokenek ---------------------------------------------------
   Alap = sötét (teremben ez az alapértelmezett). A rendszer világos
   beállítását követi, ha nincs kézi választás; a kézi váltó a
   [data-theme] attribútummal felülírja. */
:root{
  --bg:#0F1317; --card:#171D24; --card2:#1F2833; --line:#2A343F;
  --ink:#EAF0F5; --mut:#94A2B0; --dim:#6A7885;
  --brass:#E0A93E; --brass-d:#3A2E13; --on-brass:#1A1206;
  --sage:#63C295; --sage-d:#14291E;
  --red:#E9694C; --miss-bg:#3A241E;
  --bar:rgba(15,19,23,.72); --shadow:rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#F4F2EC; --card:#FFFFFF; --card2:#F1EEE6; --line:#E4DFD3;
    --ink:#20262D; --mut:#5C6772; --dim:#95A0AC;
    --brass:#A9740F; --brass-d:#F1E6CB; --on-brass:#211603;
    --sage:#2C9A64; --sage-d:#DDF0E6;
    --red:#C8492C; --miss-bg:#FBE7E0;
    --bar:rgba(244,242,236,.8); --shadow:rgba(40,50,60,.14);
  }
}
:root[data-theme="light"]{
  --bg:#F4F2EC; --card:#FFFFFF; --card2:#F1EEE6; --line:#E4DFD3;
  --ink:#20262D; --mut:#5C6772; --dim:#95A0AC;
  --brass:#A9740F; --brass-d:#F1E6CB; --on-brass:#211603;
  --sage:#2C9A64; --sage-d:#DDF0E6;
  --red:#C8492C; --miss-bg:#FBE7E0;
  --bar:rgba(244,242,236,.8); --shadow:rgba(40,50,60,.14);
}
:root[data-theme="dark"]{
  --bg:#0F1317; --card:#171D24; --card2:#1F2833; --line:#2A343F;
  --ink:#EAF0F5; --mut:#94A2B0; --dim:#6A7885;
  --brass:#E0A93E; --brass-d:#3A2E13; --on-brass:#1A1206;
  --sage:#63C295; --sage-d:#14291E;
  --red:#E9694C; --miss-bg:#3A241E;
  --bar:rgba(15,19,23,.72); --shadow:rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:120px;overscroll-behavior-y:contain;transition:background .25s,color .25s}
body.playing{padding-bottom:0}
body.playing .appbar,body.playing .nav{display:none}
.num,.cond{font-family:'Barlow Condensed',Barlow,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Felső sáv (böngésző mód) */
.appbar{position:sticky;top:0;z-index:40;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.appbar-in{max-width:560px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{width:22px;height:22px;color:var(--brass);flex:none}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--mut);border:1px solid var(--line);background:var(--card);flex:none}
.iconbtn:active{background:var(--card2);transform:scale(.94)}
.svgic{width:22px;height:22px;display:block}
.iconbtn .svgic{width:20px;height:20px}
.daytag .svgic{width:24px;height:24px}
.nav .ic .svgic{width:22px;height:22px;margin:2px auto 0}

.top{padding:22px 0 10px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.pad{padding:15px 16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.small{font-size:13px}

/* Napválasztó / folytatás */
.daybtn{width:100%;text-align:left;padding:15px;display:flex;align-items:center;gap:14px}
.daybtn:active{background:var(--card2)}
.daytag{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1;color:var(--brass);
  width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:1px solid var(--line);border-radius:13px}
.pill{display:inline-block;font-size:11px;letter-spacing:.09em;font-weight:700;color:var(--on-brass);
  background:var(--brass);padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}

/* Kör-progress a Folytatás kártyán (mai készültség) */
.miniring{position:relative;width:46px;height:46px;flex:none}
.miniring svg{width:100%;height:100%;transform:rotate(-90deg)}
.miniring .mr-bg{fill:none;stroke:var(--card2);stroke-width:4}
.miniring .mr-fg{fill:none;stroke:var(--brass);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .35s ease}
.miniring .mr-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--brass)}
.miniring .mr-ic .svgic{width:20px;height:20px}

/* Szett-chipek */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{width:56px;height:56px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .12s,background .12s}
.chip:active{transform:scale(.93)}
.chip .r{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.chip .l{font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.chip.done{background:var(--sage-d);border-color:var(--sage)}
.chip.done .r{color:var(--sage)}
.chip.done .l{color:var(--sage);opacity:.85}
.chip.miss{background:var(--miss-bg);border-color:var(--red)}
.chip.miss .r{color:var(--red)}

/* Súlyállító */
.wt{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card2)}
.wt button{width:64px;height:64px;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:600;color:var(--brass)}
.wt button:active{background:var(--brass-d)}
.wt .val{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;padding:0 4px}
.wt .val span{font-size:16px;color:var(--dim);font-family:Barlow;font-weight:500;margin-left:4px}
.prev{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--brass);font-weight:500}

/* Gombok */
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.btn.ghost{background:transparent;box-shadow:none}
.btn:active{transform:scale(.99);opacity:.9}
.btn:disabled{opacity:.4}

/* Lebegő alsó navigáció (böngésző mód) */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:420px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;display:flex;padding:6px;gap:4px;box-shadow:0 10px 30px var(--shadow);z-index:30}
.nav button{flex:1;padding:9px 4px;border-radius:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.nav button.on{color:var(--brass);background:var(--card2)}
.nav button{position:relative}
.nav .ic{display:block;font-family:'Barlow Condensed',sans-serif;font-size:20px;margin-bottom:2px}
.ndot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid var(--bar);display:none}
.ndot.on{display:block}

/* ---- Edzés-lejátszó (immerzív) ------------------------------------- */
.player{min-height:100dvh;display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 4px}
.ptop .pmid{flex:1;text-align:center;min-width:0}
.ptop .pmid .d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.ptop .pmid .c{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;color:var(--mut)}
.pdots{display:flex;gap:6px;justify-content:center;padding:8px 14px 2px;flex-wrap:wrap}
.pdot{width:26px;height:7px;border-radius:4px;background:var(--card2);border:1px solid var(--line);padding:0}
.pdot.done{background:var(--sage);border-color:var(--sage)}
.pdot.cur{background:var(--brass);border-color:var(--brass);width:34px}
.pmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding:12px 18px;max-width:560px;margin:0 auto;width:100%;overflow-y:auto}
.pname{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;line-height:1.08}
.pmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.pchips{display:flex;gap:10px;flex-wrap:wrap}
.pchips .chip{width:64px;height:64px}
.pchips .chip .r{font-size:27px}
.pfoot{display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;width:100%;position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 55%,transparent)}
.pfoot .btn{margin:0}
.discard{display:block;margin:2px auto 0;padding:8px 14px;color:var(--dim);font-size:13px}

/* Pihenő – kör-időzítő overlay */
.rest{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,13,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rest.on{display:flex}
.rest-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 28px;
  display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 20px 60px var(--shadow);width:min(86vw,330px)}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card2);stroke-width:9}
.ring-fg{fill:none;stroke:var(--brass);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;font-size:52px;font-weight:700}

/* Gyakorlat-fejléc (böngésző nézetekben) */
.exhead{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.exname{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;line-height:1.15}
.tgt{font-size:14px;color:var(--dim);white-space:nowrap}
.done-badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);font-weight:700}
.ssbadge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);font-weight:700;border:1px solid var(--brass);border-radius:999px;padding:2px 8px}
.ssrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--mut);background:var(--brass-d);border-radius:12px;padding:10px 12px}
.ssrow .cur{color:var(--brass);font-weight:700}
.ssrow .arr{color:var(--dim)}
.muscmap{width:100%;max-width:300px;height:auto;display:block;margin:12px auto 4px;color:var(--mut)}
.muscmap.sm{max-width:150px;margin:4px auto 0}
.mgchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.mgchip{font-size:12px;color:var(--mut);background:var(--card2);border-radius:999px;padding:4px 10px;text-transform:capitalize}
.mgchip b{color:var(--brass);font-variant-numeric:tabular-nums}
.mmleg{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:2px;font-size:11px;color:var(--dim)}
.mmleg i{flex:0 0 84px;height:8px;border-radius:5px;background:linear-gradient(90deg,var(--brass),var(--red))}
.mmfold>summary{list-style:none;cursor:pointer;padding:12px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;display:flex;align-items:center;min-height:44px;box-sizing:border-box}
.mmfold>summary::-webkit-details-marker{display:none}
.mmfold>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .18s}
.mmfold[open]>summary::after{transform:rotate(-135deg)}

/* Napló sorok */
.hrow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.spark{width:100%;height:44px;display:block;margin-top:10px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{display:flex;flex-direction:column;align-items:flex-start}
.stat .num{font-size:34px;font-weight:700;line-height:1}
.statlbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:3px}
.pcard{cursor:pointer}
.pcard:active{background:var(--card2)}
.histrow{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.histrow .d{color:var(--mut);font-size:14px;flex:0 0 82px;font-variant-numeric:tabular-nums}
.histrow .w{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;flex:0 0 auto}
.histrow .r{color:var(--dim);font-size:13px;flex:1;text-align:right}
.chartbig{width:100%;height:120px;display:block;margin:6px 0 2px}
.mgrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.mglbl{flex:0 0 74px;font-size:14px;color:var(--mut);text-transform:capitalize}
.mgtrack{flex:1;height:12px;background:var(--card2);border-radius:7px;overflow:hidden}
.mgfill{display:block;height:100%;border-radius:7px}
.mgval{flex:0 0 26px;font-size:18px;font-weight:700;text-align:right}
.toolrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tool{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mut);font-size:13px;font-weight:600}
.tool:active{background:var(--card2)}
.tool .svgic{width:15px;height:15px}
.seg{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{flex:1;background:var(--card);color:var(--mut);border:0;padding:9px 0;font-size:14px;font-weight:600}
.seg button.on{background:var(--brass);color:var(--on-brass)}
.hmwrap{overflow-x:auto;margin-top:8px;padding-bottom:4px}
.hm{display:flex;gap:3px;min-width:min-content}
.hmcol{display:flex;flex-direction:column;gap:3px}
.hmcell{width:13px;height:13px;border-radius:3px;background:var(--card2);flex:none}
.plateres{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center;align-items:flex-end;min-height:60px}
.plate{background:var(--brass);color:var(--on-brass);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;width:38px}
.platesum{text-align:center;margin-top:12px;color:var(--mut)}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow-n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--card2);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.empty{text-align:center;padding:44px 20px 28px;color:var(--dim)}

/* Alsó lap (szett-billentyűzet) */
.sheet{position:fixed;inset:0;background:rgba(8,10,13,.6);display:none;align-items:flex-end;z-index:70;backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.sheet .inner{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px var(--shadow);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kb button{padding:16px 0;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.kb button:active{background:var(--brass-d)}
textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.4}
textarea:focus{outline:2px solid var(--brass);outline-offset:2px}

/* Gyakorlat-jegyzet + fotó */
.exnote{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.exnote-t{font-size:14px;color:var(--mut);white-space:pre-wrap;flex:1;min-width:0}
.exphoto{width:64px;height:64px;object-fit:cover;border-radius:11px;border:1px solid var(--line);flex:none}
.exphoto.lg{width:100%;height:auto;max-height:280px;object-fit:contain;background:var(--card2)}

/* Terv kontra valóság / sérülés – választható címkék */
.whyrow{display:flex;flex-wrap:wrap;gap:8px}
.whyc{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:13px;font-weight:600}
.whyc.on{border-color:var(--brass);color:var(--brass);background:var(--brass-d)}
.sslink{display:block;margin:-4px auto 6px;padding:5px 12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--mut);font-size:12px;font-weight:600}
.sslink.on{border-style:solid;border-color:var(--brass);color:var(--brass);background:var(--brass-d)}

/* Figyelmeztető szalag */
.banner{background:var(--brass-d);border:1px solid var(--brass);color:var(--brass);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}

/* Fotónéző */
.photo{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(6,8,10,.9);padding:16px}
.photo.on{display:flex}
.photo img{max-width:100%;max-height:100%;border-radius:12px}

/* Témázott megerősítő / értesítő modál (a natív confirm/alert helyett) */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,13,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px}
.modal.on{display:flex}
.modal-card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;
  padding:22px 20px;width:min(92vw,380px);box-shadow:0 20px 60px var(--shadow)}

/* ---- Mikro-interakciók: szett-visszajelzés, lap- és nézetváltás -----
   Minden anim csak akkor fut, ha a felhasználó nem kért csökkentett
   mozgást (prefers-reduced-motion). A haptikát a JS adja (navigator.vibrate);
   itt a kísérő vizuális visszajelzés van. */
@media (prefers-reduced-motion: no-preference){
  @keyframes chipPop{0%{transform:scale(1)}42%{transform:scale(1.16)}100%{transform:scale(1)}}
  @keyframes restIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes sheetUp{from{transform:translateY(26px)}to{transform:translateY(0)}}
  @keyframes vtOut{to{opacity:0}}
  @keyframes vtIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  .chip.pop{animation:chipPop .3s cubic-bezier(.25,.8,.3,1.35)}
  .rest.on .rest-card{animation:restIn .3s cubic-bezier(.2,.7,.3,1.25)}
  .sheet.on .inner{animation:sheetUp .26s cubic-bezier(.2,.7,.3,1)}
  ::view-transition-old(appview){animation:vtOut .16s ease both}
  ::view-transition-new(appview){animation:vtIn .24s cubic-bezier(.2,.7,.3,1) both}
}
#app{view-transition-name:appview}
/* Húzható alsó lap: az ujjal-követő eltolás alatt az anim-belépőt kikapcsoljuk */
.sheet .inner{touch-action:pan-y}
.sheet.drag .inner{animation:none;transition:none}
.sheet.snap .inner{transition:transform .2s cubic-bezier(.2,.7,.3,1)}
</style>

const KEY='gymlog_v1';
let storeMode='none';

async function readKey(k){
  // Felhő-szinkron (1. fázis): belépve a felhő az igazság forrása.
  if(k===KEY && window.Auth && Auth.isLoggedIn()){
    try{ const c=await Auth.cloudRead(); if(c!=null){ storeMode='local'; return c; } }catch(e){}
  }
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r&&r.value){storeMode='claude'; return r.value;} } }catch(e){}
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); if(storeMode==='none')storeMode='local';
       return localStorage.getItem(k); }catch(e){ storeMode='none'; }
  return null;
}
// Felhő-push debounce: gyors egymás utáni mentések (szettről szettre) egyetlen
// hálózati írássá vonódnak össze, hogy teremben ne torlódjanak/versenyezzenek.
// A HELYI mentés attól még minden hívásnál azonnal megtörténik (lásd writeKey).
let _cloudTimer=null, _cloudPending=null;
function cloudPush(v){
  _cloudPending=v;
  if(_cloudTimer) return;
  _cloudTimer=setTimeout(()=>{ _cloudTimer=null; const val=_cloudPending; _cloudPending=null;
    if(val!=null && window.Auth && Auth.isLoggedIn()){ try{ Auth.cloudWrite(val); }catch(e){} } }, 1200);
}
// Függőben lévő felhő-írás AZONNALI kiküldése (a debounce megkerülése).
// Törlésnél hívjuk, hogy a tombstone azonnal a felhőbe kerüljön – így egy
// másik eszköz sem hozza vissza a törölt edzést, és nem függ attól, hogy a
// felhasználó vár-e a debounce lejártáig.
function flushCloud(){
  if(_cloudTimer){ clearTimeout(_cloudTimer); _cloudTimer=null; }
  const v=_cloudPending; _cloudPending=null;
  if(v!=null && window.Auth && Auth.isLoggedIn()){ try{ Auth.cloudWrite(v); }catch(e){} }
}
async function writeKey(k,v){
  try{ if(window.storage&&window.storage.set){ await window.storage.set(k,v); return true; } }catch(e){}
  try{ localStorage.setItem(k,v);
       if(k===KEY && window.Auth && Auth.isLoggedIn()) cloudPush(v);  // felhőbe (összevont, fire-and-forget)
       return true; }catch(e){ return false; }
}

async function load(){
  const raw=await readKey(KEY);
  if(raw){ try{ S=Object.assign(S,JSON.parse(raw)); }catch(e){} }
  render();
}
async function save(){
  const v=JSON.stringify({sessions:S.sessions,active:S.active,weights:S.weights,
    notes:S.notes,photos:S.photos,injury:S.injury,lastBackup:S.lastBackup,
    customEx:S.customEx,routines:S.routines,programs:S.programs,hidePlan:S.hidePlan,activeProgram:S.activeProgram,
    deleted:S.deleted,activeT:S.activeT,prog:S.prog,bw:S.bw,sleep:S.sleep});
  const ok=await writeKey(KEY,v);
  if(!ok&&storeMode!=='none'){ storeMode='none'; render(); }
}

// Technika-videó gyakorlatonként. A VIDEO térkép a PONTOS, bedrótozott
// linkeké (exId → teljes URL); ha egy gyakorlathoz nincs itt bejegyzés, a
// nevéből épített YouTube-keresés nyílik (mindig működik, nem rohad el).
// Új pontos linket ide vegyél fel: VIDEO['bench']='https://youtu.be/…'.
const VIDEO={};
function videoUrl(e){
  if(e && VIDEO[e.id]) return VIDEO[e.id];
  const q=encodeURIComponent(((e&&e.n)||'')+' helyes technika gyakorlat');
  return 'https://www.youtube.com/results?search_query='+q;
}
// Gyógytorna-gyakorlat feloldása gyakorlat-defként (a mobilitás rutinhoz).
// 1 szett, a REHAB célból származtatott ismétlés/tartás, testsúly, rövid
// váltás-pihenő. Nem naplózandó „edzés" – csak a lejátszóhoz.
function physioExDef(id){
  for(const reg of REHAB){ const e=reg.ex.find(x=>x.id===id); if(!e) continue;
    const parts=String(e.r).split('×'); const reps=(parts[1]||parts[0]||'10').trim();
    return {id:e.id, n:e.n, mg:REGION_MG[reg.id]||'törzs', s:1, r:reps, w:0, rest:20, inc:2.5, bw:1, ...(e.time?{time:1}:{})}; }
  return null;
}
function exDef(id){ for(const d of PLAN) for(const e of d.ex) if(e.id===id) return e;
  if(S.customEx && S.customEx[id]) return S.customEx[id];
  if(LIB[id]) return LIB[id];
  if(id && id.indexOf('rh_')===0){ const p=physioExDef(id); if(p) return p; }
  return ARCHIVE[id] || {id:id,n:id,s:3,r:'10',w:0,rest:90,inc:2.5}; }
// Nap (edzés) feloldása: beépített PLAN VAGY saját routine VAGY gyógytorna-
// rutin (physio_<testtáj>). A visszaadott alak {id,name,sub,ex:[def,…]}.
function dayDef(id){
  const p=PLAN.find(d=>d.id===id); if(p) return p;
  const r=(S.routines||[]).find(x=>x.id===id);
  if(r) return {id:r.id, name:r.name, sub:r.sub||'', custom:true, ex:r.ex.map(exDef), ssLinks:(r.ssLinks||[]).slice()};
  if(id && id.indexOf('physio_')===0){ const reg=REHAB.find(x=>x.id===id.slice(7));
    if(reg) return {id, name:'Mobilitás – '+reg.name, sub:'5 perces rutin', custom:true, physio:1, ex:reg.ex.map(e=>physioExDef(e.id))}; }
  return null;
}
// Superset-csoportok származtatása: az `ssLinks`-ben szereplő gyakorlat-ID
// a fölötte lévőhöz kapcsolódik. Egymást követő kapcsolt elemekből egy kör
// (superset) lesz. Csak a 2+ elemű csoportokat adjuk vissza.
function deriveGroups(exIds, links){
  const ls=new Set(links||[]), groups=[]; let cur=null;
  exIds.forEach((id,i)=>{ if(i>0 && ls.has(id) && cur) cur.push(id); else { cur=[id]; groups.push(cur); } });
  return groups.filter(g=>g.length>1);
}
function dayName(s){ const d=dayDef(s.day); return (d&&d.name) || s.dayName || 'Edzés'; }
// Edzéstervek egységes listája: a beépített Alapterv (ha nincs elrejtve) +
// a saját programok. Ebből választható az aktív terv.
function progById(id){
  if(id==='plan') return {id:'plan', name:'Alapterv · Push / Pull', days:['pa','la','pb','lb'], builtin:true};
  const p=(S.programs||[]).find(x=>x.id===id); return p ? {...p, builtin:false} : null;

// Minden választható gyakorlat: beépítettek (PLAN, dedup) + archív + saját.
function exLibrary(){

  PLAN.forEach(d=>d.ex.forEach(e=>{ if(!seen.has(e.id)){ seen.add(e.id); out.push({...e, src:'beépített'}); } }));

function uid(p){ return p+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6); }
function lastFor(id){ for(let i=S.sessions.length-1;i>=0;i--){ const s=S.sessions[i]; if(s.log[id]) return s.log[id]; } return null; }
// Okos súlyugrás: ha minden szett megvolt, a cél feletti túlteljesítés
// arányában nagyobbat lép (nem fix +inc). Pl. 5-ös célnál 11 ismétlés
// → ~4× lépés.
function smartInc(e,l){
  const t=parseInt(e.r);
  if(!l||!l.sets.length) return e.inc;
  const done = l.sets.length>=e.s && l.sets.every(x=>x!=null && x>=t);
  if(!done) return 0;
  const over = Math.min(...l.sets.filter(x=>x!=null)) - t;
  let mult=1; if(over>=6) mult=4; else if(over>=4) mult=3; else if(over>=2) mult=2;
  return e.inc*mult;
}
// -- Progressziós programok (választható, auditálható szabályok) ------
// Saját implementáció. A következő súlyt MINDIG a naplóból származtatjuk,
// nincs elmentett számláló, ami elcsúszhatna. Policy gyakorlatonként
// állítható (S.prog[id]); alapértelmezés a 'smart' (a régi viselkedés).
const POLICIES=['smart','linear','greyskull','double','off'];
const POLICY_NAME={ smart:'Okos (túlteljesítés-arányos)', linear:'Lineáris', greyskull:'Greyskull LP', double:'Dupla progresszió', off:'Fix (nincs auto)' };
const POLICY_DESC={
  smart:'Ha minden ismétlés megvolt, a cél feletti túlteljesítés arányában lép nagyobbat. Ez az alapértelmezés.',
  linear:'Minden ismétlés megvan minden szettben → +inc. 3 sikertelen edzés után −10% visszaépítés.',
  greyskull:'A záró szett maximumig megy. A célt túllépve +inc (duplázva, ha dupla ismétlés). Egy bukás −10%.',
  double:'Egy ismétlés-tartományban dolgozol azonos súllyal; ha minden szett eléri a tetejét → +inc, ismétlések vissza az aljára.',
  off:'A súly ott marad, ahová állítod – nincs automatikus javaslat.'
};
function progPolicy(id){ const p=S.prog&&S.prog[id]; return POLICIES.indexOf(p)>=0 ? p : 'smart'; }
// Hány egymást követő, LEGUTÓBBI naplózott edzés maradt a cél alatt (deloadhoz).
function failStreak(id){ const e=exDef(id), t=parseInt(e.r)||8; let n=0;
  for(let i=S.sessions.length-1;i>=0;i--){ const L=S.sessions[i].log[id]; if(!L) continue;
    const done=L.sets.length>=e.s && L.sets.every(x=>x!=null&&x>=t); if(done) break; n++; }
  return n; }
// A következő súly + indoklás egy befejezett edzés (L={w,sets}) alapján.
function progNext(id,L){
  const e=exDef(id), inc=e.inc||2.5, t=parseInt(e.r)||8, pol=progPolicy(id);
  if(!L||!L.sets||!L.sets.length){
    const w=(S.weights[id]!=null?S.weights[id]:e.w);
    return {w, delta:0, reason:'Első alkalom – a technika a cél.'};
  }
  const cur=L.w, filled=L.sets.filter(x=>x!=null);
  const allDone=L.sets.length>=e.s && filled.length===L.sets.length && filled.every(x=>x>=t);
  const R=w=>roundTo(w,inc);
  const up=(m,why)=>({w:R(cur+inc*m), delta:inc*m, reason:why});
  const same=why=>({w:cur, delta:0, reason:why});
  const down=why=>{ const w=Math.max(inc,R(cur*0.9)); return {w, delta:w-cur, reason:why}; };
  switch(pol){
    case 'off': return same('Fix súly – nincs automatikus progresszió.');
    case 'linear':
      if(allDone) return up(1, `Lineáris: minden ismétlés megvolt (${t}+) → +${inc} kg.`);
      if(failStreak(id)>=3) return down('Lineáris: 3 sikertelen edzés → −10% visszaépítés.');
      return same('Lineáris: nem lett meg minden – maradj a súlyon, próbáld újra.');
    case 'greyskull': { const lastSet=filled.length?filled[filled.length-1]:0;
      if(lastSet>=2*t) return up(2, `Greyskull: záró szett ${lastSet} ism (≥2×${t}) → +${inc*2} kg.`);
      if(lastSet>=t)   return up(1, `Greyskull: záró szett ${lastSet} ism (≥${t}) → +${inc} kg.`);
      return down(`Greyskull: záró szett ${lastSet} < ${t} → −10%.`); }
    case 'double': { const hi=t, lo=Math.max(1,hi-3);
      if(allDone) return up(1, `Dupla: minden szett elérte a ${hi}-t → +${inc} kg (ismétlések vissza ${lo}-re).`);
      return same(`Dupla: dolgozz ${lo}–${hi} ism között azonos súllyal, amíg mind ${hi} nem lesz.`); }
    default: { const d=smartInc(e,L);
      if(d>0){ const over=Math.min(...filled)-t; return {w:R(cur+d), delta:d, reason:`Okos: +${over} a célon → +${d} kg.`}; }
      return same('Okos: nem lett meg minden ismétlés → marad a súly.'); }
  }
}
function startW(id){
  const l=lastFor(id);
  if(l) return Math.max(0, progNext(id,l).w);
  if(S.weights[id]!=null) return S.weights[id];
  return exDef(id).w;
}
// Progressziós szabály választó gyakorlatonként.

function setProgPolicy(id,p){ if(!S.prog) S.prog={};

// Egy edzés összterhelése: súly × ismétlés összegezve (testsúlyos szettek
// 0 súllyal szerepelnek, ezért ez a terhelt súlyra fókuszáló, relatív szám).
function sessionLoad(s){ let sum=0; for(const id in s.log){ const l=s.log[id]; const w=l.w>0?l.w:0;
  l.sets.forEach(r=>{ if(r!=null) sum+=w*r; }); } return Math.round(sum); }

function fmtDate(t){const d=new Date(t);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
// A ' kg' egységet a hívók fűzik hozzá (e.bw && w<=0 esetén nem). Ezért itt
// a testsúlyos (idős is) gyakorlatnál csak '+hozzáadott' vagy 'testsúly',

function reducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function _paint(){

  else if(editing==='routine') a.innerHTML = builderView();
  else if(playing && S.active) a.innerHTML = playerView();

let _viewKey='__init__';
function render(){
  const immersive = (playing && !!S.active) || !!editing;
  document.body.classList.toggle('playing', immersive);
  const key = editing?('edit:'+editing):(playing&&S.active?'play':tab);
  const viewChanged = key!==_viewKey && _viewKey!=='__init__';
  _viewKey = key;
  if(viewChanged && !reducedMotion() && document.startViewTransition){
    document.startViewTransition(_paint);
  } else _paint();
  if(viewChanged) requestAnimationFrame(runCountUps);   // nagy statok felszámolása belépéskor
}
// Nagy stat-számok „felpörgetése" 0-ról a valós értékre (csak nézetbe lépéskor).
function runCountUps(){
  if(reducedMotion()) return;
  document.querySelectorAll('#app [data-cu]').forEach(el=>{
    const to=parseInt(el.dataset.cu,10); if(!(to>0)) return;
    const dur=560, t0=performance.now();
    const step=(t)=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(to*e); if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

// „Mit edzek ma?" – az aktív terv azon napját ajánlja, amelyik a legtöbb,
// ezen a héten elhanyagolt (kevés szettet kapott) izomcsoportot fedi le.
function suggestDay(){
  const act=activeProg(); if(!act||!act.days||!act.days.length) return null;
  const wk=weeklyMgSets();
  let needy=MGS.filter(mg=>!wk[mg]);                       // ezen a héten 0 szett
  if(!needy.length) needy=[...MGS].sort((a,b)=>(wk[a]||0)-(wk[b]||0)).slice(0,2);
  const needSet=new Set(needy);
  let best=null;
  act.days.forEach(dId=>{ const d=dayDef(dId); if(!d) return;
    const covered=new Set(); d.ex.forEach(e=>{ if(needSet.has(e.mg)) covered.add(e.mg); });
    const last=[...S.sessions].reverse().find(s=>s.day===dId), lastT=last?last.t:0;
    if(!best || covered.size>best.score || (covered.size===best.score && lastT<best.lastT))
      best={dayId:dId, name:d.name, score:covered.size, lastT, covers:[...covered]};
  });
  if(!best || best.score===0) return null;
  return {...best, needy};
}
function homeView(){

  if(S.active){

  }

function roundTo(v,step){ return Math.max(0, Math.round(v/step)*step); }
async function startDay(id){
  if(S.active && !(await uiConfirm('Van egy folyamatban lévő edzés. Eldobod és újat kezdesz?', {ok:'Új edzés', danger:true}))) return;
  // Kihagyás-felismerés: 10 napnál hosszabb szünet után visszalépést ajánl.
  const lastT = S.sessions.length ? S.sessions[S.sessions.length-1].t : 0;
  const gap = lastT ? (Date.now()-lastT)/864e5 : 0;
  let deload=false;
  if(gap>10) deload = await uiConfirm(Math.round(gap)+' nap kihagyás.\n\nKérsz visszalépést? (kb. -15% súly és több ismétlés a célhoz, hogy fokozatosan épülj vissza.)', {ok:'Igen, visszalépés', cancel:'Nem'});
  const d=dayDef(id); if(!d){ return; }
  S.active={day:id,t:Date.now(),log:{},deload:deload,dayName:d.name}; S.activeT=Date.now();
  d.ex.forEach(e=>{
    if(exAffected(e)) return;                 // sérülés-mód: érintett gyakorlat kimarad
    let w=startW(e.id);
    if(deload && !e.bw) w=roundTo(w*0.85, e.inc);
    S.active.log[e.id]={w:w,sets:new Array(e.s).fill(null)};
  });
  // Superset-körök: a routine ssLinks-éből, csak a ténylegesen felvett
  // (sérülés miatt ki nem hagyott) gyakorlatokra szűrve. 2+ elemtől él.
  const groups=deriveGroups(d.ex.map(e=>e.id), d.ssLinks)
    .map(g=>g.filter(id=>S.active.log[id])).filter(g=>g.length>1);
  if(groups.length) S.active.ss=groups;
  curEx=0; playing=true; save(); render(); window.scrollTo(0,0);
}

/* ================= AI-terv importálása =============================== *
 * A felhasználó egy külső AI edzőtől kapott edzéstervet illeszt be; az app
 * egy toleráns parserrel ÚJ saját edzéssé/tervvé alakítja. NEM hív LLM-et
 * (offline, kulcs nélkül), és NEM írja felül a meglévő tervet – additív:
 * a meglévő gyakorlatneveket a könyvtárhoz párosítja (így a súlytörténet
 * összekapcsolódik), az ismeretlenekből saját gyakorlatot (cx_) készít. */
const AI_PROMPT_TEMPLATE =
`Készíts nekem egy edzéstervet. A választ PONTOSAN ebben a formátumban add, és semmi mást ne írj köré:

NAP: <nap neve>
- <gyakorlat magyar neve> | <szettek>x<ismétlés> | <súly kg vagy: testsúly> | <pihenő mp>
- ...
NAP: <következő nap neve>
- ...

Példa:
NAP: Push A
- Fekvenyomás | 4x5 | 70 | 180
- Tolódzkodás | 4x8 | testsúly | 150
- Oldalemelés | 3x15 | 8 | 60

Magyar gyakorlatneveket használj, a súlyt kg-ban, a pihenőt másodpercben.`;

function aiNorm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }

// Egy gyakorlat-sor értelmezése (pipe-formátum VAGY szabad szöveg).
function aiParseExLine(body){
  let name='', s=3, r='10', w=0, bw=0, rest=90, hasW=false;
  const sr=(str)=>{ const m=str.match(/(\d+)\s*[x×]\s*([0-9]+(?:\s*[-–]\s*[0-9]+)?|amrap|failure|max)/i);
    if(m){ s=parseInt(m[1])||3; r=m[2].replace(/\s+/g,''); return true; } return false; };
  if(body.indexOf('|')>=0){
    const p=body.split('|').map(x=>x.trim());
    name=p[0]||'';
    if(p[1]){ if(!sr(p[1])){ const rr=p[1].match(/\d+/); if(rr) r=rr[0]; } }
    if(p[2]!=null && p[2]!==''){ const wt=p[2].toLowerCase();
      if(/tests|testsuly|bodyweight|\bbw\b|sajat/.test(aiNorm(wt))){ bw=1; w=0; }
      else { const f=parseFloat(p[2].replace(',','.')); if(!isNaN(f)){ w=f; hasW=true; } } }
    if(p[3]){ const rs=p[3].match(/\d+/); if(rs) rest=parseInt(rs[0]); }
  } else {
    sr(body);
    const wm=body.match(/(\d+(?:[.,]\d+)?)\s*kg/i); if(wm){ w=parseFloat(wm[1].replace(',','.')); hasW=true; }
    if(/tests|testsuly|bodyweight|sajat suly/.test(aiNorm(body))){ bw=1; w=0; }
    name=body.replace(/(\d+)\s*[x×]\s*[0-9\-–]+.*/i,'').replace(/\d+(?:[.,]\d+)?\s*kg.*/i,'').replace(/[-–—|@]+\s*$/,'').trim();
    if(!name) name=body.trim();
  }
  name=(name||'').replace(/\s{2,}/g,' ').trim().slice(0,60);
  if(!name) return null;
  return { name, s:Math.max(1,Math.min(12,s)), r:(r||'10').toString().slice(0,12), w:Math.max(0,w), bw, rest:Math.max(10,Math.min(600,rest)), hasW };
}

// Teljes terv értelmezése napokra + gyakorlatokra. Soha nem dob.
function aiParsePlan(text){
  const lines=(text||'').split(/\r?\n/); const days=[]; let cur=null;
  const startDay=nm=>{ cur={ name:(nm||'Edzés').trim().slice(0,40)||'Edzés', ex:[] }; days.push(cur); };
  for(const raw of lines){
    const line=(raw||'').trim(); if(!line) continue;
    const m=line.match(/^(?:nap|day)\s*\d*\s*[:\-–—]\s*(.+)$/i);
    if(m){ startDay(m[1]); continue; }
    const body=line.replace(/^[-*•·•\d).\s]+/,'').trim(); if(!body) continue;
    const looksEx = /^[-*•·•]/.test(line) || line.indexOf('|')>=0 || /\d+\s*[x×]\s*\d+/i.test(body);
    if(looksEx){ if(!cur) startDay('AI edzés'); const ex=aiParseExLine(body); if(ex) cur.ex.push(ex); continue; }
    if(body.split(/\s+/).length<=5){ startDay(body); }   // rövid cím → nap-fejléc
  }
  return days.filter(d=>d.ex.length);
}

// Név → meglévő gyakorlat-ID párosítás (token-átfedés + tartalmazás).
function aiMatchEx(name){
  const q=aiNorm(name); if(!q) return null;
  const qt=q.split(' ').filter(t=>t.length>=3);
  let best=null, bestScore=0;
  for(const e of exLibrary()){ const en=aiNorm(e.n); if(!en) continue;
    if(en===q) return e;
    const et=en.split(' ');
    let ov=0; qt.forEach(t=>{ if(et.some(x=>x.indexOf(t)===0||t.indexOf(x)===0)) ov++; });
    let score=qt.length? ov/qt.length : 0;
    if(en.indexOf(q)>=0 || q.indexOf(en)>=0) score=Math.max(score,0.9);
    if(score>bestScore){ bestScore=score; best=e; }
  }
  return bestScore>=0.6 ? best : null;
}

// Izomcsoport-tipp új gyakorlathoz (a térkép színezéséhez); heurisztika.
function aiGuessMg(name){
  const q=aiNorm(name), has=(...ws)=>ws.some(w=>q.indexOf(w)>=0);
  if(has('fekvenyom','mell','pec','tarogat','fekvotamasz','tolodz')) return 'mell';
  if(has('huzodz','evez','lehuz','hat','csonak','holtemel','deadlift')) return 'hát';
  if(has('vall','oldalemel','arcvono','face')) return 'váll';
  if(has('tricepsz','francia','kotel','dip','nyakrol')) return 'tricepsz';
  if(has('bicepsz','hajlit','kalapacs','curl')) return 'bicepsz';
  if(has('guggol','kitor','comb','vadli','lab','legpress','legcurl','csipo','glute')) return 'láb';
  if(has('plank','has','crunch','torzs','knee','csavar')) return 'törzs';
  return 'törzs';
}

let aiResolved=null;
function openAiImport(){
  aiResolved=null;

}
function aiImportHtml(){
  return `<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">AI-terv importálása</span>
      <h2 style="font-size:24px">Edzésterv beillesztése</h2></div>
      <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <p class="small mut" style="margin:6px 0 0">1) Másold a promptot az AI edződnek. 2) Illeszd be a válaszát. 3) Feldolgozás. A meglévő terved NEM változik – új edzés jön létre.</p>
    <div class="exnote" style="margin-top:12px;align-items:flex-start"><div class="exnote-t" style="white-space:pre-wrap;font-size:13px">${esc(AI_PROMPT_TEMPLATE)}</div></div>
    <button class="btn" style="margin-top:8px" onclick="aiCopyTpl()">Prompt másolása</button>
    <textarea id="aiText" rows="7" style="width:100%;margin-top:12px" placeholder="Ide illeszd be az AI válaszát…"></textarea>
    <button class="btn pri" style="margin-top:10px" onclick="aiProcess()">Feldolgozás</button>
    <div id="aiPreview"></div>`;
}
function aiCopyTpl(){
  const t=AI_PROMPT_TEMPLATE;
  const done=()=>uiAlert('A prompt a vágólapon – illeszd be az AI edződnek.');
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,()=>aiCopyFallback(t)); return; } }catch(e){}
  aiCopyFallback(t);
}
function aiCopyFallback(t){ try{ const ta=document.createElement('textarea'); ta.value=t;
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta); uiAlert('A prompt a vágólapon.'); }
  catch(e){ uiAlert('Másold ki kézzel a fenti promptot.'); } }
function aiProcess(){
  const txt=(document.getElementById('aiText')||{}).value||'';
  const days=aiParsePlan(txt);
  const prev=document.getElementById('aiPreview');
  if(!days.length){ aiResolved=null;
    prev.innerHTML=`<div class="banner" style="margin-top:12px">Nem sikerült edzést kiolvasni. Ellenőrizd a formátumot: „NAP: …", majd soronként „- gyakorlat | 4x8 | 60".</div>`; return; }
  aiResolved=days.map(d=>({ name:d.name, ex:d.ex.map(x=>({ parsed:x, match:aiMatchEx(x.name) })) }));
  prev.innerHTML=aiPreviewHtml();
}
function aiPreviewHtml(){
  let matched=0, neu=0, h=`<div style="margin-top:16px"><span class="eyebrow">Előnézet</span>`;
  aiResolved.forEach(d=>{ h+=`<div class="card" style="margin-top:8px"><div class="pad">
    <div class="cond" style="font-size:17px;font-weight:600">${esc(d.name)}</div>`;
    d.ex.forEach(item=>{ const p=item.parsed;
      const meta=`${p.s}×${esc(p.r)}${p.bw?' · testsúly':p.hasW?' · '+p.w+'kg':''}`;
      if(item.match){ matched++; h+=`<div class="small" style="margin-top:5px"><span style="color:var(--sage)">✓</span> ${esc(item.match.n)} <span class="dim">${meta}</span></div>`; }
      else { neu++; h+=`<div class="small" style="margin-top:5px"><span style="color:var(--brass)">+</span> ${esc(p.name)} <span class="dim">(új) ${meta}</span></div>`; } });
    h+=`</div></div>`; });
  h+=`<div class="small mut" style="margin-top:8px">${matched} meglévő gyakorlat összekötve (a súlytörténeteddel), ${neu} új létrehozva. A meglévő terved érintetlen.</div>
    <button class="btn pri" style="margin-top:10px" onclick="aiImportApply()">Hozzáadás az edzéseimhez</button></div>`;
  return h;
}
async function aiImportApply(){
  if(!aiResolved||!aiResolved.length){ uiAlert('Nincs mit importálni.'); return; }
  if(!S.customEx)S.customEx={}; if(!S.routines)S.routines=[]; if(!S.programs)S.programs=[];
  let newEx=0; const dayIds=[];
  aiResolved.forEach(d=>{
    const exIds=d.ex.map(item=>{
      if(item.match) return item.match.id;                 // meglévő ID – történet összekötve
      const id=uid('cx_'), p=item.parsed;
      const def={ id, n:p.name, mg:aiGuessMg(p.name), s:p.s, r:p.r, w:p.w, inc:2.5, rest:p.rest };
      if(p.bw) def.bw=1;
      S.customEx[id]=def; newEx++; return id;
    });
    const rid=uid('r_');
    S.routines.push({ id:rid, name:d.name||'AI edzés', sub:exIds.length+' gyakorlat', ex:exIds });
    dayIds.push(rid);
  });
  if(dayIds.length>1) S.programs.push({ id:uid('p_'), name:'AI edzésterv', days:dayIds });
  save(); closeSheet(); tab='home'; render(); window.scrollTo(0,0);
  await uiAlert(`Kész: ${dayIds.length} edzés${dayIds.length>1?' + terv':''}, ${newEx} új gyakorlat. Megtalálod a főoldaladon és a Tervek fülön.`);
}

function openBuilder(id){
  if(id){ const r=S.routines.find(x=>x.id===id);
    draft = r ? {id:r.id,name:r.name,ex:r.ex.slice(),ssLinks:(r.ssLinks||[]).slice(),isNew:false} : null; if(!draft) return; }
  else draft = {id:uid('r_'),name:'',ex:[],ssLinks:[],isNew:true};
  editing='routine'; render(); window.scrollTo(0,0);
}
function closeBuilder(){ editing=false; draft=null; render(); window.scrollTo(0,0); }
function updateBuilderSave(){ const ok=draft&&draft.name.trim()&&draft.ex.length>0;
  document.querySelectorAll('#draftSave,#draftSaveTop').forEach(b=>b.disabled=!ok); }
function draftMove(i,dir){ const j=i+dir; if(j<0||j>=draft.ex.length) return;
  const a=draft.ex; [a[i],a[j]]=[a[j],a[i]]; render(); }
function draftRemove(i){ draft.ex.splice(i,1); render(); }
function saveDraft(){
  if(!draft.name.trim()||!draft.ex.length){ uiAlert('Adj nevet és legalább egy gyakorlatot.'); return; }
  // Csak érvényes (a listában lévő, nem az első pozíción árva) linkeket tartunk meg.
  const links=(draft.ssLinks||[]).filter(id=>{ const i=draft.ex.indexOf(id); return i>0; });
  const r={id:draft.id,name:draft.name.trim(),sub:draft.ex.length+' gyakorlat',ex:draft.ex.slice()};
  if(links.length) r.ssLinks=links;
  const idx=S.routines.findIndex(x=>x.id===draft.id);
  if(idx>=0) S.routines[idx]=r; else S.routines.push(r);
  editing=false; draft=null; save(); tab='home'; render(); window.scrollTo(0,0);
}
// Superset-kapcsoló: az i. gyakorlat (i>0) össze/szét a fölöttivel.
function draftToggleLink(exId){
  if(!draft.ssLinks) draft.ssLinks=[];
  const i=draft.ssLinks.indexOf(exId);
  if(i>=0) draft.ssLinks.splice(i,1); else draft.ssLinks.push(exId);
  render();
}
async function deleteRoutine(id){
  if(!await uiConfirm('Törlöd ezt a saját edzést?\n(A már naplózott edzések megmaradnak.)', {ok:'Törlés', danger:true})) return;
  S.routines=S.routines.filter(x=>x.id!==id);
  (S.programs||[]).forEach(p=>{ p.days=p.days.filter(d=>d!==id); });
  tombstone(id);   // síremlék: a felhő-merge se hozza vissza
  editing=false; draft=null; await save(); flushCloud(); render(); window.scrollTo(0,0);   // a jelenlegi fülön marad
}
function builderView(){
  const canSave = draft.name.trim() && draft.ex.length>0;
  let items='';
  draft.ex.forEach((exId,i)=>{ const e=exDef(exId);
    const linked = i>0 && (draft.ssLinks||[]).includes(exId);
    if(i>0) items+=`<button class="sslink ${linked?'on':''}" onclick="draftToggleLink('${exId}')">${linked?'⛓ Superset az előzővel · bontás':'+ Superset az előzővel'}</button>`;
    items+=`<div class="card"${linked?' style="border-color:var(--brass)"':''}><div class="pad row">
      <span class="grow"><span class="cond" style="font-size:18px;font-weight:600;display:block">${esc(e.n)}</span>

      <button class="iconbtn" onclick="draftMove(${i},1)" ${i===draft.ex.length-1?'disabled':''} aria-label="le">↓</button>
      <button class="iconbtn" style="color:var(--red)" onclick="draftRemove(${i})" aria-label="törlés">×</button>
    </div></div>`;

    <div class="ptop">
      <button class="iconbtn" onclick="closeBuilder()" aria-label="Mégse">${ICON.back}</button>
      <div class="pmid"><div class="d">Edzés összeállítása</div><div class="c">${draft.isNew?'új edzés':'szerkesztés'}</div></div>
      <button class="iconbtn" id="draftSaveTop" onclick="saveDraft()" ${canSave?'':'disabled'} style="color:var(--sage)" aria-label="Mentés">${ICON.check}</button>
    </div>
    <div class="pmain" style="justify-content:flex-start;gap:12px">
      <input id="draftName" type="text" placeholder="Edzés neve (pl. Láb nap)" value="${esc(draft.name)}"

      ${items}
      <button class="btn" onclick="openExPicker()">+ Gyakorlat hozzáadása</button>
      ${!draft.isNew?`<button class="btn ghost" style="color:var(--red)" onclick="deleteRoutine('${draft.id}')">Edzés törlése</button>`:''}
      <button class="btn pri" id="draftSave" onclick="saveDraft()" ${canSave?'':'disabled'}>Mentés</button>
    </div>
  </div>`;
}

    .concat(S.routines.map(r=>({id:r.id,name:r.name,src:'saját'})));
  const rows=days.map(d=>`<button class="btn" style="text-align:left;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px" onclick="addToProg('${d.id}')">
      <span><span style="font-weight:600">${esc(d.name)}</span> <span class="small dim">· ${d.src}</span></span>
      <span style="color:var(--brass);font-size:24px">+</span></button>`).join('');
  document.getElementById('sheetIn').innerHTML=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">Edzés hozzáadása a tervhez</span>
    <h2 style="font-size:22px">Válassz edzést</h2></div>
    <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <div style="max-height:52vh;overflow-y:auto;margin-top:12px">${rows}</div>`;
  document.getElementById('sheet').classList.add('on');
}
function addToProg(dId){ prog.days.push(dId); closeSheet(); render(); }

// -- Superset a lejátszóban -------------------------------------------
const SS_SWAP=20;   // rövid váltás-pihenő két superset-gyakorlat között (mp)
function ssGroups(){ return (S.active && S.active.ss) || []; }
function ssGroupOf(id){ return ssGroups().find(g=>g.indexOf(id)>=0) || null; }
// Kör-címke: A1, A2, B1… a csoport sorrendje + a pozíció szerint.
function ssLabel(id){ const gs=ssGroups(), g=ssGroupOf(id); if(!g) return '';
  return String.fromCharCode(65+gs.indexOf(g))+(g.indexOf(id)+1); }
// A csoport aktív (naplózott) tagjai, a routine sorrendjében.
function ssActiveMembers(id){ const g=ssGroupOf(id); if(!g) return [];
  const order=(dayDef(S.active.day)||{ex:[]}).ex.map(x=>x.id).filter(x=>S.active.log[x]);
  return g.filter(x=>order.indexOf(x)>=0).sort((a,b)=>order.indexOf(a)-order.indexOf(b)); }
function gotoExId(id){ const exs=(dayDef(S.active.day)||{ex:[]}).ex.filter(x=>S.active.log[x.id]);
  const i=exs.findIndex(x=>x.id===id); if(i>=0) curEx=i; }

function playerView(){
  const d=dayDef(S.active.day) || {name:S.active.dayName||'Edzés', ex:[]};
  const exs=d.ex.filter(x=>S.active.log[x.id]);   // sérülés miatt kihagyottak nélkül
  if(curEx>=exs.length) curEx=exs.length-1; if(curEx<0) curEx=0;
  const e=exs[curEx], L=S.active.log[e.id], last=lastFor(e.id), t=parseInt(e.r);
  const complete=exDone(e,L), hit=L.sets.every(x=>x!=null&&x>=t);
  const missed=L.sets.some(x=>x!=null&&x<t);
  const isLast=curEx===exs.length-1;

  let dots='';
  exs.forEach((x,i)=>{ const done=exDone(x,S.active.log[x.id]);
    dots+=`<button class="pdot ${i===curEx?'cur':(done?'done':'')}" onclick="exNav(${i})" aria-label="gyakorlat ${i+1}"></button>`; });

  let chips='';
  L.sets.forEach((v,i)=>{ const cls=v==null?'':(v>=t?'done':'miss');
    chips+=`<button class="chip ${cls}" data-i="${i}" onclick="openSet('${e.id}',${i})">
      <span class="r">${v==null?'·':v}</span><span class="l">${i+1}. sz</span></button>`; });

  const physioMode=isPhysioActive();   // mobilitás: nincs súlyállító/eszköz
  let wt='';
  if(!e.time && !physioMode){ const vc=!e.bw?` onclick="openPlateCalc(${L.w})" style="cursor:pointer" title="Tárcsák"`:'';
    wt=`<div class="wt">
    <button onclick="bump('${e.id}',-1)" aria-label="kevesebb">−</button>
    <div class="val"${vc}>${wLabel(e,L.w)}${e.bw&&L.w<=0?'':'<span>kg</span>'}</div>
    <button onclick="bump('${e.id}',1)" aria-label="több">+</button></div>`; }

  // Egyértelmű, mindig látható eszköz-gombok: tárcsa-kalkulátor + progresszió.
  let tools='';
  if(!e.time && !physioMode){
    const t=[];
    if(!e.bw) t.push(`<button class="tool" onclick="openWarmup('${e.id}')">Bemelegítés</button>`);
    if(!e.bw) t.push(`<button class="tool" onclick="openPlateCalc(${L.w})">${ICON.dumbbell} Tárcsák</button>`);
    t.push(`<button class="tool" onclick="openProgPolicy('${e.id}')">Progresszió: ${esc(POLICY_NAME[progPolicy(e.id)].split(' ')[0])}</button>`);
    tools=`<div class="toolrow">${t.join('')}</div>`;
  }
  let note='';
  if(last) note=`<div class="prev">Előző: ${wLabel(e,last.w)}${e.bw&&last.w<=0?'':' kg'} × ${last.sets.map(x=>x==null?'–':x).join(', ')}</div>`;
  else note=`<div class="prev dim">Első alkalom – a technika a cél, ne a súly.</div>`;
  // Következő edzés súlyjavaslata a választott progressziós szabály szerint,
  // indoklással (auditálható). Csak akkor, ha van már rögzített szett.
  let hint='';
  if(!e.bw && L.sets.some(x=>x!=null)){
    const nx=progNext(e.id,{w:L.w,sets:L.sets});
    const arrow = nx.delta>0?`↑ ${wLabel(e,nx.w)} kg`:nx.delta<0?`↓ ${wLabel(e,nx.w)} kg`:`= ${wLabel(e,nx.w)} kg`;
    hint=`<div class="hint" onclick="openProgPolicy('${e.id}')" style="cursor:pointer">Következőre: <b>${arrow}</b> · ${esc(nx.reason)} <span class="dim">›</span></div>`;
  }

  // Állandó gyakorlat-jegyzet + fotó
  const pn=S.notes[e.id], ph=S.photos[e.id];
  const noteBlock = (pn||ph) ? `<div class="exnote">
      ${ph?`<img class="exphoto" src="${ph}" onclick="viewPhoto('${e.id}')" alt="beállítás fotó">`:''}
      ${pn?`<div class="exnote-t">${esc(pn)}</div>`:''}
    </div>` : '';

  // Terv kontra valóság: ha van kihagyott ismétlés, egy koppintással megkérdi az okot
  let why='';
  if(complete && missed && !e.time){
    const cur=L.why;
    why=`<div class="whyrow"><span class="small dim" style="width:100%">Miért tért el a tervtől?</span>
      ${[['busy','Gép foglalt'],['heavy','Túl nehéz volt'],['time','Kevés idő']].map(([k,lab])=>
        `<button class="whyc ${cur===k?'on':''}" onclick="setWhy('${e.id}','${k}')">${lab}</button>`).join('')}</div>`;
  }

  const deloadBanner = S.active.deload ? `<div class="banner">Kihagyás utáni visszaépítés: kisebb súly, a célnál pár ismétléssel több.</div>` : '';

  // Superset-kör: címke + a kör tagjainak felsorolása, jelezve, hogy a
  // pihenő a kör VÉGÉN jön (a tagok közt csak rövid váltás).
  const ssMembers=ssActiveMembers(e.id);
  const ssBadge = ssMembers.length ? `<span class="ssbadge">Superset ${ssLabel(e.id)}</span>` : '';
  const ssHint = ssMembers.length
    ? `<div class="ssrow">${ssMembers.map(id=>`<span class="${id===e.id?'cur':''}">${esc(ssLabel(id))} ${esc(exDef(id).n)}</span>`).join('<span class="arr">→</span>')}
        <div class="small dim" style="width:100%;margin-top:4px">Egymás után, pihenő a kör végén</div></div>`
    : '';

  return `<div class="player">
    <div class="ptop">
      <button class="iconbtn" onclick="pausePlayer()" aria-label="Szünet" title="Szünet">${ICON.back}</button>
      <div class="pmid"><div class="d">${d.name}${S.active.deload?' · visszaépítés':''}</div><div class="c">gyakorlat ${curEx+1} / ${exs.length}</div></div>
      <button class="iconbtn" onclick="finish()" aria-label="Edzés lezárása" title="Edzés lezárása" style="color:var(--sage)">${ICON.check}</button>
    </div>
    <div class="pdots">${dots}</div>
    <div class="pmain">
      ${deloadBanner}
      <div>
        <div class="row" style="align-items:flex-start">
          <div class="grow"><div class="pname">${esc(e.n)}</div>
          <div class="pmeta">${complete?'<span class="done-badge">kész</span>':`<span class="tgt">cél: ${e.s} × ${e.r}${e.time?'':' ism.'}</span>`}${ssBadge}</div></div>
          <button class="iconbtn" onclick="openNoteSheet('ex','${e.id}')" aria-label="Jegyzet és fotó" title="Jegyzet és fotó">${ICON.edit}</button>
        </div>
      </div>
      ${noteBlock}
      ${ssHint}
      ${wt}
      ${tools}
      <div class="pchips">${chips}</div>
      ${note}${hint}
      ${why}
    </div>
    <div class="pfoot">
      <button class="btn" onclick="exNav(${curEx-1})" ${curEx===0?'disabled':''} style="flex:0 0 40%">‹ Előző</button>
      ${isLast
        ? `<button class="btn pri" onclick="finish()" style="flex:1">Edzés lezárása</button>`
        : `<button class="btn pri" onclick="exNav(${curEx+1})" style="flex:1">Következő ›</button>`}
    </div>
    <div class="row" style="gap:10px;max-width:560px;margin:0 auto;padding:0 16px 16px;width:100%">
      <button class="btn" style="flex:1;margin:0" onclick="openNoteSheet('day','')">Nap jegyzete${S.active.note?' •':''}</button>
      <button class="btn ghost" style="flex:1;margin:0;color:var(--red)" onclick="discardActive()">Edzés eldobása</button>
    </div>
  </div>`;
}
function setWhy(id,k){ const L=S.active.log[id]; L.why=(L.why===k?null:k); save(); render(); }

function bump(id,dir){ const e=exDef(id),L=S.active.log[id];
  L.w=Math.max(0, Math.round((L.w+dir*e.inc)*10)/10); S.weights[id]=L.w; save(); render(); }

let cur=null, justSet=null;
function openSet(id,i){
  cur={id,i}; const e=exDef(id), t=parseInt(e.r);
  if(e.time){ openTimerSet(e,i,t); return; }    // idő-alapú gyakorlat → visszaszámláló
  document.getElementById('sheetIn').innerHTML=repKbSheet(e,i,t);
  document.getElementById('sheet').classList.add('on');
}
// Ismétlés-választó billentyűzet (a cél körüli tartomány).
function repKbSheet(e,i,t){
  const opts=[]; for(let k=Math.max(1,t-4);k<=t+6;k++) opts.push(k);
  let h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">${i+1}. szett</span>
    <h2 style="font-size:24px">${esc(e.n)}</h2><span class="small dim">cél: ${esc(e.r)}${e.time?'':' ismétlés'}</span></div>
    <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <div class="kb">`;
  opts.forEach(k=>{ h+=`<button onclick="setRep(${k})" style="${k==t?'border-color:var(--brass);color:var(--brass)':''}">${k}</button>`; });
  h+=`</div><button class="btn" style="margin-top:12px;color:var(--mut)" onclick="setRep(null)">Törlés</button>`;
  return h;
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }

/* ---- Beépített óra idő-alapú gyakorlathoz (plank stb.) ------------- */
// A cél-időről visszaszámol; a végén beep + rezgés és automatikusan
// rögzíti a teljes időt. Korai leállításnál a ténylegesen tartott mp kerül
// be. „Kézi megadás" a szám-billentyűzetre vált vissza.
let stInt=null, stEnd=0;
function fmtSec(s){ s=Math.max(0,Math.round(s)); return s>=60 ? Math.floor(s/60)+':'+String(s%60).padStart(2,'0') : String(s); }
function openTimerSet(e,i,target){
  clearInterval(stInt); stInt=null;
  const h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">${i+1}. szett · idő</span>
      <h2 style="font-size:24px">${esc(e.n)}</h2><span class="small dim">cél: ${esc(e.r)}</span></div>
      <button onclick="closeTimerSet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <div style="text-align:center;margin:16px 0 8px">
      <div id="stVal" class="num" style="font-size:66px;font-weight:700;line-height:1">${fmtSec(target)}</div>
      <div class="small dim" style="margin-top:2px">másodperc · visszaszámlál a célig</div></div>
    <div class="mgtrack" style="height:8px"><span id="stBar" class="mgfill" style="width:100%;background:var(--brass)"></span></div>
    <button id="stBtn" class="btn pri" style="margin-top:14px" onclick="toggleTimerSet(${target})">Indítás</button>
    <button class="btn" style="margin-top:8px;color:var(--mut)" onclick="document.getElementById('sheetIn').innerHTML=repKbSheet(exDef(cur.id),cur.i,${target})">Kézi megadás</button>`;
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
}
function stTick(target){
  const leftMs=Math.max(0, stEnd-Date.now()), left=leftMs/1000;
  const el=document.getElementById('stVal'); if(el) el.textContent=fmtSec(Math.ceil(left));
  const bar=document.getElementById('stBar'); if(bar) bar.style.width=(target>0?left/target*100:0).toFixed(1)+'%';
  if(leftMs>0 && document.hidden && !_holdNotifShown){ _holdNotifShown=true;
    timerNotif('Tartás folyamatban', 'Szólunk, amint letelt.', 'hold', true); }
  if(leftMs<=0){ clearInterval(stInt); stInt=null; if(navigator.vibrate) navigator.vibrate([200,100,200]); beep();
    if(document.hidden) timerNotif('Tartás kész', 'Szép munka!', 'hold', false); else clearNotif('hold');
    releaseWake(); finishTimerSet(target); }
}
function toggleTimerSet(target){
  if(stInt){                                  // leállítás korán → a ténylegesen tartott idő
    clearInterval(stInt); stInt=null; releaseWake();
    finishTimerSet(Math.max(1, target - Math.ceil(Math.max(0,stEnd-Date.now())/1000))); return;
  }
  stEnd=Date.now()+target*1000; _holdNotifShown=false; acquireWake(); ensureAudio();
  const b=document.getElementById('stBtn'); if(b){ b.textContent='Leállítás'; b.classList.remove('pri'); }
  clearInterval(stInt); stInt=setInterval(()=>stTick(target),200); stTick(target);
}
function finishTimerSet(v){ clearInterval(stInt); stInt=null; clearNotif('hold'); setRep(v); }   // rögzít + pihenő indul
function closeTimerSet(){ clearInterval(stInt); stInt=null; _holdNotifShown=false; releaseWake(); clearNotif('hold'); closeSheet(); }

/* ---- Témázott modál (confirm/alert helyett) ------------------------ */
let _modalRes=null;
function _closeModal(v){ document.getElementById('modal').classList.remove('on'); const r=_modalRes; _modalRes=null; if(r) r(v); }
function uiConfirm(msg, opts){ opts=opts||{};
  return new Promise(res=>{ _modalRes=res;
    document.getElementById('modalIn').innerHTML=`<div class="modal-msg">${esc(msg)}</div>
      <div class="modal-actions">
        <button class="btn" style="flex:1;margin:0" onclick="_closeModal(false)">${esc(opts.cancel||'Mégse')}</button>
        <button class="btn ${opts.danger?'danger':'pri'}" style="flex:1;margin:0" onclick="_closeModal(true)">${esc(opts.ok||'Rendben')}</button>
      </div>`;
    document.getElementById('modal').classList.add('on'); });
}
function uiAlert(msg, opts){ opts=opts||{};
  return new Promise(res=>{ _modalRes=res;
    document.getElementById('modalIn').innerHTML=`<div class="modal-msg">${esc(msg)}</div>
      <div class="modal-actions"><button class="btn pri" style="flex:1;margin:0" onclick="_closeModal()">${esc(opts.ok||'Rendben')}</button></div>`;
    document.getElementById('modal').classList.add('on'); });
}
function setRep(v){
  const e=exDef(cur.id); S.active.log[cur.id].sets[cur.i]=v; S.activeT=Date.now();
  closeSheet(); save();
  if(v==null){ render(); return; }
  if(navigator.vibrate) navigator.vibrate(12);   // rövid haptikus visszajelzés a rögzítésre
  justSet={id:cur.id,i:cur.i};                    // a chip pipa-pulzusa a következő festésnél
  // Superset: a kör tagjai közt csak rövid váltás + ugrás a következő tagra;
  // a teljes pihenő a kör VÉGÉN indul, és visszalépünk az első befejezetlen
  // tagra a következő körhöz.
  const mem=ssActiveMembers(cur.id);
  if(mem.length){
    const pos=mem.indexOf(cur.id);
    if(pos>=0 && pos<mem.length-1){ gotoExId(mem[pos+1]); render(); startTimer(Math.min(e.rest, SS_SWAP)); return; }
    const back=mem.find(id=>S.active.log[id].sets.some(x=>x==null));
    if(back) gotoExId(back);
    render(); startTimer(e.rest); return;
  }
  render(); startTimer(e.rest);
}

async function acquireWake(){ try{ if('wakeLock' in navigator && !wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{ wl=null; }); } }catch(e){ wl=null; } }
function releaseWake(){ try{ if(wl){ wl.release(); wl=null; } }catch(e){ wl=null; } }
// Hangjelzés a pihenő végén (WebAudio). Az AudioContext-et felhasználói
// koppintáskor (startTimer, szett-rögzítés után) oldjuk fel, hogy a végi
// biccentés megszólalhasson. Némítható (gymlog_mute kulcs, független a naplótól).
let audioCtx=null;
function restMuted(){ try{ return localStorage.getItem('gymlog_mute')==='1'; }catch(e){ return false; } }
function updateMuteLabel(){ const b=document.getElementById('muteBtn'); if(b) b.textContent = restMuted()?'Hang ki':'Hang be'; }
function toggleMute(){ try{ localStorage.setItem('gymlog_mute', restMuted()?'0':'1'); }catch(e){} updateMuteLabel(); if(!restMuted()){ ensureAudio(); beep(); } }
function ensureAudio(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(){ if(restMuted()) return; try{ if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime;
  o.type='sine'; o.frequency.setValueAtTime(880,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.37); }catch(e){} }

// Rendszer-értesítés a pihenő/tartás hátralévő idejével – opcionális
// (gymlog_notify kulcs, alap: ki). Csak háttérben (document.hidden) jelenik
// meg, hogy foreground-ban ne legyen zajos. Best-effort: a böngésző háttérben
// throttle-olhatja a JS-t, így mély háttérben késhet. Nem szerveres push.
// Háttér-értesítés: stintenként EGYSZER posztolunk (nem másodpercenként –
// az újraposztolás a lezárt telefonon minden alkalommal felébreszti a
// képernyőt). A zászlót visszaváltásnál / új időzítőnél nullázzuk.
let _restNotifShown=false, _holdNotifShown=false;
function notifyEnabled(){ try{ return localStorage.getItem('gymlog_notify')==='1' && ('Notification' in window) && Notification.permission==='granted'; }catch(e){ return false; } }
async function toggleNotify(){
  const turnOn = localStorage.getItem('gymlog_notify')!=='1';
  if(turnOn){
    if(!('Notification' in window)){ await uiAlert('Ez a böngésző nem támogatja az értesítéseket.'); return; }
    let p=Notification.permission;
    if(p==='default'){ try{ p=await Notification.requestPermission(); }catch(e){} }
    if(p!=='granted'){ await uiAlert('Az értesítés a böngészőben nincs engedélyezve. A telefon beállításaiban engedélyezheted az oldalnak.'); return; }
  }
  try{ localStorage.setItem('gymlog_notify', turnOn?'1':'0'); }catch(e){}
}
async function timerNotif(title, body, tag, silent){
  if(!notifyEnabled()) return;
  try{ const reg=await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification){ reg.showNotification(title,{body,tag,renotify:false,silent:!!silent,icon:'./icon-192.png',badge:'./icon-192.png'}); return; } }catch(e){}
  try{ new Notification(title,{body,tag,silent:!!silent,icon:'./icon-192.png'}); }catch(e){}
}
async function clearNotif(tag){
  try{ const reg=await navigator.serviceWorker.getRegistration();
    if(reg && reg.getNotifications){ (await reg.getNotifications({tag})).forEach(n=>n.close()); } }catch(e){}
}
// Pihenő menet közbeni állítása (+/-). Ha a maradék meghaladja a kezdő
// hosszt, a gyűrű teljességéhez igazítjuk; alul 0-ra vágjuk.
function adjustRest(d){ if(!document.getElementById('rest').classList.contains('on')) return;
  tEnd += d*1000; if(tEnd < Date.now()) tEnd = Date.now();
  const leftSec = Math.ceil((tEnd-Date.now())/1000); if(leftSec>tLen) tLen=leftSec;
  tick(); }
function startTimer(sec){
  tLen=sec; tEnd=Date.now()+sec*1000; _restNotifShown=false;
  document.getElementById('rest').classList.add('on');
  acquireWake();                                   // ne aludjon el a képernyő pihenő közben
  ensureAudio();                                   // hang feloldása (a szett-rögzítés koppintásán belül)
  clearInterval(tInt); tInt=setInterval(tick,200); tick();
}
function stopTimer(){ clearInterval(tInt); _restNotifShown=false; const r=document.getElementById('rest'); if(r) r.classList.remove('on'); releaseWake(); clearNotif('rest'); }
function tick(){
  const left=Math.max(0,tEnd-Date.now());
  const s=Math.ceil(left/1000);
  document.getElementById('restVal').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const R=52, C=2*Math.PI*R, frac=tLen? left/(tLen*1000) : 0;
  const ring=document.getElementById('restRing');
  ring.style.strokeDasharray=C.toFixed(1); ring.style.strokeDashoffset=(C*(1-frac)).toFixed(1);
  // Háttérben: EGYSZER, némán jelezzük, hogy megy a pihenő (nem
  // másodpercenként – az újraposzt felébreszti a lezárt képernyőt).
  if(left>0 && document.hidden && !_restNotifShown){ _restNotifShown=true;
    timerNotif('Pihenő folyamatban', 'Szólunk, amint letelt.', 'rest', true); }

// A befejezett edzés új csúcsai: ha egy gyakorlat súlya meghaladja az összes
// korábbi edzését (súly-PR), vagy — ha nem — a becsült 1RM-je (1RM-PR).
function sessionPRs(sess){
  const prs=[], others=S.sessions.filter(s=>s!==sess);
  Object.keys(sess.log||{}).forEach(id=>{
    const L=sess.log[id]; if(!L||!L.sets.some(x=>x!=null)) return;
    const e=exDef(id); if(e.bw||!(L.w>0)) return;
    const prevW=Math.max(0,...others.filter(s=>s.log[id]).map(s=>s.log[id].w||0));
    if(L.w>prevW){ prs.push({name:e.n, kind:'súly-csúcs', val:L.w+' kg'}); return; }
    const c=sess1RM(L); if(c==null) return;
    const prev1=Math.max(0,...others.filter(s=>s.log[id]).map(s=>sess1RM(s.log[id])||0));
    if(c>prev1) prs.push({name:e.n, kind:'becsült 1RM', val:'~'+c+' kg'});
  });
  return prs;
}

function sessionMgSets(sess){
  const acc={};
  Object.keys(sess.log||{}).forEach(id=>{
    const n=(sess.log[id].sets||[]).filter(x=>x!=null).length; if(!n) return;
    const mg=exDef(id).mg||'egyéb'; acc[mg]=(acc[mg]||0)+n;
  });
  return acc;
}
function sessionDur(sess){ return (sess.end && sess.end>sess.t) ? sess.end-sess.t : null; }

function backup(){

}
function restore(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=()=>{ const f=i.files[0]; if(!f)return; const r=new FileReader();
    r.onload=async()=>{ try{ const d=JSON.parse(r.result);
      if(!Array.isArray(d.sessions)) throw 0;
      if(!(await uiConfirm('Ez felülírja a jelenlegi '+S.sessions.length+' edzést '+d.sessions.length+' mentett edzéssel. Folytatod?', {ok:'Visszaállítás', danger:true}))) return;
      S.sessions=d.sessions; S.weights=d.weights||{}; if(d.notes)S.notes=d.notes; if(d.photos)S.photos=d.photos;
      if(d.customEx)S.customEx=d.customEx; if(d.routines)S.routines=d.routines; if(d.programs)S.programs=d.programs;
      if(d.bw)S.bw=d.bw; if(d.sleep)S.sleep=d.sleep;
      save(); render();
    }catch(e){ uiAlert('Ez nem érvényes mentésfájl.'); } };
    r.readAsText(f); };
  i.click();
}

// Síremlék (tombstone) rögzítése: törölt entitás kulcsa (edzés t+day, vagy
// saját edzés/terv/gyakorlat id). A mergeGym ezeket kizárja, így a felhő sem

function tombstone(k){ if(!S.deleted) S.deleted=[]; S.deleted.push({k, at:Date.now()}); }
async function del(i){ if(await uiConfirm('Törlöd ezt az edzést?', {ok:'Törlés', danger:true})){
  const s=S.sessions[i];

function copyAll(){
  let t='Edzésnapló\n\n';
  S.sessions.forEach(s=>{ const d=dayDef(s.day)||{ex:[]};
    t+=fmtDate(s.t)+' — '+dayName(s)+'\n';
    const seen=new Set();
    d.ex.forEach(e=>{seen.add(e.id); const l=s.log[e.id]; if(l&&l.sets.some(x=>x!=null))
      t+='  '+e.n+': '+wLabel(e,l.w)+(e.bw&&l.w<=0?'':' kg')+' × '+l.sets.map(x=>x==null?'–':x).join(', ')+'\n';});
    Object.keys(s.log).forEach(id=>{ if(seen.has(id))return; const l=s.log[id];
      if(!l.sets.some(x=>x!=null))return; const e=exDef(id);
      t+='  '+e.n+' (kivéve): '+wLabel(e,l.w)+(e.bw&&l.w<=0?'':' kg')+' × '+l.sets.map(x=>x==null?'–':x).join(', ')+'\n';});
    t+='\n'; });
  navigator.clipboard.writeText(t).then(()=>uiAlert('Vágólapra másolva. Beillesztheted a chatbe.'),()=>uiAlert('Nem sikerült a másolás.'));
}

/* ---- Heti összefoglaló (AI edzőnek) -------------------------------- */
// Az elmúlt 7 nap edzései a jegyzetekkel; ha héten nincs, az utolsó 3 edzés.
function weeklyReport(){
  const WHY={busy:'gép foglalt',heavy:'túl nehéz',time:'kevés idő'};
  const cutoff=Date.now()-7*864e5;
  let sess=(S.sessions||[]).filter(s=>s.t>=cutoff), weekly=true;
  if(!sess.length){ sess=(S.sessions||[]).slice(-3); weekly=false; }
  let t='Edzésnapló – ';
  if(sess.length){ const from=fmtDate(sess[0].t), to=fmtDate(sess[sess.length-1].t);
    t += weekly ? 'heti összefoglaló ('+from+' – '+to+')' : 'utolsó '+sess.length+' edzés ('+from+' – '+to+')'; }
  else t+='heti összefoglaló';
  t+='\n\nKérlek, edzőként nézd át ezeket az edzéseket, és adj rövid visszajelzést + javaslatot a következő hétre.\n';
  if(!sess.length) return t+'\n(Nincs rögzített edzés.)';
  const line=(e,l,extraName)=>{
    const sets=l.sets.map(x=>x==null?'–':x).join(', ');
    const w=wLabel(e,l.w)+(e.bw&&l.w<=0?'':' kg');
    let ex=''; if(l.why) ex+=' ['+(WHY[l.why]||l.why)+']';
    const pn=S.notes&&S.notes[e.id]; if(pn) ex+=' (jegyzet: '+pn+')';
    return '  '+e.n+(extraName||'')+': '+w+' × '+sets+ex+'\n';
  };
  sess.forEach(s=>{ const d=dayDef(s.day)||{ex:[]};
    t+='\n— '+fmtDate(s.t)+' — '+dayName(s)+' (összterhelés: '+sessionLoad(s).toLocaleString('hu')+' kg)\n';
    if(s.note) t+='  Aznapi jegyzet: '+s.note+'\n';
    const seen=new Set();
    d.ex.forEach(e=>{ seen.add(e.id); const l=s.log[e.id]; if(l&&l.sets.some(x=>x!=null)) t+=line(e,l); });
    Object.keys(s.log).forEach(id=>{ if(seen.has(id))return; const l=s.log[id];
      if(!l.sets.some(x=>x!=null))return; t+=line(exDef(id),l,' (kivéve)'); });
  });
  return t;
}
