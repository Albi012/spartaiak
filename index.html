<style>
/* ---- Téma tokenek ---------------------------------------------------
   Alap = sötét (teremben ez az alapértelmezett). A rendszer világos
   beállítását követi, ha nincs kézi választás; a kézi váltó a
   [data-theme] attribútummal felülírja. */
:root{
  --bg:#0F1317; --card:#171D24; --card2:#1F2833; --line:#2A343F;
  --ink:#EAF0F5; --mut:#94A2B0; --dim:#6A7885;
  --brass:#E0A93E; --brass-d:#3A2E13; --on-brass:#1A1206;
  --sage:#63C295; --sage-d:#14291E;
  --red:#E9694C; --miss-bg:#3A241E;
  --bar:rgba(15,19,23,.72); --shadow:rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#F4F2EC; --card:#FFFFFF; --card2:#F1EEE6; --line:#E4DFD3;
    --ink:#20262D; --mut:#5C6772; --dim:#95A0AC;
    --brass:#A9740F; --brass-d:#F1E6CB; --on-brass:#211603;
    --sage:#2C9A64; --sage-d:#DDF0E6;
    --red:#C8492C; --miss-bg:#FBE7E0;
    --bar:rgba(244,242,236,.8); --shadow:rgba(40,50,60,.14);
  }
}
:root[data-theme="light"]{
  --bg:#F4F2EC; --card:#FFFFFF; --card2:#F1EEE6; --line:#E4DFD3;
  --ink:#20262D; --mut:#5C6772; --dim:#95A0AC;
  --brass:#A9740F; --brass-d:#F1E6CB; --on-brass:#211603;
  --sage:#2C9A64; --sage-d:#DDF0E6;
  --red:#C8492C; --miss-bg:#FBE7E0;
  --bar:rgba(244,242,236,.8); --shadow:rgba(40,50,60,.14);
}
:root[data-theme="dark"]{
  --bg:#0F1317; --card:#171D24; --card2:#1F2833; --line:#2A343F;
  --ink:#EAF0F5; --mut:#94A2B0; --dim:#6A7885;
  --brass:#E0A93E; --brass-d:#3A2E13; --on-brass:#1A1206;
  --sage:#63C295; --sage-d:#14291E;
  --red:#E9694C; --miss-bg:#3A241E;
  --bar:rgba(15,19,23,.72); --shadow:rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:120px;overscroll-behavior-y:contain;transition:background .25s,color .25s}
.num,.cond{font-family:'Barlow Condensed',Barlow,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Felső sáv */
.appbar{position:sticky;top:0;z-index:40;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.appbar-in{max-width:560px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{width:22px;height:22px;color:var(--brass);flex:none}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--mut);border:1px solid var(--line);background:var(--card)}
.iconbtn:active{background:var(--card2);transform:scale(.94)}

.top{padding:22px 0 10px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.pad{padding:15px 16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.small{font-size:13px}

/* Kezdőképernyő – napválasztó */
.daybtn{width:100%;text-align:left;padding:15px;display:flex;align-items:center;gap:14px}
.daybtn:active{background:var(--card2)}
.daytag{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1;color:var(--brass);
  width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:1px solid var(--line);border-radius:13px}
.pill{display:inline-block;font-size:11px;letter-spacing:.09em;font-weight:700;color:var(--on-brass);
  background:var(--brass);padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}

/* Szett-chipek */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{width:54px;height:54px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .12s,background .12s}
.chip:active{transform:scale(.93)}
.chip .r{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700}
.chip .l{font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.chip.done{background:var(--sage-d);border-color:var(--sage)}
.chip.done .r{color:var(--sage)}
.chip.done .l{color:var(--sage);opacity:.85}
.chip.miss{background:var(--miss-bg);border-color:var(--red)}
.chip.miss .r{color:var(--red)}

/* Súlyállító */
.wt{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card2)}
.wt button{width:56px;height:56px;font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:600;color:var(--brass)}
.wt button:active{background:var(--brass-d)}
.wt .val{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:31px;font-weight:700;padding:0 4px}
.wt .val span{font-size:14px;color:var(--dim);font-family:Barlow;font-weight:500;margin-left:3px}
.prev{font-size:13px;color:var(--mut);margin-top:10px;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--brass);margin-top:6px;font-weight:500}

/* Gombok */
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.btn.pri{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.btn:active{transform:scale(.99);opacity:.9}

/* Lebegő alsó navigáció */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:420px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;display:flex;padding:6px;gap:4px;box-shadow:0 10px 30px var(--shadow);z-index:30}
.nav button{flex:1;padding:9px 4px;border-radius:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.nav button.on{color:var(--brass);background:var(--card2)}
.nav .ic{display:block;font-family:'Barlow Condensed',sans-serif;font-size:20px;margin-bottom:2px}

/* Pihenőóra */
.timer{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));margin:0 auto;max-width:536px;
  background:var(--card);border:1px solid var(--brass);border-radius:16px;
  padding:12px 16px;display:none;box-shadow:0 10px 30px var(--shadow);z-index:29}
.timer.on{display:block}
.tbar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:9px}
.tbar i{display:block;height:100%;background:var(--brass);width:100%}

/* Gyakorlat-fejléc */
.exhead{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.exname{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;line-height:1.15}
.tgt{font-size:13px;color:var(--dim);white-space:nowrap}
.done-badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);font-weight:700}

/* Napló sorok */
.hrow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.spark{width:100%;height:44px;display:block;margin-top:10px}
.empty{text-align:center;padding:44px 20px 28px;color:var(--dim)}

/* Alsó lap (szett-billentyűzet) */
.sheet{position:fixed;inset:0;background:rgba(8,10,13,.6);display:none;align-items:flex-end;z-index:50;backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.sheet .inner{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px var(--shadow)}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kb button{padding:16px 0;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.kb button:active{background:var(--brass-d)}
</style>

<header class="appbar"><div class="appbar-in">
  <span class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor">
      <rect x="2" y="9" width="3" height="6" rx="1.2"/>
      <rect x="5" y="6.5" width="2.6" height="11" rx="1.1"/>
      <rect x="7.6" y="10.4" width="8.8" height="3.2" rx="1.4"/>
      <rect x="16.4" y="6.5" width="2.6" height="11" rx="1.1"/>
      <rect x="19" y="9" width="3" height="6" rx="1.2"/>
    </g></svg>
    <span class="brand-name">Edzésnapló</span>
  </span>
  <button id="themeBtn" class="iconbtn" aria-label="Téma váltása" title="Téma váltása">☾</button>
</div></header>

<div class="wrap" id="app"></div>

<div class="timer" id="timer">
  <div class="row">
    <div class="grow"><span class="eyebrow">Pihenő</span></div>
    <div class="num" id="tval" style="font-size:26px;font-weight:700"></div>
    <button class="small mut" id="tskip" style="padding:8px 14px;border:1px solid var(--line);border-radius:10px">Kihagy</button>
  </div>
  <div class="tbar"><i id="tfill"></i></div>
</div>

<div class="nav">
  <button data-tab="home" class="on"><span class="ic">▣</span>Edzés</button>
  <button data-tab="log"><span class="ic">≡</span>Napló</button>
  <button data-tab="prog"><span class="ic">↗</span>Haladás</button>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetIn"></div></div>

<script>
const PLAN = [
 {id:'pa',name:'Push A',sub:'Mell · váll · tricepsz',ex:[
  {id:'bench',n:'Fekvenyomás',s:4,r:'5',w:55,rest:180,inc:2.5},
  {id:'dip',n:'Tolódzkodás',s:4,r:'5',w:5,rest:180,inc:2.5,bw:1},
  {id:'incdb',n:'Ferdepad nyomás (kézisúlyzó)',s:3,r:'8',w:17.5,rest:120,inc:2.5},
  {id:'ohpdb',n:'Vállból nyomás ülve',s:3,r:'8',w:12.5,rest:120,inc:2.5},
  {id:'lat',n:'Oldalemelés',s:3,r:'15',w:6,rest:60,inc:1},
  {id:'push',n:'Tricepsz kötél lehúzás',s:3,r:'12',w:35,rest:60,inc:2.5}]},
 {id:'la',name:'Pull A',sub:'Hát · bicepsz',ex:[
  {id:'pull',n:'Húzódzkodás',s:4,r:'6',w:10,rest:180,inc:2.5,bw:1},
  {id:'row',n:'Evezés rúddal',s:4,r:'6',w:55,rest:150,inc:2.5},
  {id:'cable',n:'Ülő kábelevezés',s:3,r:'10',w:60,rest:90,inc:5},
  {id:'face',n:'Arcvonó (face pull)',s:3,r:'15',w:20,rest:60,inc:2.5},
  {id:'curl',n:'Bicepsz hajlítás',s:3,r:'10',w:17.5,rest:60,inc:2.5},
  {id:'hammer',n:'Kalapácshajlítás',s:3,r:'12',w:12.5,rest:60,inc:2.5}]},
 {id:'pb',name:'Push B',sub:'Váll · mell · törzs',ex:[
  {id:'ohp',n:'Ülő rúdas vállból nyomás',s:4,r:'5',w:30,rest:180,inc:2.5},
  {id:'dbbench',n:'Fekvenyomás kézisúlyzóval',s:4,r:'8',w:17.5,rest:150,inc:2.5},
  {id:'dipbw',n:'Tolódzkodás (testsúly)',s:3,r:'10',w:0,rest:120,inc:2.5,bw:1},
  {id:'machinc',n:'Ferdepad gépi nyomás',s:3,r:'10',w:20,rest:120,inc:5},
  {id:'french',n:'Tricepsz francia nyomás',s:3,r:'10',w:25,rest:60,inc:2.5},
  {id:'plank',n:'Plank',s:3,r:'45 mp',w:0,rest:45,inc:5,bw:1,time:1}]},
 {id:'lb',name:'Pull B',sub:'Hát · hátsó lánc',ex:[
  {id:'tbar',n:'T-bar / gépi evezés',s:4,r:'6',w:55,rest:150,inc:2.5},
  {id:'wide',n:'Széles fogású lehúzás',s:4,r:'8',w:60,rest:120,inc:5},
  {id:'onerow',n:'Egykezes kézisúlyzó evezés',s:3,r:'10',w:25,rest:90,inc:2.5},
  {id:'legcurl',n:'Combhajlítás fekve',s:4,r:'10',w:30,rest:120,inc:5},
  {id:'hyp',n:'Hyperextension',s:3,r:'12',w:0,rest:90,inc:5,bw:1},
  {id:'rear',n:'Hátsó vállemelés',s:3,r:'15',w:5,rest:60,inc:1},
  {id:'knee',n:'Hanging knee raise',s:3,r:'12',w:0,rest:60,inc:2.5,bw:1}]}
];

let S = {sessions:[], active:null, weights:{}};
let tab='home', tInt=null, tEnd=0, tLen=0;

const KEY='gymlog_v1';
let storeMode='none';

async function readKey(k){
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r&&r.value){storeMode='claude'; return r.value;} } }catch(e){}
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); if(storeMode==='none')storeMode='local';
       return localStorage.getItem(k); }catch(e){ storeMode='none'; }
  return null;
}
async function writeKey(k,v){
  try{ if(window.storage&&window.storage.set){ await window.storage.set(k,v); return true; } }catch(e){}
  try{ localStorage.setItem(k,v); return true; }catch(e){ return false; }
}

async function load(){
  const raw=await readKey(KEY);
  if(raw){ try{ S=Object.assign(S,JSON.parse(raw)); }catch(e){} }
  render();
}
async function save(){
  const v=JSON.stringify({sessions:S.sessions,active:S.active,weights:S.weights});
  const ok=await writeKey(KEY,v);
  if(!ok&&storeMode!=='none'){ storeMode='none'; render(); }
}

const ARCHIVE = {
  rack:{id:'rack',n:'Felhúzás blokkról (rack pull)',s:4,r:'5',w:60,rest:180,inc:5},
  abs:{id:'abs',n:'Hasprés kábelen',s:3,r:'12',w:20,rest:60,inc:5},
  ohpdb:{id:'ohpdb',n:'Vállból nyomás ülve',s:3,r:'8',w:12.5,rest:120,inc:2.5}
};
function exDef(id){ for(const d of PLAN) for(const e of d.ex) if(e.id===id) return e;
  return ARCHIVE[id] || {id:id,n:id,s:3,r:'10',w:0,rest:90,inc:2.5}; }
function lastFor(id){ for(let i=S.sessions.length-1;i>=0;i--){ const s=S.sessions[i]; if(s.log[id]) return s.log[id]; } return null; }
function startW(id){
  if(S.weights[id]!=null) return S.weights[id];
  const l=lastFor(id); const d=exDef(id);
  if(!l) return d.w;
  const hit=l.sets.length>=d.s && l.sets.every(x=>x!=null && x>=parseInt(d.r));
  return hit ? l.w + d.inc : l.w;
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmtDate(t){const d=new Date(t);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
function wLabel(e,w){ if(e.time) return w>0? '+'+w+' kg':'testsúly'; if(e.bw) return w>0? '+'+w:'testsúly'; return w }

function render(){
  const a=document.getElementById('app');
  if(tab==='home') a.innerHTML = S.active ? sessionView() : homeView();
  else if(tab==='log') a.innerHTML = logView();
  else a.innerHTML = progView();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
}

function homeView(){
  const done = S.sessions.length;
  const wk = S.sessions.filter(s=>Date.now()-s.t < 6048e5).length;
  let h='';
  if(storeMode==='none') h+=`<div class="card" style="border-color:var(--red);margin-top:16px"><div class="pad">
    <span class="cond" style="font-size:18px;font-weight:600;color:var(--red)">A mentés nem működik</span>
    <div class="small mut" style="margin-top:4px">Ez a böngésző letiltotta a helyi tárolást. Kapcsold ki a privát böngészést, vagy engedélyezd a sütiket ehhez az oldalhoz – különben minden bezáráskor elvesznek az adatok.</div></div></div>`;
  h += `<div class="top"><span class="eyebrow">Push / pull · 4 nap</span>
    <h1 style="font-size:34px;margin-top:4px">Melyik nap jön?</h1>
    <p class="mut small" style="margin:6px 0 0">${done} edzés összesen · ${wk} az elmúlt 7 napban</p></div>`;
  const nextIdx = done ? (PLAN.findIndex(d=>d.id===S.sessions[done-1].day)+1)%4 : 0;
  PLAN.forEach((d,i)=>{
    const last = [...S.sessions].reverse().find(s=>s.day===d.id);
    h += `<div class="card"><button class="daybtn" onclick="startDay('${d.id}')">
      <span class="daytag">${i+1}</span>
      <span class="grow"><span class="cond" style="font-size:21px;font-weight:600;display:block">${d.name}${i===nextIdx?'<span class="pill">KÖVETKEZŐ</span>':''}</span>
      <span class="small dim">${d.sub}${last?' · utoljára '+fmtDate(last.t):' · még nem volt'}</span></span>
      <span style="color:var(--dim);font-size:22px">›</span></button></div>`;
  });
  return h;
}

function startDay(id){
  S.active={day:id,t:Date.now(),log:{}};
  PLAN.find(d=>d.id===id).ex.forEach(e=>{ S.active.log[e.id]={w:startW(e.id),sets:new Array(e.s).fill(null)}; });
  save(); render(); window.scrollTo(0,0);
}

function sessionView(){
  const d=PLAN.find(x=>x.id===S.active.day);
  let h=`<div class="top"><span class="eyebrow">Folyamatban</span>
    <h1 style="font-size:34px;margin-top:4px">${d.name}</h1></div>`;
  d.ex.forEach(e=>{
    const L=S.active.log[e.id];
    const complete = L.sets.every(x=>x!=null);
    const last=lastFor(e.id);
    h+=`<div class="card"><div class="pad">
      <div class="exhead"><span class="exname grow">${esc(e.n)}</span>
      ${complete?'<span class="done-badge">kész</span>':`<span class="tgt">${e.s} × ${e.r}</span>`}</div>`;
    if(!e.time){
      h+=`<div class="wt" style="margin-top:10px">
        <button onclick="bump('${e.id}',-1)" aria-label="kevesebb">−</button>
        <div class="val">${wLabel(e,L.w)}${e.bw&&L.w<=0?'':'<span>kg</span>'}</div>
        <button onclick="bump('${e.id}',1)" aria-label="több">+</button></div>`;
    }
    h+='<div class="chips">';
    L.sets.forEach((v,i)=>{
      const t=parseInt(e.r);
      const cls = v==null?'':(v>=t?'done':'miss');
      h+=`<button class="chip ${cls}" onclick="openSet('${e.id}',${i})">
        <span class="r">${v==null?'·':v}</span><span class="l">${i+1}. sz</span></button>`;
    });
    h+='</div>';
    if(last) h+=`<div class="prev">Előző: ${wLabel(e,last.w)}${e.bw&&last.w<=0?'':' kg'} × ${last.sets.map(x=>x==null?'–':x).join(', ')}</div>`;
    if(!last) h+=`<div class="prev dim">Első alkalom – a technika a cél, ne a súly.</div>`;
    const hit = L.sets.every(x=>x!=null&&x>=parseInt(e.r));
    if(hit) h+=`<div class="hint">Mind megvolt → jövő héten ${wLabel(e,L.w+e.inc)}${e.bw&&L.w+e.inc<=0?'':' kg'}</div>`;
    h+='</div></div>';
  });
  h+=`<button class="btn pri" onclick="finish()" style="margin-bottom:10px">Edzés lezárása</button>
      <button class="btn" onclick="if(confirm('Biztos eldobod ezt az edzést?')){S.active=null;save();render()}" style="margin-bottom:20px;color:var(--mut)">Eldobás</button>`;
  return h;
}

function bump(id,dir){ const e=exDef(id),L=S.active.log[id];
  L.w=Math.max(0, Math.round((L.w+dir*e.inc)*10)/10); S.weights[id]=L.w; save(); render(); }

let cur=null;
function openSet(id,i){
  cur={id,i}; const e=exDef(id), L=S.active.log[id], t=parseInt(e.r);
  const opts=[]; for(let k=Math.max(1,t-4);k<=t+6;k++) opts.push(k);
  let h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">${i+1}. szett</span>
    <h2 style="font-size:24px">${esc(e.n)}</h2><span class="small dim">cél: ${e.r}${e.time?'':' ismétlés'}</span></div>
    <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <div class="kb">`;
  opts.forEach(k=>{ h+=`<button onclick="setRep(${k})" style="${k==t?'border-color:var(--brass);color:var(--brass)':''}">${k}</button>`; });
  h+=`</div><button class="btn" style="margin-top:12px;color:var(--mut)" onclick="setRep(null)">Törlés</button>`;
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
function setRep(v){
  const e=exDef(cur.id); S.active.log[cur.id].sets[cur.i]=v;
  closeSheet(); save(); render();
  if(v!=null) startTimer(e.rest);
}

function startTimer(sec){
  tLen=sec; tEnd=Date.now()+sec*1000;
  document.getElementById('timer').classList.add('on');
  clearInterval(tInt); tInt=setInterval(tick,200); tick();
}
function tick(){
  const left=Math.max(0,tEnd-Date.now());
  const s=Math.ceil(left/1000);
  document.getElementById('tval').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  document.getElementById('tfill').style.width=(left/(tLen*1000)*100)+'%';
  if(left<=0){ clearInterval(tInt); if(navigator.vibrate) navigator.vibrate([200,100,200]);
    setTimeout(()=>document.getElementById('timer').classList.remove('on'),2500); }
}
document.getElementById('tskip').onclick=()=>{clearInterval(tInt);document.getElementById('timer').classList.remove('on')};

function finish(){
  const any=Object.values(S.active.log).some(l=>l.sets.some(x=>x!=null));
  if(!any){ alert('Egyetlen szettet sem rögzítettél.'); return; }
  S.sessions.push(S.active); S.active=null; save(); tab='log'; render(); window.scrollTo(0,0);
}

function logView(){
  if(!S.sessions.length) return `<div class="top"><h1 style="font-size:34px">Napló</h1></div>
    <div class="empty">Még nincs lezárt edzés.<br>Kezdd az Edzés fülön.</div>
    <button class="btn" onclick="loadBundled()" style="margin-bottom:8px;color:var(--mut)">Tesztadat betöltése</button>
    <button class="btn" onclick="restore()" style="margin-bottom:20px;color:var(--mut)">Visszaállítás mentésből</button>`;
  let h=`<div class="top"><h1 style="font-size:34px">Napló</h1>
    <p class="mut small" style="margin:6px 0 0">${S.sessions.length} edzés</p></div>`;
  [...S.sessions].reverse().forEach((s,ri)=>{
    const d=PLAN.find(x=>x.id===s.day); const idx=S.sessions.length-1-ri;
    const tot=Object.values(s.log).reduce((a,l)=>a+l.sets.filter(x=>x!=null).length,0);
    h+=`<div class="card"><div class="pad" style="border-bottom:1px solid var(--line)">
      <div class="row"><div class="grow"><span class="cond" style="font-size:20px;font-weight:600">${d.name}</span>
      <div class="small dim">${fmtDate(s.t)} · ${tot} szett</div></div>
      <button onclick="del(${idx})" class="small dim" style="padding:8px">Törlés</button></div></div>`;
    const seen=new Set();
    d.ex.forEach(e=>{ seen.add(e.id); const l=s.log[e.id]; if(!l||!l.sets.some(x=>x!=null))return;
      h+=`<div class="hrow"><span class="small grow">${esc(e.n)}</span>
        <span class="small num mut">${wLabel(e,l.w)}${e.bw&&l.w<=0?'':' kg'} × ${l.sets.map(x=>x==null?'–':x).join(', ')}</span></div>`; });
    Object.keys(s.log).forEach(id=>{ if(seen.has(id))return; const l=s.log[id];
      if(!l||!l.sets.some(x=>x!=null))return; const e=exDef(id);
      h+=`<div class="hrow"><span class="small grow">${esc(e.n)} <span class="dim" style="font-size:11px">· kivéve</span></span>
        <span class="small num mut">${wLabel(e,l.w)}${e.bw&&l.w<=0?'':' kg'} × ${l.sets.map(x=>x==null?'–':x).join(', ')}</span></div>`; });
    h+='</div>';
  });
  h+=`<button class="btn" onclick="copyAll()" style="margin-bottom:8px">Napló másolása szövegként</button>
      <button class="btn" onclick="backup()" style="margin-bottom:8px;color:var(--mut)">Biztonsági mentés (adatfájl)</button>
      <button class="btn" onclick="restore()" style="margin-bottom:20px;color:var(--mut)">Visszaállítás mentésből</button>`;
  return h;
}
function backup(){
  const v=JSON.stringify({sessions:S.sessions,weights:S.weights});
  const b=new Blob([v],{type:'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u;
  a.download='edzesnaplo-'+fmtDate(Date.now()).replace(/\./g,'')+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function restore(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=()=>{ const f=i.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!Array.isArray(d.sessions)) throw 0;
      if(!confirm('Ez felülírja a jelenlegi '+S.sessions.length+' edzést '+d.sessions.length+' mentett edzéssel. Folytatod?')) return;
      S.sessions=d.sessions; S.weights=d.weights||{}; save(); render();
    }catch(e){ alert('Ez nem érvényes mentésfájl.'); } };
    r.readAsText(f); };
  i.click();
}
async function loadBundled(){
  try{
    const res=await fetch('edzesnaplo-backup.json',{cache:'no-store'});
    if(!res.ok) throw 0;
    const d=await res.json();
    if(!Array.isArray(d.sessions)) throw 0;
    if(S.sessions.length && !confirm('Ez felülírja a jelenlegi '+S.sessions.length+' edzést '+d.sessions.length+' mentett edzéssel. Folytatod?')) return;
    S.sessions=d.sessions; S.weights=d.weights||{}; save(); render();
  }catch(e){ alert('A tesztadat betöltése nem sikerült.'); }
}
function del(i){ if(confirm('Törlöd ezt az edzést?')){ S.sessions.splice(i,1); save(); render(); } }
function copyAll(){
  let t='Edzésnapló\n\n';
  S.sessions.forEach(s=>{ const d=PLAN.find(x=>x.id===s.day);
    t+=fmtDate(s.t)+' — '+d.name+'\n';
    const seen=new Set();
    d.ex.forEach(e=>{seen.add(e.id); const l=s.log[e.id]; if(l&&l.sets.some(x=>x!=null))
      t+='  '+e.n+': '+wLabel(e,l.w)+(e.bw&&l.w<=0?'':' kg')+' × '+l.sets.map(x=>x==null?'–':x).join(', ')+'\n';});
    Object.keys(s.log).forEach(id=>{ if(seen.has(id))return; const l=s.log[id];
      if(!l.sets.some(x=>x!=null))return; const e=exDef(id);
      t+='  '+e.n+' (kivéve): '+wLabel(e,l.w)+(e.bw&&l.w<=0?'':' kg')+' × '+l.sets.map(x=>x==null?'–':x).join(', ')+'\n';});
    t+='\n'; });
  navigator.clipboard.writeText(t).then(()=>alert('Vágólapra másolva. Beillesztheted a chatbe.'),()=>alert('Nem sikerült a másolás.'));
}

function progView(){
  const ids=[]; const seen=new Set();
  PLAN.forEach(d=>d.ex.forEach(e=>{ seen.add(e.id);
    if(S.sessions.some(s=>s.log[e.id]&&s.log[e.id].sets.some(x=>x!=null))) ids.push(e.id); }));
  S.sessions.forEach(s=>Object.keys(s.log).forEach(id=>{
    if(seen.has(id)||ids.includes(id))return;
    if(s.log[id].sets.some(x=>x!=null)) ids.push(id); }));
  if(!ids.length) return `<div class="top"><h1 style="font-size:34px">Haladás</h1></div>
    <div class="empty">Két-három edzés után lesz mit mutatni.</div>`;
  let h=`<div class="top"><h1 style="font-size:34px">Haladás</h1>
    <p class="mut small" style="margin:6px 0 0">Munkasúly gyakorlatonként</p></div>`;
  ids.forEach(id=>{
    const e=exDef(id);
    const pts=S.sessions.filter(s=>s.log[id]&&s.log[id].sets.some(x=>x!=null)).map(s=>s.log[id].w);
    const mn=Math.min(...pts), mx=Math.max(...pts), rng=(mx-mn)||1;
    let d='';
    pts.forEach((p,i)=>{ const x=pts.length>1? i/(pts.length-1)*100 : 50; const y=38-((p-mn)/rng)*32; d+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1); });
    const delta=pts[pts.length-1]-pts[0];
    h+=`<div class="card"><div class="pad">
      <div class="row" style="align-items:baseline"><span class="cond grow" style="font-size:19px;font-weight:600">${esc(e.n)}</span>
      <span class="num" style="font-size:24px;font-weight:700">${wLabel(e,pts[pts.length-1])}<span class="small dim" style="font-weight:400">${e.bw&&pts[pts.length-1]<=0?'':' kg'}</span></span></div>
      <div class="small ${delta>0?'':'dim'}" style="${delta>0?'color:var(--sage)':''}">${delta>0?'+'+delta+' kg az indulás óta':delta<0?delta+' kg':'változatlan'} · ${pts.length} alkalom</div>
      ${pts.length>1?`<svg class="spark" viewBox="0 0 100 44" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--brass)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`:''}
      </div></div>`;
  });
  return h;
}

/* ---- Téma (világos / sötét) ---------------------------------------- */
function currentTheme(){ try{ return localStorage.getItem('gymlog_theme')||'auto'; }catch(e){ return 'auto'; } }
function effectiveDark(){ const t=currentTheme();
  if(t==='dark') return true; if(t==='light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(){
  const t=currentTheme(), root=document.documentElement;
  if(t==='auto') delete root.dataset.theme; else root.dataset.theme=t;
  const dark=effectiveDark();
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=dark?'#0F1317':'#F4F2EC';
  const b=document.getElementById('themeBtn'); if(b) b.textContent=dark?'☾':'☀';
}
function toggleTheme(){
  try{ localStorage.setItem('gymlog_theme', effectiveDark()?'light':'dark'); }catch(e){}
  applyTheme();
}
document.getElementById('themeBtn').onclick=toggleTheme;
if(window.matchMedia){ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(currentTheme()==='auto') applyTheme(); }); }
applyTheme();

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
document.getElementById('sheet').onclick=e=>{ if(e.target.id==='sheet') closeSheet(); };
load();

// Service worker – offline app-héj. Az edzésadatot (localStorage) nem érinti.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
