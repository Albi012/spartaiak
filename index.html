<!DOCTYPE html>
<html lang="hu">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Edzésnapló</title>
<meta name="theme-color" content="#0F1317">
<meta name="description" content="Push/pull edzésnapló telefonra – egy kézzel, edzés közben.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Edzésnapló">
<script>try{var _t=localStorage.getItem('gymlog_theme');if(_t==='light'||_t==='dark')document.documentElement.dataset.theme=_t;
/* A státuszsáv színe már az ELSŐ festésnél stimmeljen: enélkül egy világos
   témás telefon sötét sávval villan fel, amíg a fő script le nem fut.
   A kézi váltó miatt média-query-s meta nem elég – itt is a tényleges
   állapotból számolunk. */
var _d=_t?_t==='dark':!matchMedia('(prefers-color-scheme: light)').matches;
var _m=document.querySelector('meta[name="theme-color"]');if(_m)_m.content=_d?'#0F1317':'#F4F2EC';}catch(e){}</script>
<!-- A betűk a repóból jönnek (vendor/fonts), nem a Google Fonts CDN-ről:
     így az app első indításkor is offline-kész, nem függ idegen hoszttól, és
     nem kér le semmit a felhasználóról egy harmadik félnél. -->
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* ---- Téma tokenek ---------------------------------------------------
   Alap = sötét (teremben ez az alapértelmezett). A rendszer világos
   beállítását követi, ha nincs kézi választás; a kézi váltó a
   [data-theme] attribútummal felülírja. */
:root{
  --bg:#0F1317; --card:#171D24; --card2:#1F2833; --line:#2A343F;
  --ink:#EAF0F5; --mut:#94A2B0; --dim:#6A7885;
  --brass:#E0A93E; --brass-d:#3A2E13; --on-brass:#1A1206;
  --sage:#63C295; --sage-d:#14291E;
  --red:#E9694C; --miss-bg:#3A241E;
  --bar:rgba(15,19,23,.72); --shadow:rgba(0,0,0,.45);
  /* Toast = INVERZ felület (a szövegszín a háttér). Sötétben a kártyák
     mind sötétek, világosban mind fehérek – egy azonos fajsúlyú doboz
     beleolvadna a tartalomba. Az inverz sosem. */
  --toast-bg:#E3EAF1; --toast-ink:#141A21;
  --gif-filter:brightness(.8) contrast(1.04);
}

/* Mozgás-tokenek. A beépített CSS-easingek gyengék: az `ease` lassan indul,
   és pont azt a pillanatot késlelteti, amit a szem a legjobban figyel.
   `ease-in` SEHOL nincs a felületen – tőle lomhának érződik a felület.
   A koppintás-visszajelzés MÉRETHEZ kötött rendszer, nem elemenkénti ízlés:
   nagyobb felületen a kisebb elmozdulás ugyanakkora érzetet ad. */
:root{
  --ease-out:cubic-bezier(.23,1,.32,1);       /* belépés, visszajelzés */
  --ease-in-out:cubic-bezier(.77,0,.175,1);   /* képernyőn belüli mozgás */
  --press-sm:.94;                              /* kis kontroll (ikon, chip, nav) */
  --press-md:.97;                              /* gomb */
  --press-lg:.99;                              /* nagy kártya */
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#F4F2EC; --card:#FFFFFF; --card2:#F1EEE6; --line:#E4DFD3;
    --ink:#20262D; --mut:#5C6772; --dim:#95A0AC;
    --brass:#A9740F; --brass-d:#F1E6CB; --on-brass:#211603;
    --sage:#2C9A64; --sage-d:#DDF0E6;
    --red:#C8492C; --miss-bg:#FBE7E0;
    --bar:rgba(244,242,236,.8); --shadow:rgba(40,50,60,.14);
  --toast-bg:#242B33; --toast-ink:#F4F2EC;
  --gif-filter:none;
  }
}
:root[data-theme="light"]{
  --bg:#F4F2EC; --card:#FFFFFF; --card2:#F1EEE6; --line:#E4DFD3;
  --ink:#20262D; --mut:#5C6772; --dim:#95A0AC;
  --brass:#A9740F; --brass-d:#F1E6CB; --on-brass:#211603;
  --sage:#2C9A64; --sage-d:#DDF0E6;
  --red:#C8492C; --miss-bg:#FBE7E0;
  --bar:rgba(244,242,236,.8); --shadow:rgba(40,50,60,.14);
  --toast-bg:#242B33; --toast-ink:#F4F2EC;
  --gif-filter:none;
}
:root[data-theme="dark"]{
  --bg:#0F1317; --card:#171D24; --card2:#1F2833; --line:#2A343F;
  --ink:#EAF0F5; --mut:#94A2B0; --dim:#6A7885;
  --brass:#E0A93E; --brass-d:#3A2E13; --on-brass:#1A1206;
  --sage:#63C295; --sage-d:#14291E;
  --red:#E9694C; --miss-bg:#3A241E;
  --bar:rgba(15,19,23,.72); --shadow:rgba(0,0,0,.45);
  /* Toast = INVERZ felület (a szövegszín a háttér). Sötétben a kártyák
     mind sötétek, világosban mind fehérek – egy azonos fajsúlyú doboz
     beleolvadna a tartalomba. Az inverz sosem. */
  --toast-bg:#E3EAF1; --toast-ink:#141A21;
  --gif-filter:brightness(.8) contrast(1.04);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
/* Mobil-alapok. `overscroll-behavior:none` a gyökéren: az app saját görgető
   dobozokkal dolgozik, a lehúzás-frissítés és a teljes oldal gumizása itt
   csak elveszi a gesztust. A `text-size-adjust` az iOS fekvő nézetben
   magától felnagyítaná a szöveget. */
html{overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* A KONTROLLOK felirata nem szöveg, hanem vezérlő: hosszan nyomva ne
   jelölődjön ki, és ne jöjjön föl a másolás-buborék. A TARTALOM (napló,
   jegyzet, barát-kód, edzői export) marad kijelölhető – azt másolni kell. */
button,[role="button"],.seg,.kb,.wt,.whyc,.mgchip,.daytag,.pill,.nav,summary{
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:120px;overscroll-behavior-y:contain;transition:background .25s,color .25s}
body.playing{padding-bottom:0}
body.playing .appbar,body.playing .nav{display:none}
.num,.cond{font-family:'Barlow Condensed',Barlow,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
/* MINDEN beviteli mező legalább 16px: iOS Safari ez alatt ráközelít a
   mezőre fókuszkor, és kilépéskor NEM zoomol vissza – a felhasználó egy
   elcsúszott, levágott felületen marad. A `.small` címkébe ágyazott mezők
   (saját gyakorlat: szett/ism./súly/lépés/pihenő) ezért 13px-en álltak,
   mert az `input{font-size:inherit}` a 13px-es címkétől örökölt.
   Nem `(pointer: coarse)` mögé tettük: ez az app telefonra készült, nincs
   asztali elrendezés, amit védeni kellene – és így mérhető is.
   A megoldás SOHA nem a `user-scalable=no` / `maximum-scale=1` – az
   akadálymentességi hiba, ráadásul csak a tünetet takarja el. */
input,select,textarea{font-size:16px}
input,select{font-family:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Felső sáv (böngésző mód) */
.appbar{position:sticky;top:0;z-index:40;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.appbar-in{max-width:560px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{width:22px;height:22px;color:var(--brass);flex:none}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--mut);border:1px solid var(--line);background:var(--card);flex:none}
.iconbtn:active{background:var(--card2);transform:scale(var(--press-sm))}
.svgic{width:22px;height:22px;display:block}
.iconbtn .svgic{width:20px;height:20px}
.daytag .svgic{width:24px;height:24px}
.nav .ic .svgic{width:22px;height:22px;margin:2px auto 0}

.top{padding:22px 0 10px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.pad{padding:15px 16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.small{font-size:13px}

/* Napválasztó / folytatás */
.daybtn{width:100%;text-align:left;padding:15px;display:flex;align-items:center;gap:14px}
.daybtn:active{background:var(--card2)}
.daytag{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1;color:var(--brass);
  width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:1px solid var(--line);border-radius:13px}
.pill{display:inline-block;font-size:11px;letter-spacing:.09em;font-weight:700;color:var(--on-brass);
  background:var(--brass);padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}

/* Kör-progress a Folytatás kártyán (mai készültség) */
.miniring{position:relative;width:46px;height:46px;flex:none}
.miniring svg{width:100%;height:100%;transform:rotate(-90deg)}
.miniring .mr-bg{fill:none;stroke:var(--card2);stroke-width:4}
.miniring .mr-fg{fill:none;stroke:var(--brass);stroke-width:4;stroke-linecap:round}
.miniring .mr-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--brass)}
.miniring .mr-ic .svgic{width:20px;height:20px}

/* Szett-chipek */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{width:56px;height:56px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform 120ms var(--ease-out),background 120ms ease}
.chip:active{transform:scale(var(--press-sm))}
.chip .r{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.chip .l{font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.chip.done{background:var(--sage-d);border-color:var(--sage)}
.chip.done .r{color:var(--sage)}
.chip.done .l{color:var(--sage);opacity:.85}
.chip.miss{background:var(--miss-bg);border-color:var(--red)}
.chip.miss .r{color:var(--red)}

/* Súlyállító */
.wt{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card2)}
.wt button{width:64px;height:64px;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:600;color:var(--brass)}
.wt button:active{background:var(--brass-d);transform:scale(var(--press-sm))}
.wt .val{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;padding:0 4px}
.wt .val span{font-size:16px;color:var(--dim);font-family:Barlow;font-weight:500;margin-left:4px}
/* Kisebb súlyállító a napló-javító lapra: ott több gyakorlat van egymás
   alatt, a lejátszó 64px-es vezérlője feleslegesen hosszúvá tenné a lapot.
   48px – továbbra is a 44px-es koppintási minimum fölött. */
.wt.sm button{width:48px;height:48px;font-size:26px}
.wt.sm .val{font-size:28px}
.wt.sm .val span{font-size:14px}
.prev{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--brass);font-weight:500}

/* Gombok */
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
a.btn{text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.btn.ghost{background:transparent;box-shadow:none}
.btn:active{transform:scale(var(--press-md))}
.btn:disabled{opacity:.4}

/* Lebegő alsó navigáció (böngésző mód) */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:420px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;display:flex;padding:6px;gap:4px;box-shadow:0 10px 30px var(--shadow);z-index:30}
.nav button{flex:1;padding:9px 4px;border-radius:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.nav button.on{color:var(--brass);background:var(--card2)}
.nav button{position:relative}
.nav .ic{display:block;font-family:'Barlow Condensed',sans-serif;font-size:20px;margin-bottom:2px}
.ndot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--red);border:1.5px solid var(--bar);display:none}
.ndot.on{display:block}

/* ---- Edzés-lejátszó (immerzív) ------------------------------------- */
.player{min-height:100dvh;display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 4px}
.ptop .pmid{flex:1;text-align:center;min-width:0}
.ptop .pmid .d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.ptop .pmid .c{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;color:var(--mut)}
.pdots{display:flex;gap:6px;justify-content:center;padding:8px 14px 2px;flex-wrap:wrap}
.pdot{width:26px;height:7px;border-radius:4px;background:var(--card2);border:1px solid var(--line);padding:0}
.pdot.done{background:var(--sage);border-color:var(--sage)}
.pdot.cur{background:var(--brass);border-color:var(--brass);width:34px}
.pmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding:12px 18px;max-width:560px;margin:0 auto;width:100%;overflow-y:auto}
.pname{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;line-height:1.08}
.pmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.pchips{display:flex;gap:10px;flex-wrap:wrap}
.pchips .chip{width:64px;height:64px}
.pchips .chip .r{font-size:27px}
.pfoot{display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;width:100%;position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 55%,transparent)}
.pfoot .btn{margin:0}
.discard{display:block;margin:2px auto 0;padding:8px 14px;color:var(--dim);font-size:13px}

/* Pihenő – KIS ÓRA a gyakorlat neve mellett, nem teljes képernyős ablak.
   Edzés közben azt akarod látni, min állsz és mennyi szett van hátra; egy
   rátakaró overlay ezt elveszi, és külön ki kell nyomni. Itt a kör maga a
   gomb: egy koppintás leállítja. 52px – bőven a 44px-es minimum fölött. */
.restpill{position:relative;width:52px;height:52px;flex:none;padding:0;border:0;background:none;
  display:flex;align-items:center;justify-content:center}
.restpill svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.restpill:active{transform:scale(var(--press-sm))}
.rp-bg{fill:none;stroke:var(--card2);stroke-width:5}
/* NINCS `transition` a gyűrűn: az ürülést egyetlen, a pihenő teljes
   hosszára szóló WAAPI-animáció viszi (lásd `syncRestRing`). A korábbi
   200 ms-os átmenet pont a 200 ms-os tickre esett, így a gyűrű sosem ért
   célba a következő írás előtt – és újraindításkor VISSZAFELÉ söpört. */
.rp-fg{fill:none;stroke:var(--brass);stroke-width:5;stroke-linecap:round}
.rp-val{position:relative;font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;
  font-size:15px;font-weight:700;color:var(--brass);line-height:1}

/* Gyakorlat-fejléc (böngésző nézetekben) */
.exhead{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.exname{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;line-height:1.15}
.tgt{font-size:14px;color:var(--dim);white-space:nowrap}
.done-badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);font-weight:700}
.ssbadge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);font-weight:700;border:1px solid var(--brass);border-radius:999px;padding:2px 8px}
.ssrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--mut);background:var(--brass-d);border-radius:12px;padding:10px 12px}
.ssrow .cur{color:var(--brass);font-weight:700}
.ssrow .arr{color:var(--dim)}
.muscmap{width:100%;max-width:300px;height:auto;display:block;margin:12px auto 4px;color:var(--mut)}
.muscmap.sm{max-width:150px;margin:4px auto 0}
.mgchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.mgchip{font-size:12px;color:var(--mut);background:var(--card2);border-radius:999px;padding:4px 10px;text-transform:capitalize}
.mgchip b{color:var(--brass);font-variant-numeric:tabular-nums}
.mmleg{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:2px;font-size:11px;color:var(--dim)}
.mmleg i{flex:0 0 84px;height:8px;border-radius:5px;background:linear-gradient(90deg,var(--brass),var(--red))}
.mmfold>summary{list-style:none;cursor:pointer;padding:12px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600;display:flex;align-items:center;min-height:44px;box-sizing:border-box}
.mmfold>summary::-webkit-details-marker{display:none}
.mmfold>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform 180ms var(--ease-out)}
.mmfold[open]>summary::after{transform:rotate(-135deg)}

/* Napló sorok */
.hrow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.spark{width:100%;height:44px;display:block;margin-top:10px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{display:flex;flex-direction:column;align-items:flex-start}
.stat .num{font-size:34px;font-weight:700;line-height:1}
.statlbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:3px}
.pcard{cursor:pointer}
.pcard:active{background:var(--card2)}
.histrow{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.histrow .d{color:var(--mut);font-size:14px;flex:0 0 82px;font-variant-numeric:tabular-nums}
.histrow .w{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;flex:0 0 auto}
.histrow .r{color:var(--dim);font-size:13px;flex:1;text-align:right}
.chartbig{width:100%;height:120px;display:block;margin:6px 0 2px}
.mgrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.mglbl{flex:0 0 74px;font-size:14px;color:var(--mut);text-transform:capitalize}
.mgtrack{flex:1;height:12px;background:var(--card2);border-radius:7px;overflow:hidden}
.mgfill{display:block;height:100%;width:100%;border-radius:7px;transform-origin:left center;transform:scaleX(var(--p,1))}
.mgval{flex:0 0 26px;font-size:18px;font-weight:700;text-align:right}
.toolrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tool{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--mut);font-size:13px;font-weight:600}
.tool:active{background:var(--card2);transform:scale(var(--press-sm))}
.tool .svgic{width:15px;height:15px}
.seg{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{flex:1;background:var(--card);color:var(--mut);border:0;padding:9px 0;font-size:14px;font-weight:600}
.seg button:active{transform:scale(var(--press-sm))}
.seg button.on{background:var(--brass);color:var(--on-brass)}
.hmwrap{overflow-x:auto;margin-top:8px;padding-bottom:4px}
.hm{display:flex;gap:3px;min-width:min-content}
.hmcol{display:flex;flex-direction:column;gap:3px}
.hmcell{width:13px;height:13px;border-radius:3px;background:var(--card2);flex:none}
.plateres{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center;align-items:flex-end;min-height:60px}
.plate{background:var(--brass);color:var(--on-brass);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;width:38px}
.platesum{text-align:center;margin-top:12px;color:var(--mut)}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow-n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--card2);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.empty{text-align:center;padding:44px 20px 28px;color:var(--dim)}

/* Alsó lap (szett-billentyűzet) */
.sheet{position:fixed;inset:0;display:none;align-items:flex-end;z-index:70}
.sheet::before{content:'';position:absolute;inset:0;background:rgba(8,10,13,.6);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet.on{display:flex}
/* Kilépés: a lap LECSÚSZIK, ahogy felcsúszott. Korábban a `display:none`
   egyszerűen eltüntette – miközben LEHÚZVA animálva zárult. Ugyanaz a
   felület kétféleképp tűnt el, és pont ez vette el a lehúzás-gesztus
   magától értetődőségét. 200 ms: GYORSABB a 260 ms-os belépésnél – a
   megnyitásról te döntesz, a bezárás a rendszer válasza.
   A halványulás itt van, nem a `no-preference` blokkban: csökkentett
   mozgásnál a CSÚSZÁS marad el, nem az egész átmenet. */
@keyframes sheetFadeOut{to{opacity:0}}
.sheet.on.closing{pointer-events:none}
/* A sötétítés `ease`-zel megy (ez színváltás-jellegű, nem be/kilépő elem),
   így a lap csúszásával együtt halványul, nem szalad el előle. */
.sheet.on.closing::before{animation:sheetFadeOut 200ms ease both}
.sheet .inner{position:relative;background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px var(--shadow);max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kb button{padding:16px 0;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.kb button:active{background:var(--brass-d);transform:scale(var(--press-sm))}
/* Kézi ismétlés-mező a rács alatt: a natív számléptető nyilai csak szűkítik
   a beviteli felületet, ezért elrejtjük – a telefon számbillentyűzete jön fel. */
#repMan{-moz-appearance:textfield;min-height:48px}
#repMan::-webkit-outer-spin-button,#repMan::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.4}
textarea:focus{outline:2px solid var(--brass);outline-offset:2px}

/* Gyakorlat-jegyzet + fotó */
.exnote{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.exnote-t{font-size:14px;color:var(--mut);white-space:pre-wrap;flex:1;min-width:0}
.exphoto{width:64px;height:64px;object-fit:cover;border-radius:11px;border:1px solid var(--line);flex:none}
.exphoto.lg{width:100%;height:auto;max-height:280px;object-fit:contain;background:var(--card2)}
/* Technika-animáció (GIF). A képek fehér hátterűek, ezért saját fehér
   alapon ülnek – így sötét témában sem villan be éles keret. */
.exgif{margin:10px auto 0;padding:0;max-width:200px;width:100%}
.exgif img{display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:#fff;filter:var(--gif-filter)}
.exgif figcaption{margin-top:4px;text-align:center;font-size:11px;color:var(--dim)}
.exgif figcaption a{color:var(--dim)}
.exgift{width:44px;height:44px;flex:none;border-radius:9px;border:1px solid var(--line);background:#fff;object-fit:cover;filter:var(--gif-filter)}
/* Készenlét (readiness): gyűrű, ítélet, tényező-sorok. */
.rdycard{border-color:var(--line)}
.rdyhero{position:relative;display:inline-flex;align-items:center;justify-content:center;margin:10px auto 0}
.rdy-fg{transition:stroke-dashoffset 380ms var(--ease-out)}
.rdycard .eyebrow{display:block}
.rdyring{display:block;transform:rotate(-90deg)}
.rdyval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rdyval .num{font-size:58px;font-weight:700;line-height:1}
.rdylbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:3px}
.rdyverdict{font-size:17px;margin-top:12px}
.rdyrows{margin-top:16px}
.rdyrow{display:flex;align-items:center;gap:12px;padding:11px 0}
.rdyrow+.rdyrow{border-top:1px solid var(--line)}
.rdyname{flex:0 0 78px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600;line-height:1.2}
.rdybar{flex:1;display:block;height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.rdybar>span{display:block;height:100%;width:100%;border-radius:5px;transform-origin:left center;transform:scaleX(var(--p,0));transition:transform 420ms var(--ease-out)}
.rdynum{flex:0 0 76px;text-align:right;font-size:17px;font-weight:700}
.rdysep{height:1px;background:var(--line)}
.rdyspark{width:100%;display:block}
/* Lejátszó-sáv: a készenlét tanácsa a súlyra – csak tájékoztat, nem állít. */
.rdystrip{display:flex;align-items:center;gap:11px;margin:6px 18px 0;padding:11px 14px;border-radius:14px;border:1px solid;width:auto}
.rdystrip .num{font-size:22px;font-weight:700;flex:none}
.rdystrip span.t{flex:1;font-size:13px;line-height:1.35}

/* Terv kontra valóság / sérülés – választható címkék */
/* Heti sáv a főoldalon: 7 egyenlő oszlop, hétfőtől. A cella maga nem
   koppintható (nincs mit tenni egy múltbeli napon) – a cselekvés a terv
   listájában van alatta. */
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.wkday{display:flex;flex-direction:column;align-items:center;gap:6px}
.wklbl{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.04em}
.wkcell{width:100%;aspect-ratio:1;max-height:38px;border-radius:11px;background:var(--card2);
  border:1px solid transparent;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--dim)}
.wkcell.done{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.wkcell.rest{color:var(--mut)}
.wkcell.today{border-color:var(--brass)}
.wkcell.future{opacity:.45}
/* A cella alatti kis cimke: mi van erre a napra beosztva (ha van beosztás). */
.wkplan{font-size:9px;line-height:1.15;text-align:center;color:var(--dim);
  max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.whyrow{display:flex;flex-wrap:wrap;gap:8px}
.whyc:active{transform:scale(var(--press-sm))}
.whyc{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:13px;font-weight:600}
.whyc.on{border-color:var(--brass);color:var(--brass);background:var(--brass-d)}
.sslink{display:block;margin:-4px auto 6px;padding:5px 12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--mut);font-size:12px;font-weight:600}
.sslink.on{border-style:solid;border-color:var(--brass);color:var(--brass);background:var(--brass-d)}

/* Figyelmeztető szalag */
.banner{background:var(--brass-d);border:1px solid var(--brass);color:var(--brass);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}

/* Fotónéző */
.photo{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(6,8,10,.9);padding:16px}
.photo.on{display:flex}
.photo img{max-width:100%;max-height:100%;border-radius:12px}

/* Témázott megerősítő / értesítő modál (a natív confirm/alert helyett) */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,13,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px}
.modal.on{display:flex}
/* Kilépés: a modál összehúzódik és elhalványul – nem tűnik el egy
   képkockán. 150 ms, kevesebb, mint a lap 200 ms-a: kisebb felület, és a
   döntést már meghoztad. `transform-origin` KÖZÉPEN marad: a modál nem
   triggerhez kötött, a képernyő közepén jelenik meg.
   `.modal.on.closing`, hogy a belépő `fadeIn … both`-ot fajsúlyban verje. */
@keyframes modalOut{to{opacity:0}}
@keyframes modalCardOut{to{opacity:0;transform:scale(.96)}}
.modal.on.closing{animation:modalOut 150ms ease both;pointer-events:none}
.modal-card{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;
  padding:22px 20px;width:min(92vw,380px);box-shadow:0 20px 60px var(--shadow)}
.modal-msg{font-size:16px;line-height:1.5;white-space:pre-wrap}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}

/* ---- Toast: nyugtázás, ami NEM állít meg ---------------------------
   A modál (`uiAlert`) DÖNTÉST kér: rátakar a felületre és egy „Rendben"
   koppintást vár. Ami viszont csak annyit közöl, hogy „megtörtént"
   („Név elmentve.", „Vágólapra másolva."), az nem ér meg egy koppintást –
   edzés közben végképp nem. Az ilyen a toastra tartozik: megjelenik,
   elolvasod, magától eltűnik. Hiba és hiányzó adat MARAD modál: ott a
   felhasználónak tennie kell valamit.
   A nav FÖLÖTT ül (z-index 100), hogy nyitott lapon is látszódjon. */
.toast{position:fixed;left:50%;z-index:100;display:none;
  bottom:calc(76px + env(safe-area-inset-bottom));
  width:calc(100% - 32px);max-width:400px;
  transform:translate(-50%,0);
  background:var(--toast-bg);color:var(--toast-ink);
  border-radius:14px;box-shadow:0 12px 34px var(--shadow);
  padding:13px 16px;font-size:14px;line-height:1.4;font-weight:500;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.toast.on{display:block}
/* A halványulás MINDIG megy (mint a lapnál), a csúszás csak akkor, ha a
   felhasználó nem kért csökkentett mozgást. A `.closing` fajsúlyban veri
   a belépőt, ezért nem kell külön trükk. */
@keyframes toastFadeIn{from{opacity:0}}
@keyframes toastFadeOut{to{opacity:0}}
.toast.on{animation:toastFadeIn 200ms var(--ease-out) both}
.toast.on.closing{animation:toastFadeOut 160ms var(--ease-out) both;pointer-events:none}

/* ---- Mikro-interakciók: szett-visszajelzés, lap- és nézetváltás -----
   Minden anim csak akkor fut, ha a felhasználó nem kért csökkentett
   mozgást (prefers-reduced-motion). A haptikát a JS adja (navigator.vibrate);
   itt a kísérő vizuális visszajelzés van. */
@media (prefers-reduced-motion: no-preference){
  @keyframes chipPop{0%{transform:scale(1)}42%{transform:scale(1.16)}100%{transform:scale(1)}}
  @keyframes sheetUp{from{transform:translateY(26px)}to{transform:translateY(0)}}
  @keyframes sheetOut{to{transform:translateY(100%)}}
  @keyframes vtOut{to{opacity:0}}
  @keyframes vtIn{from{opacity:0}to{opacity:1}}
  .chip.pop{animation:chipPop .3s cubic-bezier(.25,.8,.3,1.35)}
  .sheet.on .inner{animation:sheetUp .26s cubic-bezier(.2,.7,.3,1)}
  .sheet.on.closing .inner{animation:sheetOut 200ms var(--ease-out) both}
  /* A toast alulról érkezik és lefelé megy ki – ugyanaz az irány, mint a
     lapnál. A kilépés (160 ms) GYORSABB a belépésnél (220 ms): a
     megjelenésről az app dönt, az eltűnés a rendszer válasza. */
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}}
  @keyframes toastOut{to{opacity:0;transform:translate(-50%,8px) scale(.98)}}
  .toast.on{animation:toastIn 220ms var(--ease-out) both}
  .toast.on.closing{animation:toastOut 160ms var(--ease-out) both}
  ::view-transition-old(appview){animation:vtOut .16s ease both}
  ::view-transition-new(appview){animation:vtIn .24s cubic-bezier(.2,.7,.3,1) both}
}

/* ---- Belépő- és felületi animációk (TISZTÁN vizuális) ---------------
   Nézetbe lépéskor a kártyák lépcsőzetesen beúsznak, a sávok/gyűrűk
   kirajzolódnak, az overlayek lágyan nyílnak. Semmilyen funkciót nem
   érint – csak megjelenés. prefers-reduced-motion alatt minden kikapcsol.
   A `.enter` osztályt az enterAnim() teszi az #app-ra nézetváltáskor. */
@media (prefers-reduced-motion: no-preference){
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(var(--p,1))}}
  @keyframes navPop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}

  /* Lépcsőzetes kártya-belépő */
  /* A fül-váltás naponta sokszor megtörténik: ami sokszor látszik, az ne
     legyen látványos. Rövidebb út (8px), rövidebb idő (260 ms), és a
     lépcső a 6. kártyánál megáll – a 9. kártyára várni már türelemjáték. */
  #app.enter .wrap>*{animation:riseIn .26s var(--ease-out) both}
  #app.enter .wrap>*:nth-child(2){animation-delay:.03s}
  #app.enter .wrap>*:nth-child(3){animation-delay:.06s}
  #app.enter .wrap>*:nth-child(4){animation-delay:.09s}
  #app.enter .wrap>*:nth-child(5){animation-delay:.12s}
  #app.enter .wrap>*:nth-child(n+6){animation-delay:.15s}
  #app.enter .player .pmain>*{animation:riseIn .24s var(--ease-out) both}
  #app.enter .player .pmain>*:nth-child(2){animation-delay:.03s}
  #app.enter .player .pmain>*:nth-child(3){animation-delay:.06s}
  #app.enter .player .pmain>*:nth-child(n+4){animation-delay:.09s}

  /* Sávok, gyűrűk, térkép, grafikonok kirajzolódása */
  #app.enter .mgfill{animation:growX .42s var(--ease-out) .06s both}
  #app.enter .miniring{animation:popIn .28s var(--ease-out) .04s both}
  #app.enter .muscmap{animation:fadeIn .3s ease .08s both}
  #app.enter .hmwrap{animation:fadeIn .3s ease .06s both}
  #app.enter .chartbig,#app.enter .spark{animation:fadeIn .3s ease .06s both}
  /* Edzés-összegző: EGYSZER látod edzésenként – ez az app egyetlen helye,
     ahol a „gyönyörködtetés" belefér. A lépcső bőkezűbb (40 ms), és az
     XP-sáv KÉSLELTETVE tölt fel, hogy a szintsor elolvasása UTÁN induljon.
     Az `#app.enter .mgfill` ide nem ér el: a `#sheet` az `#app` TESTVÉRE,
     ezért a sáv eddig egyáltalán nem animálódott. */
  .finish>*{animation:riseIn .26s var(--ease-out) both}
  .finish>*:nth-child(2){animation-delay:.04s}
  .finish>*:nth-child(3){animation-delay:.08s}
  .finish>*:nth-child(4){animation-delay:.12s}
  .finish>*:nth-child(5){animation-delay:.16s}
  .finish>*:nth-child(n+6){animation-delay:.2s}
  .finish .mgfill{animation:growX .5s var(--ease-out) .25s both}

  /* Overlayek lágy nyitása */
  .sheet.on::before{animation:fadeIn .2s ease both}
  .modal.on{animation:fadeIn .18s ease both}
  .modal.on .modal-card{animation:popIn .26s cubic-bezier(.2,.7,.3,1.25) both}
  .modal.on.closing .modal-card{animation:modalCardOut 150ms var(--ease-out) both}
  .photo.on{animation:fadeIn .18s ease both}
  .photo.on img{animation:popIn .28s cubic-bezier(.2,.7,.3,1.2) both}

  /* Alsó nav: az aktív fül ikonja pukkan egyet váltáskor */
  .nav button.on .svgic{animation:navPop .34s cubic-bezier(.25,.8,.3,1.3)}
}

/* Finom állapot- és press-átmenetek (mozgásmentesen is ártalmatlanok) */
.nav button{transition:color .2s ease,background .22s ease}
.nav button:active{transform:scale(var(--press-sm))}
.btn,.tool,.whyc,.iconbtn,.seg button,.kb button,.wt button,.mgchip{transition:transform 120ms var(--ease-out),background 200ms ease,border-color 200ms ease,color 200ms ease,box-shadow 200ms ease}
.card{transition:border-color .22s ease,box-shadow .22s ease}
.daybtn,.pcard,.histrow{transition:background 180ms ease,transform 120ms var(--ease-out)}
/* A .daybtn a kártyán BELÜL ül, ezért a KÁRTYÁT húzzuk össze – különben a
   tartalom zsugorodna egy álló kereten belül. :has nélkül csak a
   háttérváltás marad (graceful degradation). */
.card{transform-origin:center}
.card:has(.daybtn:active){transform:scale(var(--press-lg))}
.pcard:active{transform:scale(var(--press-lg))}
.rp-fg{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--brass),transparent 55%))}
.mr-fg{transition:stroke-dashoffset 380ms var(--ease-out)}
.mgfill{transition:transform 420ms var(--ease-out)}
#app{view-transition-name:appview}
/* Húzható alsó lap: az ujjal-követő eltolás alatt az anim-belépőt kikapcsoljuk */
.sheet .inner{touch-action:pan-y}
.sheet.drag .inner{animation:none;transition:none}
.sheet.snap .inner{transition:transform .2s cubic-bezier(.2,.7,.3,1)}
</style>
