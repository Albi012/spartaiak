// Egy szett-tömb rögzített (nem null) ismétléseinek összege.
function repSum(sets){ return (sets||[]).reduce((a,x)=>a+(x!=null?x:0),0); }
// Egy edzés–gyakorlat "térfogata" kg-ban: súly × összes ismétlés. Testsúlyos
// (w<=0) gyakorlatnál kg-ban 0 volna, ezért ott az ismétlésszám a mérőszám.
function exVolume(L){ return L.w>0 ? L.w*repSum(L.sets) : 0; }
// A hét (hétfő 00:00) időbélyege – a hetes sorozat számításához.
function weekStart(t){ const d=new Date(t); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); }

// Összegző statisztikák a Haladás fül fejlécéhez.
function progStats(){
  const now=new Date(), ym=now.getFullYear()+'-'+now.getMonth();
  let month=0, tonnage=0;
  S.sessions.forEach(s=>{
    const d=new Date(s.t); if(d.getFullYear()+'-'+d.getMonth()===ym) month++;
    Object.values(s.log).forEach(L=>{ tonnage+=exVolume(L); });
  });
  const weeks=[...new Set(S.sessions.map(s=>weekStart(s.t)))].sort((a,b)=>b-a);
  let streak=0; if(weeks.length){ streak=1; for(let i=1;i<weeks.length;i++){ if(weeks[i-1]-weeks[i]===7*864e5) streak++; else break; } }
  return { total:S.sessions.length, month, streak, tonnage };
}
// Össztömeg emberi alakja: 1 t felett tonnában, egyébként kg-ban.
function fmtTon(kg){ return kg>=1000 ? (kg/1000).toFixed(kg>=10000?0:1)+' t' : Math.round(kg)+' kg'; }

// -- Szint / XP (streak-fókusz) ---------------------------------------
// Az XP-t a naplóból származtatjuk (nincs elmentett számláló). A fő hajtóerő
// a rendszeresség: hány aktív hét volt összesen, a valaha volt leghosszabb és
// a jelenlegi hetes sorozat; kis alap edzésenként. A szintgörbe egyre lassul.
function levelInfo(sessions){
  sessions = sessions || S.sessions || [];
  const weeks = [...new Set(sessions.map(s=>weekStart(s.t)))].sort((a,b)=>a-b);
  let best=0, run=0, prev=null;
  weeks.forEach(w=>{ run = (prev!=null && w-prev===7*864e5) ? run+1 : 1; prev=w; if(run>best) best=run; });
  const desc=[...weeks].sort((a,b)=>b-a); let cur=0;
  if(desc.length){ cur=1; for(let i=1;i<desc.length;i++){ if(desc[i-1]-desc[i]===7*864e5) cur++; else break; } }
  const xp = weeks.length*30 + best*60 + cur*60 + sessions.length*5;
  let level=1, need=100, into=xp;
  while(into>=need){ into-=need; level++; need=Math.round(need*1.25); }
  return { level, xp, into, need, pct:Math.round(into/need*100), cur, best, weeksActive:weeks.length };
}
// Rang-cím szint szerint (íz, streak-témában).
function levelTitle(lvl){
  const T=['Újonc','Rendszeres','Kitartó','Elszánt','Acélos','Veterán','Legenda'];
  return T[Math.min(T.length-1, Math.floor((lvl-1)/3))];
}
function levelCard(){
  const L=levelInfo();
  return `<div class="card" style="border-color:var(--brass)"><div class="pad">
    <div class="row" style="align-items:center">
      <div class="grow"><span class="eyebrow" style="color:var(--brass)">Szint · ${esc(levelTitle(L.level))}</span>
        <div class="small mut" style="margin-top:2px">Jelenlegi sorozat: ${L.cur} hét · csúcs ${L.best} · ${L.weeksActive} aktív hét</div></div>
      <span class="num" style="font-size:40px;font-weight:700;color:var(--brass);line-height:1">${L.level}</span></div>
    <div class="mgtrack" style="margin-top:12px"><span class="mgfill" style="width:${L.pct}%;background:var(--brass)"></span></div>
    <div class="small dim" style="margin-top:6px;text-align:right">${L.into} / ${L.need} XP a következő szintig</div>
  </div></div>`;
}

// Becsült 1RM egy szettből (Epley: w·(1+r/30)). 1 ismétlés = maga a mérés.
// 12 ismétlés felett nem becslünk – ott a képletek szétnyílnak, a szám
// fantázia lenne. (Standard, közkincs képlet – nem az openGym kódja.)
function est1RM(w,r){ w=+w; r=Math.round(+r);
  if(!(w>0)||!(r>=1)||r>12) return null;
  if(r===1) return Math.round(w*10)/10;   // 1 ismétlés = maga a mérés, nem becslés
  return Math.round(w*(1+r/30)*10)/10; }
// Egy gyakorlat valaha volt legjobb becsült 1RM-je. A szetten belül a súly
// azonos, így a legtöbb ismétlésű (de max 12) szett adja a legjobb becslést.
function best1RM(id){
  let best=null;
  S.sessions.forEach(s=>{ const L=s.log[id]; if(!L||!(L.w>0)) return;
    const reps=(L.sets||[]).filter(x=>x!=null&&x<=12); if(!reps.length) return;
    const r=Math.max(...reps), e=est1RM(L.w,r);
    if(e!=null&&(!best||e>best.est)) best={est:e,w:L.w,r,t:s.t}; });
  return best;
}
// Edzésnaptár-hőtérkép: az utolsó N hét napjai, naponta a rögzített
// szettek számával (0 = pihenőnap). Hétfővel kezdődő oszlopok.
function trainingHeatmap(weeks){
  const perDay={};
  S.sessions.forEach(s=>{ const d=new Date(s.t); d.setHours(0,0,0,0);
    let n=0; Object.values(s.log||{}).forEach(L=>{ n+=(L.sets||[]).filter(x=>x!=null).length; });
    perDay[d.getTime()]=(perDay[d.getTime()]||0)+n; });
  const start=weekStart(Date.now())-(weeks-1)*7*864e5, cols=[], today=Date.now();
  for(let w=0;w<weeks;w++){ const col=[];
    for(let dI=0;dI<7;dI++){ const t=start+w*7*864e5+dI*864e5;
      col.push({t,sets:perDay[t]||0,future:t>today}); }
    cols.push(col); }
  return cols;
}

// Az aktuális hét (hétfőtől) munkaszettjei izomcsoportonként. Egy
// "munkaszett" = egy rögzített (nem null) szett; a gyakorlat `mg` mezője
// dönti el, melyik izomcsoporthoz számít. Ez az edzésminőség jó proxyja
// (a hipertrófiához nagyjából 10+ munkaszett/izom/hét az irányadó).
function weekVolume(){
  const wk=weekStart(Date.now()), acc={};
  S.sessions.forEach(s=>{
    if(weekStart(s.t)!==wk) return;
    Object.keys(s.log||{}).forEach(id=>{
      const filled=(s.log[id].sets||[]).filter(x=>x!=null).length;
      if(!filled) return;
      const mg=exDef(id).mg||'egyéb';
      acc[mg]=(acc[mg]||0)+filled;
    });
  });
  return Object.keys(acc).map(mg=>({mg,sets:acc[mg]})).sort((a,b)=>b.sets-a.sets);
}

// Havi edzésszám az utolsó n hónapra (időrendben, a jelenlegi hónap az utolsó).
const HU_MON=['jan','feb','márc','ápr','máj','jún','júl','aug','szep','okt','nov','dec'];
function monthlyCounts(n){
  const now=new Date(), out=[], idx={};
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    idx[d.getFullYear()+'-'+d.getMonth()]=out.length;
    out.push({label:HU_MON[d.getMonth()], count:0}); }
  S.sessions.forEach(s=>{ const d=new Date(s.t), k=d.getFullYear()+'-'+d.getMonth();
    if(idx[k]!=null) out[idx[k]].count++; });
  return out;
}
// Legtöbbet fejlődő gyakorlatok: az első és a legutóbbi rögzített munkasúly
// különbsége (csak súlyos gyakorlat, legalább 2 alkalom, pozitív növekmény).
function mostImproved(k){
  const map={};
  S.sessions.slice().sort((a,b)=>a.t-b.t).forEach(s=>{
    Object.keys(s.log||{}).forEach(id=>{ const L=s.log[id];
      if(!L||!(L.w>0)||!(L.sets||[]).some(x=>x!=null)) return;
      if(exDef(id).bw) return;
      if(!map[id]) map[id]={first:L.w, last:L.w, n:1};
      else { map[id].last=L.w; map[id].n++; } });
  });
  return Object.keys(map).map(id=>({n:exDef(id).n,
      gain:Math.round((map[id].last-map[id].first)*10)/10, times:map[id].n}))
    .filter(x=>x.gain>0 && x.times>=2).sort((a,b)=>b.gain-a.gain).slice(0,k);
}
// Terv-kontra-valóság eltérés-okok összesítése a teljes naplóból.
function whyBreakdown(){
  const c={busy:0,heavy:0,time:0};
  S.sessions.forEach(s=>Object.values(s.log||{}).forEach(L=>{ if(L&&L.why&&c[L.why]!=null) c[L.why]++; }));
  c.total=c.busy+c.heavy+c.time; return c;
}

// A grafikonhoz: pontsor → SVG útvonal (viewBox szélesség×magasság, felső/alsó margó).
function sparkPath(pts,W,H,pad){
  const mn=Math.min(...pts), mx=Math.max(...pts), rng=(mx-mn)||1;
  return pts.map((p,i)=>{ const x=pts.length>1? i/(pts.length-1)*W : W/2;
    const y=(H-pad)-((p-mn)/rng)*(H-2*pad); return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }).join(' ');
}

/* ---- Napi testsúly-napló (edzés nélküli napon is) -------------------
   Additív mező: S.bw = { 'YYYY-MM-DD': kg }. Az edzésadatot/startW-t NEM
   érinti; a felhő-szinkron per-kulcs unióban viszi (auth.js 'bw'). */
const BW_SCALE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 7.5v3M14.1 8.4 12 10.5"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>';
function bwKey(t){ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function bwNum(k){ return (Math.round(k*10)/10).toFixed(1).replace('.',','); }
function bwEntries(){ const b=S.bw||{}; return Object.keys(b).filter(k=>b[k]>0).sort().map(k=>({d:k,kg:b[k]})); }
function bwLast(){ const e=bwEntries(); return e.length?e[e.length-1]:null; }
function bwToday(){ const v=(S.bw||{})[bwKey(Date.now())]; return v>0?v:null; }
function bwFmtDate(k){ const p=k.split('-'); return p[0]+'.'+p[1]+'.'+p[2]; }
function bwDaysAgo(k){ const p=k.split('-').map(Number); const then=new Date(p[0],p[1]-1,p[2]).getTime();
  const days=Math.floor((Date.now()-then)/864e5); return days<=0?'ma':days===1?'tegnap':days+' napja'; }

// Mini trend-vonal a főoldali kártyán (utolsó ~14 nap).
function bwMiniSpark(){ const e=bwEntries(); if(e.length<2) return '';
  const pts=e.slice(-14).map(x=>x.kg), W=88, H=34;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="flex:none;color:var(--brass)" aria-hidden="true"><path d="${sparkPath(pts,W,H,5)}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

// Főoldali kártya – MINDEN nap látszik (edzés nélkül is).
function bwHomeCard(){
  const today=bwToday(), e=bwEntries(), last=bwLast();
  let mid;
  if(today!=null){
    const prev = e.length>1 ? e[e.length-2] : null;
    const delta = prev ? Math.round((today-prev.kg)*10)/10 : null;
    const dtxt = delta==null ? 'ma rögzítve'
      : (delta>0?'▲ +'+bwNum(delta):delta<0?'▼ −'+bwNum(-delta):'▬ 0')+' kg az előzőhöz';
    mid = `<span class="cond" style="font-size:21px;font-weight:600;display:block">${bwNum(today)} kg <span class="small dim" style="font-weight:400">ma</span></span>
      <span class="small dim">${dtxt}</span>`;
  } else if(last){
    mid = `<span class="cond" style="font-size:21px;font-weight:600;display:block">Testsúly</span>
      <span class="small dim">utoljára ${bwDaysAgo(last.d)}: ${bwNum(last.kg)} kg · koppints a rögzítéshez</span>`;
  } else {
    mid = `<span class="cond" style="font-size:21px;font-weight:600;display:block">Napi testsúly</span>
      <span class="small dim">Rögzítsd ma – edzés nélküli napon is</span>`;
  }
  return `<div class="card"><button class="daybtn" onclick="openBwSheet()">
    <span class="daytag" style="color:var(--brass)">${BW_SCALE}</span>
    <span class="grow">${mid}</span>
    ${bwMiniSpark()}
    <span style="color:var(--brass);font-size:22px">›</span></button></div>`;
}

// Trend-grafikon a lapon (utolsó ~30 nap) + min/max/most összegző.
function bwChart(){ const e=bwEntries(); if(e.length<2) return '';
  const arr=e.slice(-30), pts=arr.map(x=>x.kg), W=300, H=96, pad=10;
  const mn=Math.min(...pts), mx=Math.max(...pts), cur=pts[pts.length-1];
  const lastX=W, lastY=(H-pad)-((cur-mn)/((mx-mn)||1))*(H-2*pad);
  return `<div style="margin-top:14px">
    <svg class="chartbig" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${sparkPath(pts,W,H,pad)}" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="var(--brass)"/>
    </svg>
    <div class="small dim" style="display:flex;justify-content:space-between;margin-top:2px">
      <span>min ${bwNum(mn)}</span><span>${arr.length} nap</span><span>max ${bwNum(mx)}</span></div>
  </div>`;
}

/* ---- Alvás-napló (edzés nélküli napon is) ---------------------------
   Additív mező: S.sleep = { 'YYYY-MM-DD': {min, q} } – perc + minőség(1..5).
   Az edzésadatot NEM érinti; a felhő-szinkron per-kulcs unióban viszi
   (auth.js 'sleep'). A natív Health-behúzást a js/health.js adja, ha a
   Capacitor-híd elérhető; web-en kézi bevitel a fallback. */
const BW_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
function slpEntries(){ const b=S.sleep||{}; return Object.keys(b).filter(k=>b[k]&&b[k].min>0).sort().map(k=>({d:k,min:b[k].min,q:b[k].q||0})); }
function slpLast(){ const e=slpEntries(); return e.length?e[e.length-1]:null; }
function slpToday(){ const v=(S.sleep||{})[bwKey(Date.now())]; return v&&v.min>0?v:null; }
function slpFmt(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return h+'ó'+(m?' '+m+'p':''); }
function slpQLabel(q){ return ['','gyenge','közepes','oké','jó','kiváló'][q]||''; }

function slpMiniSpark(){ const e=slpEntries(); if(e.length<2) return '';
  const pts=e.slice(-14).map(x=>x.min), W=88, H=34;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="flex:none;color:var(--brass)" aria-hidden="true"><path d="${sparkPath(pts,W,H,5)}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

// Minőség-pöttyök (kitöltött/üres, monokróm – téma-követő).
function slpDots(q){ let s='<span style="display:inline-flex;gap:3px;vertical-align:middle">';
  for(let i=1;i<=5;i++) s+=`<i style="width:7px;height:7px;border-radius:50%;background:${i<=q?'var(--brass)':'var(--line)'}"></i>`;
  return s+'</span>'; }

function slpChart(){ const e=slpEntries(); if(e.length<2) return '';
  const arr=e.slice(-30), pts=arr.map(x=>x.min), W=300, H=96, pad=10;
  const mn=Math.min(...pts), mx=Math.max(...pts), cur=pts[pts.length-1];
  const lastY=(H-pad)-((cur-mn)/((mx-mn)||1))*(H-2*pad);
  const avg=Math.round(pts.reduce((a,b)=>a+b,0)/pts.length);
  return `<div style="margin-top:14px">
    <svg class="chartbig" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${sparkPath(pts,W,H,pad)}" fill="none" stroke="var(--brass)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${W}" cy="${lastY.toFixed(1)}" r="3" fill="var(--brass)"/>
    </svg>
    <div class="small dim" style="display:flex;justify-content:space-between;margin-top:2px">
      <span>min ${slpFmt(mn)}</span><span>átlag ${slpFmt(avg)}</span><span>max ${slpFmt(mx)}</span></div>
  </div>`;
}

let slpDraft=0, slpQ=0, slpDate='';
function openSleepSheet(dateKey){ slpDate=dateKey||bwKey(Date.now());
  const cur=(S.sleep||{})[slpDate];
  slpDraft = cur&&cur.min>0 ? cur.min : (slpLast()?slpLast().min:450);
  slpQ = cur?cur.q||0 : 0;
  renderSleepSheet(); document.getElementById('sheet').classList.add('on'); }
function slpStep(d){ slpDraft=Math.max(0,Math.min(1080,slpDraft+d)); renderSleepSheet(); }
function slpSetQ(q){ slpQ = slpQ===q?0:q; renderSleepSheet(); }
async function slpSync(){
  if(!(window.Health && Health.available())) return;
  const btn=document.getElementById('slpSyncBtn'); if(btn){ btn.disabled=true; btn.textContent='Behúzás…'; }
  try{ const r=await Health.syncSleep();
    if(r && r.ok && r.min>0){ slpDate=r.day||slpDate; slpDraft=r.min; if(r.q) slpQ=r.q; renderSleepSheet(); }
    else uiAlert('Nem érkezett alvásadat az elmúlt éjszakára.');
  }catch(e){ uiAlert('Az alvás behúzása nem sikerült.'); }
}
function slpSave(){ if(!S.sleep)S.sleep={};
  if(slpDraft>0) S.sleep[slpDate]={min:slpDraft, q:slpQ||0};
  if(navigator.vibrate) navigator.vibrate(12); save(); closeSheet(); render(); }

// Egy edzés–gyakorlat metrikája a részletlap görbéjéhez. 'w' = munkasúly;
// 'vol' = térfogat (súly×ismétlés; testsúlyosnál az összes ismétlés).
// Egy edzés legjobb becsült 1RM-je (a szetten belül a súly azonos, így a
// legtöbb ismétlésű, de max 12-es szett adja). null, ha nem becsülhető.
function sess1RM(L){ if(!L||!(L.w>0)) return null;
  const reps=(L.sets||[]).filter(x=>x!=null&&x<=12); if(!reps.length) return null;
  return est1RM(L.w, Math.max(...reps)); }
function progMetric(L, metric){
  if(metric==='vol') return L.w>0 ? L.w*repSum(L.sets) : repSum(L.sets);
  if(metric==='1rm') return sess1RM(L);
  return L.w;
}
// Részletes lap egy gyakorlathoz: nagy grafikon (súly/térfogat) + előzmény.
function openProgDetail(id, metric){
  metric = (metric==='vol'||metric==='1rm') ? metric : 'w';
  const e=exDef(id);
  if(metric==='1rm' && e.bw) metric='w';                  // testsúlyosnál nincs 1RM
  const rows=S.sessions.filter(s=>s.log[id]&&s.log[id].sets.some(x=>x!=null))
    .map(s=>({ t:s.t, L:s.log[id] })).sort((a,b)=>a.t-b.t);
  // A grafikonhoz csak azok az edzések, amelyekhez van érték az adott
  // metrikában (1RM: nem minden edzés becsülhető).
  const chartRows=rows.filter(r=>progMetric(r.L,metric)!=null);
  const pts=chartRows.map(r=>progMetric(r.L,metric));
  const volUnit = e.bw ? ' ism' : ' kg';
  const pr=Math.max(...rows.map(r=>r.L.w));               // a súly-csúcs
  const mn=pts.length?Math.min(...pts):0, rng=(pts.length?Math.max(...pts):0)-mn||1;
  const yOf=p=>(120-10)-((p-mn)/rng)*(120-20);
  const d=chartRows.map((r,i)=>{ const x=chartRows.length>1?i/(chartRows.length-1)*100:50; return (i?'L':'M')+x.toFixed(1)+' '+yOf(pts[i]).toFixed(1); }).join(' ');
  const area=pts.length>1 ? `M0 120 `+chartRows.map((r,i)=>'L'+(i/(chartRows.length-1)*100).toFixed(1)+' '+yOf(pts[i]).toFixed(1)).join(' ')+` L100 120 Z` : '';
  const seg=(k,lbl)=>`<button class="${metric===k?'on':''}" onclick="openProgDetail('${id}','${k}')">${lbl}</button>`;
  let h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">Haladás</span>
      <h2 style="font-size:22px">${esc(e.n)}</h2>
      <span class="small dim">Csúcs ${wLabel(e,pr)}${e.bw&&pr<=0?'':' kg'} · ${rows.length} alkalom</span>${(()=>{const b=best1RM(id);return b?`<br><span class="small" style="color:var(--brass)">Becsült 1RM ~${b.est} kg <span class="dim">(${b.w}×${b.r})</span></span>`:'';})()}</div>
      <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <div class="seg">${seg('w','Súly')}${seg('vol','Térfogat')}${e.bw?'':seg('1rm','1RM')}</div>
    <a class="small" href="${videoUrl(e)}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:6px;color:var(--brass);text-decoration:none;margin:8px 2px 0">${ICON.video} Technika videó ›</a>`;
  if(pts.length>1){
    h+=`<svg class="chartbig" viewBox="0 0 100 120" preserveAspectRatio="none">
      <path d="${area}" fill="var(--brass-d)" opacity=".55"/>
      <path d="${d}" fill="none" stroke="var(--brass)" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      ${chartRows.map((r,i)=>`<circle cx="${(chartRows.length>1?i/(chartRows.length-1)*100:50).toFixed(1)}" cy="${yOf(pts[i]).toFixed(1)}" r="1.9" fill="var(--brass)" vector-effect="non-scaling-stroke"/>`).join('')}
    </svg>`;
  } else if(metric==='1rm'){
    h+=`<div class="empty" style="padding:20px 0">Nincs elég becsülhető edzés (12 ismétlésig).</div>`;
  }
  const volMax=Math.max(...rows.map(r=>progMetric(r.L,'vol')));
  const rmMax=Math.max(...rows.map(r=>sess1RM(r.L)||0));
  h+=`<div style="margin-top:6px">`;
  rows.slice().reverse().forEach(r=>{
    const reps=(r.L.sets||[]).filter(x=>x!=null);
    let main, isPr=false;
    if(metric==='vol'){ const v=progMetric(r.L,'vol'); main=v+volUnit; isPr=v===volMax && v>0; }
    else if(metric==='1rm'){ const v=sess1RM(r.L); main=v!=null?('~'+v+' kg'):'<span class="dim">—</span>'; isPr=v!=null && v===rmMax && v>0; }
    else { main=wLabel(e,r.L.w)+(e.bw&&r.L.w<=0?'':' kg'); isPr=r.L.w===pr && pr>0; }
    h+=`<div class="histrow">
      <span class="d">${fmtDate(r.t)}</span>
      <span class="w">${main}${isPr?' <span class="small" style="color:var(--brass);font-weight:600">CSÚCS</span>':''}</span>
      <span class="r">${reps.length?reps.join(' · '):'—'}</span>
    </div>`;
  });
  h+=`</div>`;
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
}

/* ---- Tárcsa-kalkulátor -------------------------------------------- */
// Egy rúdra oldalanként kirakandó tárcsák egy cél-súlyhoz. Standard
// kg-os tárcsakészlet, mohó algoritmus. (Saját, egyszerű implementáció.)
let plateBar=20;
// Oldalankénti tárcsakiosztás egy cél-súlyhoz. Visszaad: perSide (kg),
// used (tárcsák listája), rem (ami nem rakható ki), belowBar (rúd alatt).
function platesPerSide(target, bar){
  const perSide=Math.round((target-bar)/2*100)/100;
  if(perSide<0) return {perSide, used:[], rem:0, belowBar:true};
  const PLATES=[25,20,15,10,5,2.5,1.25]; let rem=perSide; const used=[];
  PLATES.forEach(p=>{ while(rem>=p-1e-9){ used.push(p); rem=Math.round((rem-p)*100)/100; } });
  return {perSide, used, rem, belowBar:false};
}
function openPlateCalc(preW){
  const w=preW>0?preW:60;
  let h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">Tárcsa-kalkulátor</span>
      <h2 style="font-size:22px">Mennyi tárcsa oldalanként?</h2></div>
      <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <label class="small dim">Cél súly (kg)</label>
    <input id="plW" type="number" inputmode="decimal" step="1.25" value="${w}" oninput="renderPlateRes()" style="width:100%;margin:6px 0 12px;font-size:24px">
    <div class="seg" id="plBar">${[20,15,10].map(b=>`<button class="${plateBar===b?'on':''}" onclick="setPlateBar(${b})">${b} kg rúd</button>`).join('')}</div>
    <div id="plRes"></div>`;
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
  renderPlateRes();
}
function setPlateBar(b){ plateBar=b;
  document.querySelectorAll('#plBar button').forEach(btn=>btn.classList.toggle('on',btn.textContent.indexOf(b+' ')===0));
  renderPlateRes(); }
function renderPlateRes(){
  const el=document.getElementById('plRes'); if(!el) return;
  const target=parseFloat(document.getElementById('plW').value)||0;
  const r=platesPerSide(target, plateBar);
  if(r.belowBar){ el.innerHTML=`<div class="platesum">A cél kisebb a rúdnál (${plateBar} kg).</div>`; return; }
  if(r.perSide===0){ el.innerHTML=`<div class="platesum">Csak a rúd – nincs tárcsa.</div>`; return; }
  const bars=r.used.map(p=>`<span class="plate" style="height:${Math.round(28+p)}px">${p}</span>`).join('');
  let sum=`Oldalanként ${r.perSide%1===0?r.perSide:r.perSide.toFixed(2)} kg · ${r.used.length} tárcsa`;
  if(r.rem>0.01) sum+=` · ${r.rem} kg így nem rakható ki`;
  el.innerHTML=`<div class="plateres">${bars||'<span class="dim">–</span>'}</div><div class="platesum">${sum}</div>`;
}

/* ---- Bemelegítő-szettek ------------------------------------------- */
// A munkasúlyból származtatott bemelegítő lépcsők (a working set ELŐTT).
// Százalékos ráépülés, 2,5 kg-ra kerekítve, a rúdnál (üres) nem kevesebb;
// duplikátumok kiszűrve. Testsúlyos gyakorlatnál nincs értelme.
function warmupSets(W, bar){
  bar = bar>0 ? bar : 20;
  if(!(W>bar)) return [];                       // a rúd körül nincs mit építeni
  const R=w=>Math.round(w/2.5)*2.5;
  const plan=[[0.4,10],[0.55,5],[0.7,3],[0.85,2]];
  const out=[]; let prev=0;
  plan.forEach(([p,reps])=>{ let w=Math.max(bar, R(W*p));
    if(w>=W) return;                            // ne érje el a munkasúlyt
    if(w===prev) return;                        // ne ismételjen
    out.push({w, reps}); prev=w; });
  return out;
}
function openWarmup(exId){
  const e=exDef(exId), L=S.active&&S.active.log[exId];
  const W=L?L.w:startW(exId);
  const steps=warmupSets(W, plateBar);
  let h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">Bemelegítés</span>
      <h2 style="font-size:22px">${esc(e.n)}</h2>
      <span class="small dim">Munkasúly: ${W} kg · ${plateBar} kg rúd</span></div>
      <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>`;
  if(!steps.length){
    h+=`<div class="empty" style="padding:18px 0">Ehhez a súlyhoz nincs szükség külön bemelegítő lépcsőre – pár lazább ismétlés a rúddal elég.</div>`;
  } else {
    h+=`<div style="margin-top:8px">`;
    steps.forEach((s,i)=>{ const pr=platesPerSide(s.w, plateBar);
      const side = pr.belowBar||pr.perSide===0 ? 'csak rúd'
        : ('oldalanként: '+pr.used.map(p=>p%1===0?p:p.toFixed(2)).join(' + ')+(pr.rem>0.01?` (+${pr.rem} marad)`:''));
      h+=`<div class="wrow">
        <span class="wrow-n">${i+1}</span>
        <span class="grow"><span class="num" style="font-size:22px;font-weight:700">${s.w}<span class="small dim" style="font-weight:400"> kg</span></span>
          <span class="small dim"> × ${s.reps}</span><div class="small mut" style="margin-top:2px">${side}</div></span>
      </div>`; });
    h+=`<div class="wrow" style="border:0"><span class="wrow-n" style="background:var(--brass);color:var(--on-brass)">✓</span>
      <span class="grow"><span class="num" style="font-size:22px;font-weight:700;color:var(--brass)">${W}<span class="small dim" style="font-weight:400"> kg</span></span>
        <span class="small dim"> · munkasúly</span></span></div>`;
    h+=`</div><p class="small dim" style="margin-top:8px">Tipp: a bemelegítő szetteket nem kell naplózni – csak a munkaszetteket rögzítsd.</p>`;
  }
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
}

function saveNote(kind,id){
  const v=document.getElementById('noteTa').value.trim();
  if(kind==='ex'){ if(v) S.notes[id]=v; else delete S.notes[id]; }
  else if(S.active){ if(v) S.active.note=v; else delete S.active.note; }
  closeSheet(); save(); render();
}
function addPhoto(id,file){
  if(!file) return;
  const ta=document.getElementById('noteTa'); const keep=ta?ta.value:'';   // ne vesszen el a beírt jegyzet
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{
    const max=800, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let data; try{ data=c.toDataURL('image/jpeg',0.6); }catch(e){ uiAlert('A kép feldolgozása nem sikerült.'); return; }
    S.photos[id]=data; save();
    if(storeMode==='none'){ delete S.photos[id]; uiAlert('A kép nem fért el a tárolóban – törölj néhány fotót.'); }
    openNoteSheet('ex',id);
    const ta2=document.getElementById('noteTa'); if(ta2&&keep) ta2.value=keep;
  }; img.src=rd.result; };
  rd.readAsDataURL(file);
}
function removePhoto(id){ const ta=document.getElementById('noteTa'); const keep=ta?ta.value:'';
  delete S.photos[id]; save(); openNoteSheet('ex',id);
  const ta2=document.getElementById('noteTa'); if(ta2&&keep) ta2.value=keep; }

    .map(id=>({n:exDef(id).n, w:S.weights[id]})).sort((a,b)=>b.w-a.w).slice(0,6);

    <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>`;
  document.getElementById('sheetIn').innerHTML=head(name)+`<div class="empty" style="padding:16px 0">Betöltés…</div>`;
  document.getElementById('sheet').classList.add('on');
  let st=null; try{ st=await Auth.friendStats(id); }catch(e){}
  let h=head((st&&st.display_name)||name);
  if(!st||!st.data||!st.data.sessions){ h+=`<div class="empty" style="padding:16px 0">Ez a barát még nem osztott meg adatot.</div>`; }
  else{ const d=st.data;
    h+=`<div class="card"><div class="pad row">
      <div class="grow"><div class="num" style="font-size:30px;font-weight:700">${d.sessions||0}</div><div class="small dim">edzés</div></div>
      <div class="grow"><div class="num" style="font-size:30px;font-weight:700">${d.week||0}</div><div class="small dim">7 napban</div></div>
      ${d.last?`<div class="grow small dim" style="align-self:center">Utolsó:<br>${fmtDate(d.last)}</div>`:''}</div></div>`;
    if(d.lifts&&d.lifts.length){ h+=`<div class="top" style="padding:12px 0 6px"><span class="eyebrow">Legnagyobb súlyok</span></div><div class="card">`;
      d.lifts.forEach(l=>{ h+=`<div class="hrow"><span class="small grow">${esc(l.n)}</span><span class="small num mut">${l.w} kg</span></div>`; });
      h+=`</div>`; }
  }
  document.getElementById('sheetIn').innerHTML=h;
}

/* ---- Edzésterv megosztása / importálása ---------------------------- */
// A megosztott terv önálló csomag: a program + a benne lévő SAJÁT edzések
// + a hivatkozott SAJÁT gyakorlatok defjei. A beépítettek a fogadónál oldódnak fel.
function buildPlanPayload(programId){
  const p=progById(programId); if(!p) return null;
  const routines={}, customEx={};
  p.days.forEach(dId=>{ const r=(S.routines||[]).find(x=>x.id===dId);
    if(r){ routines[r.id]=JSON.parse(JSON.stringify(r));
      (r.ex||[]).forEach(exId=>{ if(S.customEx&&S.customEx[exId]) customEx[exId]=JSON.parse(JSON.stringify(S.customEx[exId])); }); } });
  return { program:{name:p.name, days:p.days.slice()}, routines, customEx };
}
function importPlan(payload){
  if(!payload||!payload.program) return;
  const exMap={};
  Object.values(payload.customEx||{}).forEach(e=>{ const nid=uid('cx_'); exMap[e.id]=nid; S.customEx[nid]={...e, id:nid}; });
  const dayMap={};
  Object.values(payload.routines||{}).forEach(r=>{ const nid=uid('r_'); dayMap[r.id]=nid;
    const ex=(r.ex||[]).map(x=> exMap[x]||x );
    S.routines.push({ id:nid, name:r.name, sub:ex.length+' gyakorlat', ex }); });
  const days=(payload.program.days||[]).map(d=> dayMap[d]||d );
  S.programs.push({ id:uid('p_'), name:payload.program.name||'Megosztott terv', days });
  save();
}
async function openSharePlan(programId){
  if(!(window.Auth&&Auth.isLoggedIn())){ uiAlert('A megosztáshoz lépj be a fiókodba (Barátok fül).'); return; }
  if(!friendsData) await refreshFriends();
  const me=Auth.currentUser().id;
  const acc=(friendsData||[]).filter(r=>r.status==='accepted');
  let h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">Edzésterv megosztása</span><h2 style="font-size:22px">Melyik baráttal?</h2></div>
    <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>`;
  if(!acc.length){ h+=`<div class="empty" style="padding:16px 0">Előbb vegyél fel barátot a Barátok fülön.</div>`; }
  else acc.forEach(r=>{ const id=r.requester===me?r.addressee:r.requester; const nm=r.requester===me?(r.addressee_name||'Barát'):(r.requester_name||'Barát');
    h+=`<button class="btn" style="margin-bottom:8px" onclick="doSharePlan('${programId}','${id}','${esc(nm)}')">${esc(nm)}</button>`; });
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
}
async function doSharePlan(programId, toId, toName){
  const payload=buildPlanPayload(programId); const p=progById(programId);
  if(!payload){ uiAlert('Előbb mentsd el a tervet.'); return; }
  let ok=false; try{ ok=await Auth.sharePlan(toId, p.name, payload); }catch(e){}
  closeSheet(); uiAlert(ok? ('Elküldve neki: '+toName) : 'Nem sikerült elküldeni.');
}
async function doImportPlan(shareId){
  const sp=(sharedPlansData||[]).find(x=>x.id===shareId); if(!sp) return;
  importPlan(sp.payload);
  try{ await Auth.deleteSharedPlan(shareId); }catch(e){}
  refreshFriends(); uiAlert('Terv importálva – megtalálod a főoldaladon.');
}
async function doDiscardPlan(shareId){ try{ await Auth.deleteSharedPlan(shareId); }catch(e){} refreshFriends(); }

/* ---- Onboarding (első indítás bemutató) --------------------------- *

  h+=row(ICON.list,'Napló','Minden edzés visszanézhető; heti összefoglaló küldhető egy AI-edzőnek.');

/* ---- Téma (világos / sötét) ---------------------------------------- */
function currentTheme(){ try{ return localStorage.getItem('gymlog_theme')||'auto'; }catch(e){ return 'auto'; } }
function effectiveDark(){ const t=currentTheme();
  if(t==='dark') return true; if(t==='light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(){
  const t=currentTheme(), root=document.documentElement;
  if(t==='auto') delete root.dataset.theme; else root.dataset.theme=t;
  const dark=effectiveDark();
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=dark?'#0F1317':'#F4F2EC';
  const b=document.getElementById('themeBtn'); if(b) b.innerHTML=dark?ICON.moon:ICON.sun;
}
function paintIcons(){
  const set=(sel,svg)=>{ const el=document.querySelector(sel); if(el) el.innerHTML=svg; };
  set('#accountBtn', ICON.account);
  set('#injuryBtn', ICON.injury);
  set('#physioBtn', ICON.physio);
  const navIcon={home:ICON.dumbbell, plans:ICON.plans, log:ICON.list, prog:ICON.chart, friends:ICON.friends};
  document.querySelectorAll('.nav button').forEach(btn=>{ const ic=btn.querySelector('.ic'); if(ic)
    ic.innerHTML = navIcon[btn.dataset.tab] || ICON.chart; });
}
function toggleTheme(){
  try{ localStorage.setItem('gymlog_theme', effectiveDark()?'light':'dark'); }catch(e){}
  applyTheme();
}
document.getElementById('themeBtn').onclick=toggleTheme;
if(window.matchMedia){ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(currentTheme()==='auto') applyTheme(); }); }
applyTheme();

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0);
  if(tab==='friends') refreshFriends();});
document.getElementById('sheet').onclick=e=>{ if(e.target.id==='sheet') closeSheet(); };
document.getElementById('modal').onclick=e=>{ if(e.target.id==='modal') _closeModal(false); };

// Húzható alsó lap: felül állva, lefelé húzva bezárható (egykezes záráshoz).
(function(){
  const sheet=document.getElementById('sheet'), inner=document.getElementById('sheetIn');
  let startY=0, dy=0, dragging=false;
  inner.addEventListener('touchstart',e=>{
    if(e.touches.length!==1 || inner.scrollTop>0){ dragging=false; return; }
    startY=e.touches[0].clientY; dy=0; dragging=true; sheet.classList.remove('snap');
  },{passive:true});
  inner.addEventListener('touchmove',e=>{
    if(!dragging) return;
    dy=e.touches[0].clientY-startY;
    if(dy<=0){ if(inner.scrollTop>0){ dragging=false; inner.style.transform=''; sheet.classList.remove('drag'); } return; }
    sheet.classList.add('drag'); inner.style.transform='translateY('+dy+'px)';
  },{passive:true});
  inner.addEventListener('touchend',()=>{
    if(!dragging) return; dragging=false; sheet.classList.remove('drag');
    const h=inner.offsetHeight||400;
    if(dy>Math.min(150, h*0.28)){
      inner.style.transition='transform .2s ease'; inner.style.transform='translateY(110%)';
      setTimeout(()=>{ closeSheet(); inner.style.transition=''; inner.style.transform=''; },180);
    } else {
      sheet.classList.add('snap'); inner.style.transform='';
      setTimeout(()=>sheet.classList.remove('snap'),220);
    }
    dy=0;
  });
})();
paintIcons();
load().then(()=>{ updateInjuryBtn(); maybeOnboard(); });
