<style>
/* ---- Téma tokenek ---------------------------------------------------
   Alap = sötét (teremben ez az alapértelmezett). A rendszer világos
   beállítását követi, ha nincs kézi választás; a kézi váltó a
   [data-theme] attribútummal felülírja. */
:root{
  --bg:#0F1317; --card:#171D24; --card2:#1F2833; --line:#2A343F;
  --ink:#EAF0F5; --mut:#94A2B0; --dim:#6A7885;
  --brass:#E0A93E; --brass-d:#3A2E13; --on-brass:#1A1206;
  --sage:#63C295; --sage-d:#14291E;
  --red:#E9694C; --miss-bg:#3A241E;
  --bar:rgba(15,19,23,.72); --shadow:rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#F4F2EC; --card:#FFFFFF; --card2:#F1EEE6; --line:#E4DFD3;
    --ink:#20262D; --mut:#5C6772; --dim:#95A0AC;
    --brass:#A9740F; --brass-d:#F1E6CB; --on-brass:#211603;
    --sage:#2C9A64; --sage-d:#DDF0E6;
    --red:#C8492C; --miss-bg:#FBE7E0;
    --bar:rgba(244,242,236,.8); --shadow:rgba(40,50,60,.14);
  }
}
:root[data-theme="light"]{
  --bg:#F4F2EC; --card:#FFFFFF; --card2:#F1EEE6; --line:#E4DFD3;
  --ink:#20262D; --mut:#5C6772; --dim:#95A0AC;
  --brass:#A9740F; --brass-d:#F1E6CB; --on-brass:#211603;
  --sage:#2C9A64; --sage-d:#DDF0E6;
  --red:#C8492C; --miss-bg:#FBE7E0;
  --bar:rgba(244,242,236,.8); --shadow:rgba(40,50,60,.14);
}
:root[data-theme="dark"]{
  --bg:#0F1317; --card:#171D24; --card2:#1F2833; --line:#2A343F;
  --ink:#EAF0F5; --mut:#94A2B0; --dim:#6A7885;
  --brass:#E0A93E; --brass-d:#3A2E13; --on-brass:#1A1206;
  --sage:#63C295; --sage-d:#14291E;
  --red:#E9694C; --miss-bg:#3A241E;
  --bar:rgba(15,19,23,.72); --shadow:rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:120px;overscroll-behavior-y:contain;transition:background .25s,color .25s}
body.playing{padding-bottom:0}
body.playing .appbar,body.playing .nav{display:none}
.num,.cond{font-family:'Barlow Condensed',Barlow,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.01em;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* Felső sáv (böngésző mód) */
.appbar{position:sticky;top:0;z-index:40;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.appbar-in{max-width:560px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{width:22px;height:22px;color:var(--brass);flex:none}
.brand-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--mut);border:1px solid var(--line);background:var(--card);flex:none}
.iconbtn:active{background:var(--card2);transform:scale(.94)}
.svgic{width:22px;height:22px;display:block}
.iconbtn .svgic{width:20px;height:20px}
.daytag .svgic{width:24px;height:24px}
.nav .ic .svgic{width:22px;height:22px;margin:2px auto 0}

.top{padding:22px 0 10px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
.pad{padding:15px 16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.small{font-size:13px}

/* Napválasztó / folytatás */
.daybtn{width:100%;text-align:left;padding:15px;display:flex;align-items:center;gap:14px}
.daybtn:active{background:var(--card2)}
.daytag{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1;color:var(--brass);
  width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:1px solid var(--line);border-radius:13px}
.pill{display:inline-block;font-size:11px;letter-spacing:.09em;font-weight:700;color:var(--on-brass);
  background:var(--brass);padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}

/* Szett-chipek */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{width:56px;height:56px;border-radius:14px;background:var(--card2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:transform .12s,background .12s}
.chip:active{transform:scale(.93)}
.chip .r{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.chip .l{font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.chip.done{background:var(--sage-d);border-color:var(--sage)}
.chip.done .r{color:var(--sage)}
.chip.done .l{color:var(--sage);opacity:.85}
.chip.miss{background:var(--miss-bg);border-color:var(--red)}
.chip.miss .r{color:var(--red)}

/* Súlyállító */
.wt{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card2)}
.wt button{width:64px;height:64px;font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:600;color:var(--brass)}
.wt button:active{background:var(--brass-d)}
.wt .val{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:40px;font-weight:700;padding:0 4px}
.wt .val span{font-size:16px;color:var(--dim);font-family:Barlow;font-weight:500;margin-left:4px}
.prev{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--brass);font-weight:500}

/* Gombok */
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.btn.pri{background:var(--brass);color:var(--on-brass);border-color:var(--brass)}
.btn.ghost{background:transparent;box-shadow:none}
.btn:active{transform:scale(.99);opacity:.9}
.btn:disabled{opacity:.4}

/* Lebegő alsó navigáció (böngésző mód) */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  width:calc(100% - 24px);max-width:420px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:20px;display:flex;padding:6px;gap:4px;box-shadow:0 10px 30px var(--shadow);z-index:30}
.nav button{flex:1;padding:9px 4px;border-radius:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
.nav button.on{color:var(--brass);background:var(--card2)}
.nav .ic{display:block;font-family:'Barlow Condensed',sans-serif;font-size:20px;margin-bottom:2px}

/* ---- Edzés-lejátszó (immerzív) ------------------------------------- */
.player{min-height:100dvh;display:flex;flex-direction:column}
.ptop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 4px}
.ptop .pmid{flex:1;text-align:center;min-width:0}
.ptop .pmid .d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.ptop .pmid .c{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;color:var(--mut)}
.pdots{display:flex;gap:6px;justify-content:center;padding:8px 14px 2px;flex-wrap:wrap}
.pdot{width:26px;height:7px;border-radius:4px;background:var(--card2);border:1px solid var(--line);padding:0}
.pdot.done{background:var(--sage);border-color:var(--sage)}
.pdot.cur{background:var(--brass);border-color:var(--brass);width:34px}
.pmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;
  padding:12px 18px;max-width:560px;margin:0 auto;width:100%;overflow-y:auto}
.pname{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;line-height:1.08}
.pmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.pchips{display:flex;gap:10px;flex-wrap:wrap}
.pchips .chip{width:64px;height:64px}
.pchips .chip .r{font-size:27px}
.pfoot{display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;width:100%;position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 55%,transparent)}
.pfoot .btn{margin:0}
.discard{display:block;margin:2px auto 0;padding:8px 14px;color:var(--dim);font-size:13px}

/* Pihenő – kör-időzítő overlay */
.rest{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(8,10,13,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rest.on{display:flex}
.rest-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 28px;
  display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 20px 60px var(--shadow);width:min(86vw,330px)}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card2);stroke-width:9}
.ring-fg{fill:none;stroke:var(--brass);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;font-size:52px;font-weight:700}

/* Gyakorlat-fejléc (böngésző nézetekben) */
.exhead{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.exname{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600;line-height:1.15}
.tgt{font-size:14px;color:var(--dim);white-space:nowrap}
.done-badge{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sage);font-weight:700}

/* Napló sorok */
.hrow{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:none}
.spark{width:100%;height:44px;display:block;margin-top:10px}
.empty{text-align:center;padding:44px 20px 28px;color:var(--dim)}

/* Alsó lap (szett-billentyűzet) */
.sheet{position:fixed;inset:0;background:rgba(8,10,13,.6);display:none;align-items:flex-end;z-index:70;backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.sheet .inner{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px var(--shadow)}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.kb button{padding:16px 0;border-radius:13px;background:var(--card2);border:1px solid var(--line);font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.kb button:active{background:var(--brass-d)}
textarea{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:1.4}
textarea:focus{outline:2px solid var(--brass);outline-offset:2px}

/* Gyakorlat-jegyzet + fotó */
.exnote{display:flex;gap:12px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.exnote-t{font-size:14px;color:var(--mut);white-space:pre-wrap;flex:1;min-width:0}
.exphoto{width:64px;height:64px;object-fit:cover;border-radius:11px;border:1px solid var(--line);flex:none}
.exphoto.lg{width:100%;height:auto;max-height:280px;object-fit:contain;background:var(--card2)}

/* Terv kontra valóság / sérülés – választható címkék */
.whyrow{display:flex;flex-wrap:wrap;gap:8px}
.whyc{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:13px;font-weight:600}
.whyc.on{border-color:var(--brass);color:var(--brass);background:var(--brass-d)}

/* Figyelmeztető szalag */
.banner{background:var(--brass-d);border:1px solid var(--brass);color:var(--brass);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:500}

/* Fotónéző */
.photo{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(6,8,10,.9);padding:16px}
.photo.on{display:flex}
.photo img{max-width:100%;max-height:100%;border-radius:12px}
</style>

const MGS=['mell','hát','váll','tricepsz','bicepsz','láb','törzs'];

// Monokróm SVG ikonok (currentColor → követik a témát, sosem emojik).

const KEY='gymlog_v1';
let storeMode='none';

async function readKey(k){
  // Felhő-szinkron (1. fázis): belépve a felhő az igazság forrása.
  if(k===KEY && window.Auth && Auth.isLoggedIn()){
    try{ const c=await Auth.cloudRead(); if(c!=null){ storeMode='local'; return c; } }catch(e){}
  }
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(k); if(r&&r.value){storeMode='claude'; return r.value;} } }catch(e){}
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); if(storeMode==='none')storeMode='local';
       return localStorage.getItem(k); }catch(e){ storeMode='none'; }
  return null;
}
async function writeKey(k,v){
  try{ if(window.storage&&window.storage.set){ await window.storage.set(k,v); return true; } }catch(e){}
  try{ localStorage.setItem(k,v);
       if(k===KEY && window.Auth && Auth.isLoggedIn()) Auth.cloudWrite(v);  // felhőbe (fire-and-forget)
       return true; }catch(e){ return false; }
}

async function load(){
  const raw=await readKey(KEY);
  if(raw){ try{ S=Object.assign(S,JSON.parse(raw)); }catch(e){} }
  render();
}
async function save(){
  const v=JSON.stringify({sessions:S.sessions,active:S.active,weights:S.weights,
    notes:S.notes,photos:S.photos,injury:S.injury,lastBackup:S.lastBackup,
    customEx:S.customEx,routines:S.routines,programs:S.programs});
  const ok=await writeKey(KEY,v);
  if(!ok&&storeMode!=='none'){ storeMode='none'; render(); }
}

const LIB={}; LIB_ARR.forEach(e=>LIB[e.id]=e);
function exDef(id){ for(const d of PLAN) for(const e of d.ex) if(e.id===id) return e;
  if(S.customEx && S.customEx[id]) return S.customEx[id];
  if(LIB[id]) return LIB[id];
  return ARCHIVE[id] || {id:id,n:id,s:3,r:'10',w:0,rest:90,inc:2.5}; }
// Nap (edzés) feloldása: beépített PLAN VAGY saját routine. A visszaadott
// alak {id,name,sub,ex:[def,…]} – a hívók egységesen ezt használják.
function dayDef(id){
  const p=PLAN.find(d=>d.id===id); if(p) return p;
  const r=(S.routines||[]).find(x=>x.id===id);
  if(r) return {id:r.id, name:r.name, sub:r.sub||'', custom:true, ex:r.ex.map(exDef)};
  return null;
}
function dayName(s){ const d=dayDef(s.day); return (d&&d.name) || s.dayName || 'Edzés'; }
// Minden választható gyakorlat: beépítettek (PLAN, dedup) + archív + saját.
function exLibrary(){
  const seen=new Set(), out=[];
  PLAN.forEach(d=>d.ex.forEach(e=>{ if(!seen.has(e.id)){ seen.add(e.id); out.push({...e, src:'beépített'}); } }));
  LIB_ARR.forEach(e=>{ if(!seen.has(e.id)){ seen.add(e.id); out.push({...e, src:'könyvtár'}); } });
  Object.values(ARCHIVE).forEach(e=>{ if(!seen.has(e.id)){ seen.add(e.id); out.push({...e, src:'archív'}); } });
  Object.values(S.customEx||{}).forEach(e=>{ if(!seen.has(e.id)){ seen.add(e.id); out.push({...e, src:'saját'}); } });
  return out;
}
function uid(p){ return p+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6); }
function lastFor(id){ for(let i=S.sessions.length-1;i>=0;i--){ const s=S.sessions[i]; if(s.log[id]) return s.log[id]; } return null; }
// Okos súlyugrás: ha minden szett megvolt, a cél feletti túlteljesítés
// arányában nagyobbat lép (nem fix +inc). Pl. 5-ös célnál 11 ismétlés
// → ~4× lépés.
function smartInc(e,l){
  const t=parseInt(e.r);
  if(!l||!l.sets.length) return e.inc;
  const done = l.sets.length>=e.s && l.sets.every(x=>x!=null && x>=t);
  if(!done) return 0;
  const over = Math.min(...l.sets.filter(x=>x!=null)) - t;
  let mult=1; if(over>=6) mult=4; else if(over>=4) mult=3; else if(over>=2) mult=2;
  return e.inc*mult;
}
function startW(id){
  const l=lastFor(id), d=exDef(id);
  if(l) return Math.max(0, l.w + smartInc(d,l));
  if(S.weights[id]!=null) return S.weights[id];
  return d.w;
}
// Egy edzés összterhelése: súly × ismétlés összegezve (testsúlyos szettek
// 0 súllyal szerepelnek, ezért ez a terhelt súlyra fókuszáló, relatív szám).
function sessionLoad(s){ let sum=0; for(const id in s.log){ const l=s.log[id]; const w=l.w>0?l.w:0;
  l.sets.forEach(r=>{ if(r!=null) sum+=w*r; }); } return Math.round(sum); }
function injuryOn(){ return S.injury && S.injury.parts && S.injury.parts.length>0; }
function exAffected(e){ return injuryOn() && S.injury.parts.indexOf(e.mg)>=0; }

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmtDate(t){const d=new Date(t);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')}
function wLabel(e,w){ if(e.time) return w>0? '+'+w+' kg':'testsúly'; if(e.bw) return w>0? '+'+w:'testsúly'; return w }
function exDone(e,L){ return L && L.sets.length && L.sets.every(x=>x!=null); }

function render(){
  const a=document.getElementById('app');
  const immersive = (playing && !!S.active) || !!editing;
  document.body.classList.toggle('playing', immersive);
  if(editing==='program') a.innerHTML = programView();
  else if(editing==='routine') a.innerHTML = builderView();
  else if(playing && S.active) a.innerHTML = playerView();
  else if(tab==='home') a.innerHTML = homeView();
  else if(tab==='log') a.innerHTML = logView();
  else if(tab==='friends') a.innerHTML = friendsView();
  else a.innerHTML = progView();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
}

    <span class="cond" style="font-size:17px;font-weight:600;color:var(--red)">Sérülés-mód aktív – ${S.injury.parts.join(', ')}</span>
    <div class="small mut" style="margin-top:2px">Új edzésnél az érintett gyakorlatok kimaradnak, a többi súlya csökken.</div>

  if(S.active){
    const d=dayDef(S.active.day) || {name:S.active.dayName||'Edzés', ex:[]};
    const exN=d.ex.filter(e=>S.active.log[e.id]).length;
    const doneN=d.ex.filter(e=>exDone(e,S.active.log[e.id])).length;
    h+=`<div class="card" style="border-color:var(--brass)"><button class="daybtn" onclick="resumePlayer()">
      <span class="daytag" style="color:var(--brass)">${ICON.play}</span>
      <span class="grow"><span class="cond" style="font-size:21px;font-weight:600;display:block">Folytatás – ${esc(d.name)}</span>
      <span class="small dim">${doneN}/${exN} gyakorlat kész</span></span>
      <span style="color:var(--brass);font-size:22px">›</span></button></div>`;
  }
  const nextIdx = done ? (PLAN.findIndex(d=>d.id===S.sessions[done-1].day)+1)%4 : 0;
  PLAN.forEach((d,i)=>{
    const last = [...S.sessions].reverse().find(s=>s.day===d.id);
    h += `<div class="card"><button class="daybtn" onclick="startDay('${d.id}')">
      <span class="daytag">${i+1}</span>
      <span class="grow"><span class="cond" style="font-size:21px;font-weight:600;display:block">${d.name}${i===nextIdx&&!S.active?'<span class="pill">KÖVETKEZŐ</span>':''}</span>
      <span class="small dim">${d.sub}${last?' · utoljára '+fmtDate(last.t):' · még nem volt'}</span></span>
      <span style="color:var(--dim);font-size:22px">›</span></button></div>`;
  });
  // Edzéstervek (programok)
  (S.programs||[]).forEach(pr=>{
    h+=`<div class="top" style="padding:18px 0 8px"><div class="row"><span class="eyebrow grow">${esc(pr.name)}</span>

    pr.days.forEach(dId=>{ const d=dayDef(dId); if(!d) return;
      const last=[...S.sessions].reverse().find(s=>s.day===dId);
      h+=dayCard(dId, d.name, d.sub||(d.ex.length+' gyakorlat'), last, !!d.custom); });

  }
  h+=`<button class="btn" style="margin-top:8px" onclick="openBuilder()">+ Új edzés</button>
      <button class="btn" style="margin-top:8px" onclick="openProgram()">+ Új edzésterv</button>

function dayCard(id,name,sub,last,editable){
  return `<div class="card"><div class="row" style="gap:0">
    <button class="daybtn grow" onclick="startDay('${id}')">
      <span class="daytag">${ICON.dumbbell}</span>
      <span class="grow"><span class="cond" style="font-size:21px;font-weight:600;display:block">${esc(name)}</span>
      <span class="small dim">${esc(sub)}${last?' · utoljára '+fmtDate(last.t):''}</span></span></button>
    ${editable?`<button class="iconbtn" style="margin:0 12px 0 0" onclick="openBuilder('${id}')" aria-label="Szerkesztés" title="Szerkesztés">${ICON.edit}</button>`:''}
  </div></div>`;
}

function roundTo(v,step){ return Math.max(0, Math.round(v/step)*step); }
function startDay(id){
  if(S.active && !confirm('Van egy folyamatban lévő edzés. Eldobod és újat kezdesz?')) return;
  // Kihagyás-felismerés: 10 napnál hosszabb szünet után visszalépést ajánl.
  const lastT = S.sessions.length ? S.sessions[S.sessions.length-1].t : 0;
  const gap = lastT ? (Date.now()-lastT)/864e5 : 0;
  let deload=false;
  if(gap>10) deload = confirm(Math.round(gap)+' nap kihagyás.\n\nKérsz visszalépést? (kb. -15% súly és több ismétlés a célhoz, hogy fokozatosan épülj vissza.)');
  const d=dayDef(id); if(!d){ return; }
  S.active={day:id,t:Date.now(),log:{},deload:deload,dayName:d.name};
  d.ex.forEach(e=>{
    if(exAffected(e)) return;                 // sérülés-mód: érintett gyakorlat kihagyva
    let w=startW(e.id);
    if(deload && !e.bw) w=roundTo(w*0.85, e.inc);
    S.active.log[e.id]={w:w,sets:new Array(e.s).fill(null)};
  });
  curEx=0; playing=true; save(); render(); window.scrollTo(0,0);
}
function resumePlayer(){ if(S.active){ playing=true; render(); window.scrollTo(0,0); } }
function pausePlayer(){ playing=false; tab='home'; stopTimer(); render(); window.scrollTo(0,0); }
function discardActive(){ if(confirm('Biztos eldobod ezt az edzést?')){ S.active=null; playing=false; stopTimer(); tab='home'; save(); render(); window.scrollTo(0,0); } }
function exNav(i){ const d=dayDef(S.active.day)||{ex:[]}; const n=d.ex.filter(x=>S.active.log[x.id]).length;
  curEx=Math.max(0,Math.min(n-1,i)); render(); window.scrollTo(0,0); }

/* ================= Edzés-összeállító (saját edzések) ================ */
function openBuilder(id){
  if(id){ const r=S.routines.find(x=>x.id===id);
    draft = r ? {id:r.id,name:r.name,ex:r.ex.slice(),isNew:false} : null; if(!draft) return; }
  else draft = {id:uid('r_'),name:'',ex:[],isNew:true};
  editing='routine'; render(); window.scrollTo(0,0);
}
function closeBuilder(){ editing=false; draft=null; render(); window.scrollTo(0,0); }
function updateBuilderSave(){ const ok=draft&&draft.name.trim()&&draft.ex.length>0;
  document.querySelectorAll('#draftSave,#draftSaveTop').forEach(b=>b.disabled=!ok); }
function draftMove(i,dir){ const j=i+dir; if(j<0||j>=draft.ex.length) return;
  const a=draft.ex; [a[i],a[j]]=[a[j],a[i]]; render(); }
function draftRemove(i){ draft.ex.splice(i,1); render(); }
function saveDraft(){
  if(!draft.name.trim()||!draft.ex.length){ alert('Adj nevet és legalább egy gyakorlatot.'); return; }
  const r={id:draft.id,name:draft.name.trim(),sub:draft.ex.length+' gyakorlat',ex:draft.ex.slice()};
  const idx=S.routines.findIndex(x=>x.id===draft.id);
  if(idx>=0) S.routines[idx]=r; else S.routines.push(r);
  editing=false; draft=null; save(); tab='home'; render(); window.scrollTo(0,0);
}
function deleteRoutine(id){
  if(!confirm('Törlöd ezt a saját edzést? (A már naplózott edzések megmaradnak.)')) return;
  S.routines=S.routines.filter(x=>x.id!==id);
  (S.programs||[]).forEach(p=>{ p.days=p.days.filter(d=>d!==id); });
  editing=false; draft=null; save(); tab='home'; render(); window.scrollTo(0,0);
}
function builderView(){
  const canSave = draft.name.trim() && draft.ex.length>0;
  let items='';
  draft.ex.forEach((exId,i)=>{ const e=exDef(exId);
    items+=`<div class="card"><div class="pad row">
      <span class="grow"><span class="cond" style="font-size:18px;font-weight:600;display:block">${esc(e.n)}</span>
      <span class="small dim">${e.s}×${e.r}${e.mg?' · '+e.mg:''}</span></span>
      <button class="iconbtn" onclick="draftMove(${i},-1)" ${i===0?'disabled':''} aria-label="fel">↑</button>
      <button class="iconbtn" onclick="draftMove(${i},1)" ${i===draft.ex.length-1?'disabled':''} aria-label="le">↓</button>
      <button class="iconbtn" style="color:var(--red)" onclick="draftRemove(${i})" aria-label="törlés">×</button>
    </div></div>`;
  });
  if(!draft.ex.length) items=`<div class="empty" style="padding:24px">Még nincs gyakorlat.<br>Add hozzá lentebb.</div>`;
  return `<div class="player">
    <div class="ptop">
      <button class="iconbtn" onclick="closeBuilder()" aria-label="Mégse">${ICON.back}</button>
      <div class="pmid"><div class="d">Edzés összeállítása</div><div class="c">${draft.isNew?'új edzés':'szerkesztés'}</div></div>
      <button class="iconbtn" id="draftSaveTop" onclick="saveDraft()" ${canSave?'':'disabled'} style="color:var(--sage)" aria-label="Mentés">${ICON.check}</button>
    </div>
    <div class="pmain" style="justify-content:flex-start;gap:12px">
      <input id="draftName" type="text" placeholder="Edzés neve (pl. Láb nap)" value="${esc(draft.name)}"
        oninput="draft.name=this.value;updateBuilderSave()" style="width:100%;font-size:18px">
      ${items}
      <button class="btn" onclick="openExPicker()">+ Gyakorlat hozzáadása</button>
      ${!draft.isNew?`<button class="btn ghost" style="color:var(--red)" onclick="deleteRoutine('${draft.id}')">Edzés törlése</button>`:''}
      <button class="btn pri" id="draftSave" onclick="saveDraft()" ${canSave?'':'disabled'}>Mentés</button>
    </div>
  </div>`;
}

function deleteCustomEx(id){
  const used=(S.routines||[]).some(r=>r.ex.indexOf(id)>=0);
  if(!confirm('Törlöd ezt a saját gyakorlatot?'+(used?'\nA saját edzésekből is kikerül.':'')+'\n(A már naplózott edzésekben az adat megmarad.)')) return;
  delete S.customEx[id];
  (S.routines||[]).forEach(r=>{ r.ex=r.ex.filter(x=>x!==id); });
  save(); openManageEx();
}

let cxMg='', cxEditId=null, cxReturn='picker';

    <div class="row" style="gap:8px;margin-top:8px">
      <label class="small dim" style="flex:1">Kezdősúly<input id="cxW" type="number" inputmode="decimal" value="${val(e&&e.w,20)}" style="width:100%;margin-top:4px"></label>
      <label class="small dim" style="flex:1">Lépés<input id="cxInc" type="number" inputmode="decimal" value="${val(e&&e.inc,2.5)}" style="width:100%;margin-top:4px"></label>
      <label class="small dim" style="flex:1">Pihenő (mp)<input id="cxRest" type="number" inputmode="numeric" value="${val(e&&e.rest,90)}" style="width:100%;margin-top:4px"></label>
    </div>
    <label class="row small" style="gap:8px;margin-top:12px"><input id="cxBw" type="checkbox" ${e&&e.bw?'checked':''} style="width:auto"> Testsúlyos gyakorlat</label>

function pickCxMg(btn){ cxMg=btn.dataset.mg; document.querySelectorAll('#cxMg .whyc').forEach(b=>b.classList.toggle('on', b===btn)); }
function saveCustomEx(){
  const name=(document.getElementById('cxName').value||'').trim();
  if(!name){ alert('Adj nevet a gyakorlatnak.'); return; }
  const def={ n:name, mg:cxMg||'törzs',
    s:Math.max(1,parseInt(document.getElementById('cxSets').value)||3),
    r:(document.getElementById('cxReps').value||'10').trim(),
    w:Math.max(0,parseFloat(document.getElementById('cxW').value)||0),
    inc:Math.max(0.5,parseFloat(document.getElementById('cxInc').value)||2.5),
    rest:Math.max(10,parseInt(document.getElementById('cxRest').value)||90) };
  if(document.getElementById('cxBw').checked) def.bw=1;
  if(cxEditId){ def.id=cxEditId; S.customEx[cxEditId]=def; }
  else { const id=uid('cx_'); def.id=id; S.customEx[id]=def; if(cxReturn==='picker' && draft) draft.ex.push(id); }
  const ret=cxReturn; cxMg=''; cxEditId=null; save();
  if(ret==='manage') openManageEx();
  else { closeSheet(); render(); }
}

let prog=null;
function openProgram(id){
  if(id){ const p=S.programs.find(x=>x.id===id);
    prog = p ? {id:p.id,name:p.name,days:p.days.slice(),isNew:false} : null; if(!prog) return; }
  else prog = {id:uid('p_'),name:'',days:[],isNew:true};
  editing='program'; render(); window.scrollTo(0,0);
}
function closeProgram(){ editing=false; prog=null; render(); window.scrollTo(0,0); }
function progMove(i,dir){ const j=i+dir; if(j<0||j>=prog.days.length) return;
  const a=prog.days; [a[i],a[j]]=[a[j],a[i]]; render(); }
function progRemove(i){ prog.days.splice(i,1); render(); }
function saveProgram(){
  if(!prog.name.trim()||!prog.days.length){ alert('Adj nevet és legalább egy edzést.'); return; }
  const p={id:prog.id,name:prog.name.trim(),days:prog.days.slice()};
  const idx=S.programs.findIndex(x=>x.id===prog.id);
  if(idx>=0) S.programs[idx]=p; else S.programs.push(p);
  editing=false; prog=null; save(); tab='home'; render(); window.scrollTo(0,0);
}
function deleteProgram(id){ if(!confirm('Törlöd ezt az edzéstervet? (A benne lévő edzések megmaradnak.)')) return;
  S.programs=S.programs.filter(x=>x.id!==id); editing=false; prog=null; save(); tab='home'; render(); window.scrollTo(0,0); }
function programView(){
  const canSave = prog.name.trim() && prog.days.length>0;
  let items='';
  prog.days.forEach((dId,i)=>{ const d=dayDef(dId);
    items+=`<div class="card"><div class="pad row">
      <span class="grow"><span class="cond" style="font-size:18px;font-weight:600">${esc(d?d.name:'(törölt edzés)')}</span></span>
      <button class="iconbtn" onclick="progMove(${i},-1)" ${i===0?'disabled':''} aria-label="fel">↑</button>
      <button class="iconbtn" onclick="progMove(${i},1)" ${i===prog.days.length-1?'disabled':''} aria-label="le">↓</button>
      <button class="iconbtn" style="color:var(--red)" onclick="progRemove(${i})" aria-label="törlés">×</button>
    </div></div>`;
  });
  if(!prog.days.length) items=`<div class="empty" style="padding:24px">Még nincs edzés a tervben.<br>Add hozzá lentebb.</div>`;
  return `<div class="player">
    <div class="ptop">
      <button class="iconbtn" onclick="closeProgram()" aria-label="Mégse">${ICON.back}</button>
      <div class="pmid"><div class="d">Edzésterv</div><div class="c">${prog.isNew?'új terv':'szerkesztés'}</div></div>
      <button class="iconbtn" onclick="saveProgram()" ${canSave?'':'disabled'} style="color:var(--sage)" aria-label="Mentés">${ICON.check}</button>
    </div>
    <div class="pmain" style="justify-content:flex-start;gap:12px">
      <input id="progName" type="text" placeholder="Terv neve (pl. Nyári tömeg)" value="${esc(prog.name)}"
        oninput="prog.name=this.value" style="width:100%;font-size:18px">
      ${items}
      <button class="btn" onclick="openDayPicker()">+ Edzés hozzáadása</button>
      ${(S.programs||[]).some(x=>x.id===prog.id)?`<button class="btn" onclick="openSharePlan('${prog.id}')">Megosztás baráttal</button>`:''}
      ${!prog.isNew?`<button class="btn ghost" style="color:var(--red)" onclick="deleteProgram('${prog.id}')">Terv törlése</button>`:''}
      <button class="btn pri" onclick="saveProgram()" ${canSave?'':'disabled'}>Mentés</button>
    </div>
  </div>`;
}
function openDayPicker(){
  const days=PLAN.map(d=>({id:d.id,name:d.name,src:'beépített'}))
    .concat(S.routines.map(r=>({id:r.id,name:r.name,src:'saját'})));
  const rows=days.map(d=>`<button class="btn" style="text-align:left;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px" onclick="addToProg('${d.id}')">
      <span><span style="font-weight:600">${esc(d.name)}</span> <span class="small dim">· ${d.src}</span></span>
      <span style="color:var(--brass);font-size:24px">+</span></button>`).join('');
  document.getElementById('sheetIn').innerHTML=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">Edzés hozzáadása a tervhez</span>
    <h2 style="font-size:22px">Válassz edzést</h2></div>
    <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <div style="max-height:52vh;overflow-y:auto;margin-top:12px">${rows}</div>`;
  document.getElementById('sheet').classList.add('on');
}
function addToProg(dId){ prog.days.push(dId); closeSheet(); render(); }

function playerView(){
  const d=dayDef(S.active.day) || {name:S.active.dayName||'Edzés', ex:[]};
  const exs=d.ex.filter(x=>S.active.log[x.id]);   // sérülés miatt kihagyottak nélkül
  if(curEx>=exs.length) curEx=exs.length-1; if(curEx<0) curEx=0;
  const e=exs[curEx], L=S.active.log[e.id], last=lastFor(e.id), t=parseInt(e.r);
  const complete=exDone(e,L), hit=L.sets.every(x=>x!=null&&x>=t);
  const missed=L.sets.some(x=>x!=null&&x<t);
  const isLast=curEx===exs.length-1;

  let dots='';
  exs.forEach((x,i)=>{ const done=exDone(x,S.active.log[x.id]);
    dots+=`<button class="pdot ${i===curEx?'cur':(done?'done':'')}" onclick="exNav(${i})" aria-label="gyakorlat ${i+1}"></button>`; });

  let chips='';
  L.sets.forEach((v,i)=>{ const cls=v==null?'':(v>=t?'done':'miss');
    chips+=`<button class="chip ${cls}" onclick="openSet('${e.id}',${i})">
      <span class="r">${v==null?'·':v}</span><span class="l">${i+1}. sz</span></button>`; });

  let wt='';
  if(!e.time) wt=`<div class="wt">
    <button onclick="bump('${e.id}',-1)" aria-label="kevesebb">−</button>
    <div class="val">${wLabel(e,L.w)}${e.bw&&L.w<=0?'':'<span>kg</span>'}</div>
    <button onclick="bump('${e.id}',1)" aria-label="több">+</button></div>`;

  let note='';
  if(last) note=`<div class="prev">Előző: ${wLabel(e,last.w)}${e.bw&&last.w<=0?'':' kg'} × ${last.sets.map(x=>x==null?'–':x).join(', ')}</div>`;
  else note=`<div class="prev dim">Első alkalom – a technika a cél, ne a súly.</div>`;
  const inc=smartInc(e,{sets:L.sets,w:L.w})||e.inc;
  const hint = hit?`<div class="hint">Mind megvolt → jövő héten ${wLabel(e,L.w+inc)}${e.bw&&L.w+inc<=0?'':' kg'} (+${inc})</div>`:'';

  // Állandó gyakorlat-jegyzet + fotó
  const pn=S.notes[e.id], ph=S.photos[e.id];
  const noteBlock = (pn||ph) ? `<div class="exnote">
      ${ph?`<img class="exphoto" src="${ph}" onclick="viewPhoto('${e.id}')" alt="beállítás fotó">`:''}
      ${pn?`<div class="exnote-t">${esc(pn)}</div>`:''}
    </div>` : '';

  // Terv kontra valóság: ha van kihagyott ismétlés, egy koppintással megkérdi az okot
  let why='';
  if(complete && missed && !e.time){
    const cur=L.why;
    why=`<div class="whyrow"><span class="small dim" style="width:100%">Miért tért el a tervtől?</span>
      ${[['busy','Gép foglalt'],['heavy','Túl nehéz volt'],['time','Kevés idő']].map(([k,lab])=>
        `<button class="whyc ${cur===k?'on':''}" onclick="setWhy('${e.id}','${k}')">${lab}</button>`).join('')}</div>`;
  }

  const deloadBanner = S.active.deload ? `<div class="banner">Kihagyás utáni visszaépítés: kisebb súly, a célnál pár ismétléssel több.</div>` : '';

  return `<div class="player">
    <div class="ptop">
      <button class="iconbtn" onclick="pausePlayer()" aria-label="Szünet" title="Szünet">${ICON.back}</button>
      <div class="pmid"><div class="d">${d.name}${S.active.deload?' · visszaépítés':''}</div><div class="c">gyakorlat ${curEx+1} / ${exs.length}</div></div>
      <button class="iconbtn" onclick="finish()" aria-label="Edzés lezárása" title="Edzés lezárása" style="color:var(--sage)">${ICON.check}</button>
    </div>
    <div class="pdots">${dots}</div>
    <div class="pmain">
      ${deloadBanner}
      <div>
        <div class="row" style="align-items:flex-start">
          <div class="grow"><div class="pname">${esc(e.n)}</div>
          <div class="pmeta">${complete?'<span class="done-badge">kész</span>':`<span class="tgt">cél: ${e.s} × ${e.r}${e.time?'':' ism.'}</span>`}</div></div>
          <button class="iconbtn" onclick="openNoteSheet('ex','${e.id}')" aria-label="Jegyzet és fotó" title="Jegyzet és fotó">${ICON.edit}</button>
        </div>
      </div>
      ${noteBlock}
      ${wt}
      <div class="pchips">${chips}</div>
      ${note}${hint}
      ${why}
    </div>
    <div class="pfoot">
      <button class="btn" onclick="exNav(${curEx-1})" ${curEx===0?'disabled':''} style="flex:0 0 40%">‹ Előző</button>
      ${isLast
        ? `<button class="btn pri" onclick="finish()" style="flex:1">Edzés lezárása</button>`
        : `<button class="btn pri" onclick="exNav(${curEx+1})" style="flex:1">Következő ›</button>`}
    </div>
    <div class="row" style="justify-content:center;gap:18px">
      <button class="discard" onclick="openNoteSheet('day','')">Nap jegyzete${S.active.note?' •':''}</button>
      <button class="discard" onclick="discardActive()">Edzés eldobása</button>
    </div>
  </div>`;
}
function setWhy(id,k){ const L=S.active.log[id]; L.why=(L.why===k?null:k); save(); render(); }

function bump(id,dir){ const e=exDef(id),L=S.active.log[id];
  L.w=Math.max(0, Math.round((L.w+dir*e.inc)*10)/10); S.weights[id]=L.w; save(); render(); }

let cur=null;
function openSet(id,i){
  cur={id,i}; const e=exDef(id), L=S.active.log[id], t=parseInt(e.r);
  const opts=[]; for(let k=Math.max(1,t-4);k<=t+6;k++) opts.push(k);
  let h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">${i+1}. szett</span>
    <h2 style="font-size:24px">${esc(e.n)}</h2><span class="small dim">cél: ${e.r}${e.time?'':' ismétlés'}</span></div>
    <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>
    <div class="kb">`;
  opts.forEach(k=>{ h+=`<button onclick="setRep(${k})" style="${k==t?'border-color:var(--brass);color:var(--brass)':''}">${k}</button>`; });
  h+=`</div><button class="btn" style="margin-top:12px;color:var(--mut)" onclick="setRep(null)">Törlés</button>`;
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
function setRep(v){
  const e=exDef(cur.id); S.active.log[cur.id].sets[cur.i]=v;
  closeSheet(); save(); render();
  if(v!=null) startTimer(e.rest);
}

async function acquireWake(){ try{ if('wakeLock' in navigator && !wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{ wl=null; }); } }catch(e){ wl=null; } }
function releaseWake(){ try{ if(wl){ wl.release(); wl=null; } }catch(e){ wl=null; } }
function startTimer(sec){
  tLen=sec; tEnd=Date.now()+sec*1000;
  document.getElementById('rest').classList.add('on');
  acquireWake();                                   // ne aludjon el a képernyő pihenő közben
  clearInterval(tInt); tInt=setInterval(tick,200); tick();
}
function stopTimer(){ clearInterval(tInt); const r=document.getElementById('rest'); if(r) r.classList.remove('on'); releaseWake(); }
function tick(){
  const left=Math.max(0,tEnd-Date.now());
  const s=Math.ceil(left/1000);
  document.getElementById('restVal').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const R=52, C=2*Math.PI*R, frac=tLen? left/(tLen*1000) : 0;
  const ring=document.getElementById('restRing');
  ring.style.strokeDasharray=C.toFixed(1); ring.style.strokeDashoffset=(C*(1-frac)).toFixed(1);
  if(left<=0){ clearInterval(tInt); if(navigator.vibrate) navigator.vibrate([200,100,200]);
    releaseWake(); setTimeout(()=>document.getElementById('rest').classList.remove('on'),1500); }
}
document.getElementById('restSkip').onclick=stopTimer;
// A képernyőzár feloldódhat háttérbe váltáskor – ha még megy a pihenő, kérjük vissza.
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'
  && document.getElementById('rest').classList.contains('on') && Date.now()<tEnd) acquireWake(); });

function finish(){
  const any=Object.values(S.active.log).some(l=>l.sets.some(x=>x!=null));
  if(!any){ alert('Egyetlen szettet sem rögzítettél.'); return; }
  S.sessions.push(S.active); S.active=null; playing=false; stopTimer(); save(); syncStats(); tab='log'; render(); window.scrollTo(0,0);
}

function logView(){
  if(!S.sessions.length) return `<div class="wrap"><div class="top"><h1 style="font-size:34px">Napló</h1></div>
    <div class="empty">Még nincs lezárt edzés.<br>Kezdd az Edzés fülön.</div>
    <button class="btn" onclick="loadBundled()" style="margin-bottom:8px;color:var(--mut)">Tesztadat betöltése</button>
    <button class="btn" onclick="restore()" style="margin-bottom:20px;color:var(--mut)">Visszaállítás mentésből</button></div>`;
  let h=`<div class="wrap"><div class="top"><h1 style="font-size:34px">Napló</h1>
    <p class="mut small" style="margin:6px 0 0">${S.sessions.length} edzés</p></div>`;
  const loads=S.sessions.map(sessionLoad);
  const avg=loads.reduce((a,b)=>a+b,0)/(loads.length||1);
  const WHY={busy:'gép foglalt',heavy:'túl nehéz',time:'kevés idő'};
  [...S.sessions].reverse().forEach((s,ri)=>{
    const d=dayDef(s.day)||{ex:[]}; const dn=dayName(s); const idx=S.sessions.length-1-ri;
    const tot=Object.values(s.log).reduce((a,l)=>a+l.sets.filter(x=>x!=null).length,0);
    const load=loads[idx], hi=avg>0 && load>avg*1.3;
    h+=`<div class="card"><div class="pad" style="border-bottom:1px solid var(--line)">
      <div class="row"><div class="grow"><span class="cond" style="font-size:20px;font-weight:600">${esc(dn)}</span>
      <div class="small dim">${fmtDate(s.t)} · ${tot} szett · <span class="num">${load.toLocaleString('hu')}</span> kg terhelés${hi?' <span style="color:var(--red);font-weight:600">· kiugró</span>':''}</div></div>
      <button onclick="del(${idx})" class="small dim" style="padding:8px">Törlés</button></div>
      ${s.note?`<div class="small mut" style="padding:0 16px 10px">Jegyzet: ${esc(s.note)}</div>`:''}</div>`;
    const seen=new Set();
    d.ex.forEach(e=>{ seen.add(e.id); const l=s.log[e.id]; if(!l||!l.sets.some(x=>x!=null))return;
      h+=`<div class="hrow"><span class="small grow">${esc(e.n)}${l.why?` <span class="dim" style="font-size:11px">· ${WHY[l.why]}</span>`:''}</span>
        <span class="small num mut">${wLabel(e,l.w)}${e.bw&&l.w<=0?'':' kg'} × ${l.sets.map(x=>x==null?'–':x).join(', ')}</span></div>`; });
    Object.keys(s.log).forEach(id=>{ if(seen.has(id))return; const l=s.log[id];
      if(!l||!l.sets.some(x=>x!=null))return; const e=exDef(id);
      h+=`<div class="hrow"><span class="small grow">${esc(e.n)} <span class="dim" style="font-size:11px">· kivéve</span></span>
        <span class="small num mut">${wLabel(e,l.w)}${e.bw&&l.w<=0?'':' kg'} × ${l.sets.map(x=>x==null?'–':x).join(', ')}</span></div>`; });
    h+='</div>';
  });
  h+=`<button class="btn" onclick="copyAll()" style="margin-bottom:8px">Napló másolása szövegként</button>
      <button class="btn" onclick="backup()" style="margin-bottom:8px;color:var(--mut)">Biztonsági mentés (adatfájl)</button>
      <button class="btn" onclick="restore()" style="margin-bottom:20px;color:var(--mut)">Visszaállítás mentésből</button>`;
  return h+'</div>';
}
function backup(){
  const v=JSON.stringify({sessions:S.sessions,weights:S.weights,notes:S.notes,photos:S.photos,
    customEx:S.customEx,routines:S.routines,programs:S.programs});
  const b=new Blob([v],{type:'application/json'}), u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u;
  a.download='edzesnaplo-'+fmtDate(Date.now()).replace(/\./g,'')+'.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
  S.lastBackup=Date.now(); nagOff=true; save(); render();
}
function restore(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=()=>{ const f=i.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!Array.isArray(d.sessions)) throw 0;
      if(!confirm('Ez felülírja a jelenlegi '+S.sessions.length+' edzést '+d.sessions.length+' mentett edzéssel. Folytatod?')) return;
      S.sessions=d.sessions; S.weights=d.weights||{}; if(d.notes)S.notes=d.notes; if(d.photos)S.photos=d.photos;
      if(d.customEx)S.customEx=d.customEx; if(d.routines)S.routines=d.routines; if(d.programs)S.programs=d.programs;
      save(); render();
    }catch(e){ alert('Ez nem érvényes mentésfájl.'); } };
    r.readAsText(f); };
  i.click();
}
async function loadBundled(){
  try{
    const res=await fetch('edzesnaplo-backup.json',{cache:'no-store'});
    if(!res.ok) throw 0;
    const d=await res.json();
    if(!Array.isArray(d.sessions)) throw 0;
    if(S.sessions.length && !confirm('Ez felülírja a jelenlegi '+S.sessions.length+' edzést '+d.sessions.length+' mentett edzéssel. Folytatod?')) return;
    S.sessions=d.sessions; S.weights=d.weights||{}; save(); render();
  }catch(e){ alert('A tesztadat betöltése nem sikerült.'); }
}
function del(i){ if(confirm('Törlöd ezt az edzést?')){ S.sessions.splice(i,1); save(); render(); } }
function copyAll(){
  let t='Edzésnapló\n\n';
  S.sessions.forEach(s=>{ const d=dayDef(s.day)||{ex:[]};
    t+=fmtDate(s.t)+' — '+dayName(s)+'\n';
    const seen=new Set();
    d.ex.forEach(e=>{seen.add(e.id); const l=s.log[e.id]; if(l&&l.sets.some(x=>x!=null))
      t+='  '+e.n+': '+wLabel(e,l.w)+(e.bw&&l.w<=0?'':' kg')+' × '+l.sets.map(x=>x==null?'–':x).join(', ')+'\n';});
    Object.keys(s.log).forEach(id=>{ if(seen.has(id))return; const l=s.log[id];
      if(!l.sets.some(x=>x!=null))return; const e=exDef(id);
      t+='  '+e.n+' (kivéve): '+wLabel(e,l.w)+(e.bw&&l.w<=0?'':' kg')+' × '+l.sets.map(x=>x==null?'–':x).join(', ')+'\n';});
    t+='\n'; });
  navigator.clipboard.writeText(t).then(()=>alert('Vágólapra másolva. Beillesztheted a chatbe.'),()=>alert('Nem sikerült a másolás.'));
}

function progView(){
  const ids=[]; const seen=new Set();
  PLAN.forEach(d=>d.ex.forEach(e=>{ seen.add(e.id);
    if(S.sessions.some(s=>s.log[e.id]&&s.log[e.id].sets.some(x=>x!=null))) ids.push(e.id); }));
  S.sessions.forEach(s=>Object.keys(s.log).forEach(id=>{
    if(seen.has(id)||ids.includes(id))return;
    if(s.log[id].sets.some(x=>x!=null)) ids.push(id); }));
  if(!ids.length) return `<div class="wrap"><div class="top"><h1 style="font-size:34px">Haladás</h1></div>
    <div class="empty">Két-három edzés után lesz mit mutatni.</div></div>`;
  let h=`<div class="wrap"><div class="top"><h1 style="font-size:34px">Haladás</h1>
    <p class="mut small" style="margin:6px 0 0">Munkasúly gyakorlatonként</p></div>`;
  ids.forEach(id=>{
    const e=exDef(id);
    const pts=S.sessions.filter(s=>s.log[id]&&s.log[id].sets.some(x=>x!=null)).map(s=>s.log[id].w);
    const mn=Math.min(...pts), mx=Math.max(...pts), rng=(mx-mn)||1;
    let d='';
    pts.forEach((p,i)=>{ const x=pts.length>1? i/(pts.length-1)*100 : 50; const y=38-((p-mn)/rng)*32; d+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1); });
    const delta=pts[pts.length-1]-pts[0];
    h+=`<div class="card"><div class="pad">
      <div class="row" style="align-items:baseline"><span class="cond grow" style="font-size:19px;font-weight:600">${esc(e.n)}</span>
      <span class="num" style="font-size:24px;font-weight:700">${wLabel(e,pts[pts.length-1])}<span class="small dim" style="font-weight:400">${e.bw&&pts[pts.length-1]<=0?'':' kg'}</span></span></div>
      <div class="small ${delta>0?'':'dim'}" style="${delta>0?'color:var(--sage)':''}">${delta>0?'+'+delta+' kg az indulás óta':delta<0?delta+' kg':'változatlan'} · ${pts.length} alkalom</div>
      ${pts.length>1?`<svg class="spark" viewBox="0 0 100 44" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="var(--brass)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`:''}
      </div></div>`;
  });
  return h+'</div>';
}

/* ---- Jegyzetek (állandó + aznapi) és fotó -------------------------- */
function openNoteSheet(kind,id){
  let h=`<div class="grabber"></div>`;
  if(kind==='ex'){
    const e=exDef(id), pn=S.notes[id]||'', ph=S.photos[id];

function saveNote(kind,id){
  const v=document.getElementById('noteTa').value.trim();
  if(kind==='ex'){ if(v) S.notes[id]=v; else delete S.notes[id]; }
  else if(S.active){ if(v) S.active.note=v; else delete S.active.note; }
  closeSheet(); save(); render();
}
function addPhoto(id,file){
  if(!file) return;
  const ta=document.getElementById('noteTa'); const keep=ta?ta.value:'';   // ne vesszen el a beírt jegyzet
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image(); img.onload=()=>{
    const max=800, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let data; try{ data=c.toDataURL('image/jpeg',0.6); }catch(e){ alert('A kép feldolgozása nem sikerült.'); return; }
    S.photos[id]=data; save();
    if(storeMode==='none'){ delete S.photos[id]; alert('A kép nem fért el a tárolóban – törölj néhány fotót.'); }
    openNoteSheet('ex',id);
    const ta2=document.getElementById('noteTa'); if(ta2&&keep) ta2.value=keep;
  }; img.src=rd.result; };
  rd.readAsDataURL(file);
}
function removePhoto(id){ const ta=document.getElementById('noteTa'); const keep=ta?ta.value:'';
  delete S.photos[id]; save(); openNoteSheet('ex',id);
  const ta2=document.getElementById('noteTa'); if(ta2&&keep) ta2.value=keep; }
function viewPhoto(id){ const ph=S.photos[id]; if(!ph) return;

/* ---- Edzésterv megosztása / importálása ---------------------------- */
// A megosztott terv önálló csomag: a program + a benne lévő SAJÁT edzések
// + a hivatkozott SAJÁT gyakorlatok defjei. A beépítettek a fogadónál oldódnak fel.
function buildPlanPayload(programId){
  const p=(S.programs||[]).find(x=>x.id===programId); if(!p) return null;
  const routines={}, customEx={};
  p.days.forEach(dId=>{ const r=(S.routines||[]).find(x=>x.id===dId);
    if(r){ routines[r.id]=JSON.parse(JSON.stringify(r));
      (r.ex||[]).forEach(exId=>{ if(S.customEx&&S.customEx[exId]) customEx[exId]=JSON.parse(JSON.stringify(S.customEx[exId])); }); } });
  return { program:{name:p.name, days:p.days.slice()}, routines, customEx };
}
function importPlan(payload){
  if(!payload||!payload.program) return;
  const exMap={};
  Object.values(payload.customEx||{}).forEach(e=>{ const nid=uid('cx_'); exMap[e.id]=nid; S.customEx[nid]={...e, id:nid}; });
  const dayMap={};
  Object.values(payload.routines||{}).forEach(r=>{ const nid=uid('r_'); dayMap[r.id]=nid;
    const ex=(r.ex||[]).map(x=> exMap[x]||x );
    S.routines.push({ id:nid, name:r.name, sub:ex.length+' gyakorlat', ex }); });
  const days=(payload.program.days||[]).map(d=> dayMap[d]||d );
  S.programs.push({ id:uid('p_'), name:payload.program.name||'Megosztott terv', days });
  save();
}
async function openSharePlan(programId){
  if(!(window.Auth&&Auth.isLoggedIn())){ alert('A megosztáshoz lépj be a fiókodba (Barátok fül).'); return; }
  if(!friendsData) await refreshFriends();
  const me=Auth.currentUser().id;
  const acc=(friendsData||[]).filter(r=>r.status==='accepted');
  let h=`<div class="grabber"></div>
    <div class="row"><div class="grow"><span class="eyebrow">Edzésterv megosztása</span><h2 style="font-size:22px">Melyik baráttal?</h2></div>
    <button onclick="closeSheet()" style="font-size:26px;color:var(--dim);padding:0 8px">×</button></div>`;
  if(!acc.length){ h+=`<div class="empty" style="padding:16px 0">Előbb vegyél fel barátot a Barátok fülön.</div>`; }
  else acc.forEach(r=>{ const id=r.requester===me?r.addressee:r.requester; const nm=r.requester===me?(r.addressee_name||'Barát'):(r.requester_name||'Barát');
    h+=`<button class="btn" style="margin-bottom:8px" onclick="doSharePlan('${programId}','${id}','${esc(nm)}')">${esc(nm)}</button>`; });
  document.getElementById('sheetIn').innerHTML=h;
  document.getElementById('sheet').classList.add('on');
}
async function doSharePlan(programId, toId, toName){
  const payload=buildPlanPayload(programId); const p=(S.programs||[]).find(x=>x.id===programId);
  if(!payload){ alert('Előbb mentsd el a tervet.'); return; }
  let ok=false; try{ ok=await Auth.sharePlan(toId, p.name, payload); }catch(e){}
  closeSheet(); alert(ok? ('Elküldve neki: '+toName) : 'Nem sikerült elküldeni.');
}
async function doImportPlan(shareId){
  const sp=(sharedPlansData||[]).find(x=>x.id===shareId); if(!sp) return;
  importPlan(sp.payload);
  try{ await Auth.deleteSharedPlan(shareId); }catch(e){}
  refreshFriends(); alert('Terv importálva – megtalálod a főoldaladon.');
}

function currentTheme(){ try{ return localStorage.getItem('gymlog_theme')||'auto'; }catch(e){ return 'auto'; } }
function effectiveDark(){ const t=currentTheme();
  if(t==='dark') return true; if(t==='light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(){
  const t=currentTheme(), root=document.documentElement;
  if(t==='auto') delete root.dataset.theme; else root.dataset.theme=t;
  const dark=effectiveDark();
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=dark?'#0F1317':'#F4F2EC';
  const b=document.getElementById('themeBtn'); if(b) b.innerHTML=dark?ICON.moon:ICON.sun;
}
function paintIcons(){
  const set=(sel,svg)=>{ const el=document.querySelector(sel); if(el) el.innerHTML=svg; };
  set('#accountBtn', ICON.account);
  set('#injuryBtn', ICON.injury);
  const navIcon={home:ICON.dumbbell, log:ICON.list, prog:ICON.chart, friends:ICON.friends};
  document.querySelectorAll('.nav button').forEach(btn=>{ const ic=btn.querySelector('.ic'); if(ic)
    ic.innerHTML = navIcon[btn.dataset.tab] || ICON.chart; });
}
function toggleTheme(){
  try{ localStorage.setItem('gymlog_theme', effectiveDark()?'light':'dark'); }catch(e){}
  applyTheme();
}
document.getElementById('themeBtn').onclick=toggleTheme;
if(window.matchMedia){ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(currentTheme()==='auto') applyTheme(); }); }
applyTheme();

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0);
  if(tab==='friends') refreshFriends();});
document.getElementById('sheet').onclick=e=>{ if(e.target.id==='sheet') closeSheet(); };
paintIcons();
load().then(updateInjuryBtn);

// Felhő-szinkron indítása (inert, ha nincs supabase-config.js).
if(window.Auth){
  Auth.hooks.reload = ()=>load().then(updateInjuryBtn);
  Auth.hooks.onChange = async ()=>{ updateAuthBtn();
    if(Auth.isLoggedIn()){ await loadProfile(); syncStats(); refreshFriends(); }
    else { myProfile=null; friendsData=null; sharedPlansData=null; if(tab==='friends') render(); } };
  Auth.init().catch(()=>{});
}
updateAuthBtn();

// Service worker – offline app-héj. Az edzésadatot (localStorage) nem érinti.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
